<style>
  /* Layout: PassReady's dark slate + emerald system; a game switcher, then one animated play surface per game with a confetti canvas over the top. Single dark theme, as on the live site. */
  :root{
    --bg:#0F172A; --bg2:#1E293B; --line:rgba(51,65,85,.6); --card:rgba(30,41,59,.62);
    --ink:#F8FAFC; --ink2:#CBD5E1; --mute:#94A3B8; --faint:#64748B;
    --em:#10B981; --em4:#34D399; --blue:#3B82F6; --blue4:#60A5FA;
    --amber:#F59E0B; --amber4:#FBBF24; --red:#EF4444; --red4:#F87171;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --spring:cubic-bezier(.34,1.56,.64,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg) linear-gradient(160deg,#0F172A 0%,#1E293B 50%,#0F172A 100%) fixed; color:var(--ink2); font:16px/1.55 var(--sans); overflow-x:hidden}
  .wrap{max-width:820px; margin:0 auto; padding-inline:16px; padding-block:18px 48px}
  .preview{background:rgba(245,158,11,.14); border:1px solid rgba(251,191,36,.35); color:var(--amber4); font-size:13px; font-weight:600; text-align:center; padding:7px 12px; border-radius:10px; margin-bottom:16px}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; color:var(--ink)}
  .brand b{color:var(--em4)}
  .brand .bt{line-height:1.1}
  .brand small{display:block; font-weight:600; font-size:11px; color:var(--em4); letter-spacing:.02em; margin-top:2px}
  .chip{width:36px; height:36px; border-radius:10px; background:rgba(16,185,129,.16); display:grid; place-items:center}
  .chip svg{width:20px; height:20px; color:var(--em4)}
  .backs{display:flex; gap:14px; flex-wrap:wrap}
  .switch{display:flex; gap:6px; padding:5px; background:rgba(15,23,42,.65); border:1px solid var(--line); border-radius:999px; position:relative}
  .sw{font:inherit; font-weight:700; font-size:14px; border:none; border-radius:999px; padding:8px 16px; cursor:pointer; background:transparent; color:var(--mute); transition:background .25s, color .25s}
  .sw[aria-selected="true"]{background:var(--em); color:#04261C}
  button:focus-visible{outline:2.5px solid var(--em4); outline-offset:2px}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 20px; position:relative; overflow:hidden}
  .panel.shake{animation:pshake .42s}
  .panel::after{content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit; box-shadow:inset 0 0 0 0 transparent; transition:box-shadow .5s}
  .panel.flash-bad::after{box-shadow:inset 0 0 90px 10px rgba(239,68,68,.35); transition:none}
  .panel.flash-good::after{box-shadow:inset 0 0 90px 10px rgba(16,185,129,.28); transition:none}
  @keyframes pshake{15%{transform:translateX(-8px) rotate(-.4deg)}35%{transform:translateX(7px) rotate(.3deg)}55%{transform:translateX(-5px)}75%{transform:translateX(3px)}}

  .intro h1{font-size:clamp(26px,5vw,36px); color:var(--ink); letter-spacing:-.025em; line-height:1.1; margin:6px 0 8px; text-wrap:balance}
  .intro p{margin:0 0 16px; color:var(--mute); max-width:60ch}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--em4)}
  .rules{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin:0 0 18px; padding:0; list-style:none}
  .rules li{background:rgba(15,23,42,.5); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px}
  .rules b{display:block; color:var(--ink); font-size:14.5px; margin-bottom:2px}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:700; font-size:15px; border:none; border-radius:11px; padding:12px 22px; cursor:pointer; background:var(--em); color:#04261C; transition:transform .15s var(--spring), background .15s; box-shadow:0 8px 22px -10px rgba(16,185,129,.7)}
  .btn:hover{background:var(--em4); transform:translateY(-2px)}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent; color:var(--ink2); border:1px solid var(--line); box-shadow:none}
  .btn.ghost:hover{background:rgba(51,65,85,.4)}
  .btn.pulse{animation:bpulse 1.8s ease-in-out infinite}
  @keyframes bpulse{50%{box-shadow:0 0 0 8px rgba(16,185,129,.12), 0 8px 22px -10px rgba(16,185,129,.7)}}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  label.sel{font-size:13px; font-weight:700; color:var(--mute); display:flex; flex-direction:column; gap:5px}
  select{font:inherit; font-size:15px; color:var(--ink); background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:9px 12px}

  /* entrance */
  .in{animation:rise .5s var(--spring) both}
  @keyframes rise{from{opacity:0; transform:translateY(18px) scale(.98)}}
  .slide-in{animation:slidein .45s cubic-bezier(.22,.61,.36,1) both}
  @keyframes slidein{from{opacity:0; transform:translateX(40px)}}

  /* HUD */
  .hud{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
  .hud .stat{display:flex; flex-direction:column; min-width:60px; position:relative}
  .hud .k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
  .hud .v{font-size:24px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.1}
  .bump{animation:bump .45s var(--spring)}
  @keyframes bump{40%{transform:scale(1.35); color:var(--em4)}}
  .streak{display:inline-flex; align-items:center; gap:6px}
  .mult{font-size:12px; font-weight:800; color:#04261C; background:var(--amber4); border-radius:999px; padding:1px 8px; animation:bump .45s var(--spring)}
  .streak.hot .v{color:var(--amber4); text-shadow:0 0 18px rgba(251,191,36,.55)}
  .hearts{display:flex; gap:4px}
  .heart{width:24px; height:24px; transition:transform .3s}
  .heart.lost{animation:heartbreak .7s forwards}
  @keyframes heartbreak{20%{transform:scale(1.4)}60%{transform:scale(.6) rotate(-25deg); opacity:.6}100%{transform:scale(.9); opacity:.35; filter:grayscale(1)}}
  .ring{position:relative; width:52px; height:52px}
  .ring svg{transform:rotate(-90deg)}
  .ring .track{stroke:#334155; fill:none}
  .ring .prog{stroke:var(--em); fill:none; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s}
  .ring.low .prog{stroke:var(--amber)} .ring.crit .prog{stroke:var(--red)}
  .ring.crit{animation:tick 1s ease-in-out infinite}
  @keyframes tick{50%{transform:scale(1.08)}}
  .ring span{position:absolute; inset:0; display:grid; place-items:center; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
  .float{position:absolute; left:0; top:-6px; font-weight:800; font-size:18px; color:var(--em4); pointer-events:none; animation:floatup 1.1s ease-out forwards; white-space:nowrap}
  @keyframes floatup{from{opacity:1; transform:translateY(0) scale(.8)}20%{transform:translateY(-8px) scale(1.15)}to{opacity:0; transform:translateY(-46px) scale(1)}}

  .meta{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
  .tag{font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px; border:1px solid rgba(96,165,250,.35); color:var(--blue4); background:rgba(59,130,246,.1)}
  .qn{font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums}
  .progress{display:flex; gap:4px; margin-bottom:14px}
  .progress i{flex:1; height:5px; border-radius:999px; background:#334155; transition:background .4s}
  .progress i.p3{background:var(--em)} .progress i.z{background:var(--mute)} .progress i.n1{background:var(--amber)} .progress i.n2{background:var(--red)}
  .progress i.cur{background:var(--blue4); animation:tick 1.2s ease-in-out infinite}
  .scenario{font-size:17px; color:var(--ink); line-height:1.5; margin:0 0 14px}
  .opts{display:grid; gap:9px}
  .opt{text-align:left; font:inherit; font-size:15px; line-height:1.45; color:var(--ink2); background:rgba(15,23,42,.55); border:1px solid var(--line); border-radius:13px; padding:12px 14px; cursor:pointer; display:flex; gap:10px; position:relative; animation:rise .45s var(--spring) both; transition:transform .2s var(--spring), border-color .2s, background .2s, opacity .3s}
  .opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
  .opt:hover:not([disabled]){border-color:rgba(52,211,153,.6); transform:translateX(4px)}
  .opt:active:not([disabled]){transform:scale(.98)}
  .opt .w{flex:0 0 auto; min-width:36px; text-align:center; font-weight:800; font-size:13px; border-radius:7px; padding:2px 0; align-self:flex-start; transform:scale(0); transition:transform .4s var(--spring)}
  .opt[disabled]{cursor:default}
  .opt.revealed .w{transform:scale(1)}
  .opt.revealed:not(.best):not(.picked){opacity:.55}
  .w.p3{color:var(--em4); background:rgba(16,185,129,.15)} .w.z{color:var(--mute); background:rgba(51,65,85,.6)}
  .w.n1{color:var(--amber4); background:rgba(245,158,11,.14)} .w.n2{color:var(--red4); background:rgba(239,68,68,.14)}
  .opt.best{border-color:var(--em); background:rgba(16,185,129,.1); animation:glow 1.2s ease-out}
  @keyframes glow{from{box-shadow:0 0 0 0 rgba(16,185,129,.55)}to{box-shadow:0 0 0 14px rgba(16,185,129,0)}}
  .opt.picked.bad{border-color:var(--red); background:rgba(239,68,68,.1)}
  .opt.picked.meh{border-color:var(--amber); background:rgba(245,158,11,.08)}
  .feedback{margin-top:14px; border-radius:13px; padding:14px 16px; background:rgba(15,23,42,.6); border:1px solid var(--line); animation:rise .45s var(--spring) both}
  .feedback .verdict{font-weight:800; color:var(--ink); margin-bottom:4px; font-size:16.5px}
  .feedback p{margin:4px 0 0; font-size:14.5px}
  .feedback .rule{color:var(--em4); font-weight:600}
  .end{text-align:center}
  .end h2{font-size:28px; color:var(--ink); margin:4px 0 6px; letter-spacing:-.02em}
  .big{font-size:58px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1; text-shadow:0 0 30px rgba(16,185,129,.35)}
  .medal{width:84px; height:84px; margin:4px auto 8px; animation:spinin .9s var(--spring) both}
  @keyframes spinin{from{transform:scale(0) rotate(-200deg); opacity:0}}
  .summary{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); margin:18px 0; text-align:left}
  .summary div{background:rgba(15,23,42,.5); border:1px solid var(--line); border-radius:12px; padding:12px 14px; animation:rise .5s var(--spring) both}
  .summary div:nth-child(2){animation-delay:.08s}.summary div:nth-child(3){animation-delay:.16s}.summary div:nth-child(4){animation-delay:.24s}
  .summary b{display:block; font-size:22px; color:var(--ink); font-variant-numeric:tabular-nums}
  .summary span{font-size:12.5px; color:var(--mute)}
  .review{margin:0 0 16px; padding:0; list-style:none; display:grid; gap:8px; text-align:left}
  .review li{font-size:14px; border-left:3px solid var(--line); padding:4px 0 4px 12px}
  .review li.bad{border-color:var(--red)} .review li.meh{border-color:var(--amber)}
  .end .row{justify-content:center}

  /* Code Match: drag and drop */
  .board{display:grid; gap:14px; grid-template-columns:1fr 1fr; position:relative}
  .col{display:grid; gap:9px; align-content:start; min-width:0}
  .col h3{margin:0 0 2px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
  .card{font:inherit; font-size:14.5px; line-height:1.35; text-align:left; color:var(--ink); border-radius:13px; padding:11px 12px; min-height:52px; overflow-wrap:anywhere; animation:deal .55s var(--spring) both; position:relative}
  @keyframes deal{from{opacity:0; transform:translateY(-30px) rotate(-6deg) scale(.85)}}
  .drag{background:linear-gradient(160deg,rgba(51,65,85,.95),rgba(30,41,59,.95)); border:1px solid rgba(148,163,184,.35); cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; box-shadow:0 6px 16px -10px rgba(0,0,0,.8); transition:transform .25s var(--spring), opacity .3s, box-shadow .2s}
  .drag::before{content:""; position:absolute; left:6px; top:50%; width:4px; height:18px; margin-top:-9px; border-radius:2px; background:repeating-linear-gradient(#64748B 0 2px, transparent 2px 4px); opacity:.8}
  .drag{padding-left:18px}
  .drag:hover{box-shadow:0 10px 22px -10px rgba(16,185,129,.55); transform:translateY(-2px)}
  .drag.lifted{opacity:.25}
  .drag.on{outline:2.5px solid var(--em4); outline-offset:2px}
  .drop{background:rgba(15,23,42,.55); border:1.5px dashed rgba(100,116,139,.6); color:var(--ink2); cursor:pointer; transition:border-color .2s, background .2s, transform .25s var(--spring)}
  .drop.code{font-family:var(--mono); font-size:17px; font-weight:700; text-align:center; color:var(--ink); display:grid; place-items:center}
  .drop.hot{border-color:var(--em4); border-style:solid; background:rgba(16,185,129,.14); transform:scale(1.04)}
  .drop.reject{animation:reject .45s}
  @keyframes reject{20%{transform:translateX(-7px); border-color:var(--red)}40%{transform:translateX(6px); border-color:var(--red)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
  .drop.matched{border:1.5px solid var(--em); background:rgba(16,185,129,.12); cursor:default; animation:pop .6s var(--spring)}
  @keyframes pop{30%{transform:scale(1.1)}}
  .drop.matched .got{display:block; font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--em4); margin-top:4px; text-align:center; animation:rise .4s var(--spring) both}
  .drag.gone{transform:scale(.6); opacity:0; pointer-events:none}
  .dragghost{position:fixed; z-index:50; pointer-events:none; margin:0; box-shadow:0 22px 40px -12px rgba(0,0,0,.75), 0 0 0 2px var(--em4); background:linear-gradient(160deg,#334155,#1E293B); border:none; animation:none; transition:none; opacity:.97}
  .dragghost.back{transition:left .35s var(--spring), top .35s var(--spring), transform .35s; }
  .dragghost.into{transition:left .25s ease-in, top .25s ease-in, transform .25s ease-in, opacity .25s; transform:scale(.4) !important; opacity:0}
  .note{font-size:13px; color:var(--faint); margin-top:14px; min-height:20px}
  .note.ok{color:var(--em4)} .note.bad{color:var(--red4)}
  .combo{position:absolute; right:12px; top:12px; font-weight:800; color:var(--amber4); font-size:14px; animation:bump .5s var(--spring)}

  /* Theory Clue */
  .evidence{display:grid; gap:10px; grid-template-columns:repeat(5,minmax(0,1fr)); margin-bottom:12px}
  @media (max-width:640px){ .evidence{grid-template-columns:repeat(2,minmax(0,1fr))} .evidence .clue:last-child{grid-column:1/-1} }
  .clue{perspective:900px; min-height:118px}
  .clue-in{position:relative; width:100%; height:100%; min-height:118px; transform-style:preserve-3d; transition:transform .7s var(--spring)}
  .clue.down .clue-in{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:13px; padding:10px 11px; display:flex; flex-direction:column; gap:4px; overflow:hidden}
  .face.front{background:rgba(245,158,11,.08); border:1px solid rgba(251,191,36,.4)}
  .face.back{transform:rotateY(180deg); background:repeating-linear-gradient(45deg,rgba(51,65,85,.65) 0 10px,rgba(30,41,59,.9) 10px 20px); border:1px solid var(--line); align-items:center; justify-content:center; color:var(--faint); font-weight:800; font-size:28px}
  .face .lab{font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--amber4)}
  .face .txt{font-size:14px; color:var(--ink); line-height:1.35; overflow-wrap:anywhere}
  .clue.wide .face .txt{font-size:13px}
  .redact{background:var(--ink2); color:transparent; border-radius:3px; padding:0 2px; user-select:none}
  .tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .token{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; cursor:grab; touch-action:none; user-select:none; background:radial-gradient(circle at 35% 30%,#FDE68A,#F59E0B 70%); box-shadow:0 10px 24px -8px rgba(245,158,11,.75); border:none; animation:float 2.6s ease-in-out infinite}
  .token svg{width:34px; height:34px; color:#422006}
  @keyframes float{50%{transform:translateY(-5px) rotate(-6deg)}}
  .token.held{opacity:.3; animation:none}
  .tokenfly{position:fixed; z-index:55; pointer-events:none; width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%,#FDE68A,#F59E0B 70%); box-shadow:0 18px 36px -10px rgba(0,0,0,.7)}
  .tokenfly svg{width:34px; height:34px; color:#422006}
  .hint{font-size:13px; color:var(--mute); flex:1; min-width:180px}
  .suspects{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .sus{position:relative; text-align:left; font:inherit; border-radius:13px; padding:12px 13px 11px; background:linear-gradient(160deg,rgba(51,65,85,.7),rgba(30,41,59,.85)); border:1px solid rgba(148,163,184,.3); color:var(--ink); animation:deal .55s var(--spring) both; transition:border-color .2s, transform .25s var(--spring), opacity .3s; overflow:hidden; min-width:0}
  .sus .nm{font-weight:700; font-size:15px; line-height:1.3; display:block}
  .sus .fd{font-size:12.5px; color:var(--mute); display:block; margin-top:2px}
  .sus .acts{display:flex; gap:6px; margin-top:9px}
  .mini{font:inherit; font-size:12px; font-weight:700; border-radius:8px; padding:4px 10px; cursor:pointer; border:1px solid var(--line); background:rgba(15,23,42,.6); color:var(--ink2)}
  .mini.acc{border-color:rgba(251,191,36,.45); color:var(--amber4)}
  .mini:hover{border-color:var(--em4)}
  .sus.hot{border-color:var(--amber4); transform:scale(1.04); box-shadow:0 0 0 3px rgba(251,191,36,.25)}
  .sus.out{opacity:.5}
  .sus.out .nm{text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:var(--red4)}
  .sus .strike{position:absolute; left:8px; right:8px; top:50%; height:3px; background:var(--red4); border-radius:2px; transform-origin:left; transform:scaleX(0) rotate(-4deg); transition:transform .35s ease-out}
  .sus.out .strike{transform:scaleX(1) rotate(-4deg)}
  .sus.wrong{animation:reject .45s}
  .sus.solved{border-color:var(--em); background:linear-gradient(160deg,rgba(16,185,129,.22),rgba(30,41,59,.85)); opacity:1}
  .stamp{position:absolute; right:10px; top:10px; font-weight:900; font-size:15px; letter-spacing:.08em; padding:3px 9px; border:3px solid; border-radius:6px; transform:rotate(-12deg); animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both; pointer-events:none}
  .stamp.alibi{color:var(--red4); border-color:var(--red4)}
  .stamp.closed{color:var(--em4); border-color:var(--em4); font-size:17px}
  @keyframes stamp{from{transform:rotate(-12deg) scale(3); opacity:0}}
  .verdictbox{margin-top:14px; border-radius:13px; padding:14px 16px; background:rgba(16,185,129,.08); border:1px solid rgba(16,185,129,.35); animation:rise .5s var(--spring) both}
  .verdictbox b{color:var(--ink)}
  .verdictbox p{margin:5px 0 0; font-size:14.5px}

  #fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60}
  @media (max-width:520px){ .scenario{font-size:16px} .opt{font-size:14.5px} .card{font-size:13.5px} .big{font-size:48px} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  }
  .lock{text-align:center; padding:12px 4px}

<script src="/nbs-data.js"></script>

<script src="/theory-data.js"></script>
<script>
// Game views of the site's own content files, so the games always match the
// drills and references they come from.
var NBS = NBS_ITEMS.map(function(i){ return { cat:i.cat, s:i.scenario, rule:i.rule, o:i.options.map(function(o){ return { t:o.t, w:o.weight, why:o.why }; }) }; });
var DSM = DSM_DATA.map(function(c){ return { cat:c.cat, dx:c.dx.map(function(x){ return { n:x.n, c:x.c, tx:x.tx }; }) }; });
var THEORIES = [];
THEORY_DATA.forEach(function(c){ c.items.forEach(function(i){ THEORIES.push({ cat:c.cat, name:i.name, founder:i.founder, core:i.core, terms:i.keyTerms||[], tech:i.techniques||[], tip:i.examTip||'' }); }); });
</script>
<script>
(function(){
  function $(s,r){return (r||document).querySelector(s);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function put(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function restart(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  // ── confetti / sparks ──
  var cv=$('#fx'), cx=cv.getContext('2d'), parts=[], raf=null;
  function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  size(); addEventListener('resize',size);
  var COLS=['#10B981','#34D399','#60A5FA','#FBBF24','#F8FAFC','#A78BFA'];
  function burst(x,y,n,spread,colors){
    if(REDUCE) return;
    for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2, s=(Math.random()*.6+.4)*spread;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spread*.35,g:.32,life:60+Math.random()*40,age:0,r:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:(colors||COLS)[i%(colors||COLS).length],sq:Math.random()<.6}); }
    if(!raf) raf=requestAnimationFrame(step);
  }
  function rain(n){ if(REDUCE) return; for(var i=0;i<n;i++){ parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,life:200,age:0,r:4+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLS[i%COLS.length],sq:true}); } if(!raf) raf=requestAnimationFrame(step); }
  function centerOf(el){ var r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
  function step(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(function(p){ return p.age<p.life && p.y<innerHeight+40; });
    parts.forEach(function(p){ p.age++; p.vy+=p.g; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      cx.save(); cx.globalAlpha=Math.max(0,1-p.age/p.life); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c;
      if(p.sq) cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); else { cx.beginPath(); cx.arc(0,0,p.r/1.6,0,7); cx.fill(); }
      cx.restore(); });
    raf = parts.length ? requestAnimationFrame(step) : null;
    if(!raf) cx.clearRect(0,0,innerWidth,innerHeight);
  }
  function countUp(el,to,ms){ if(REDUCE){el.textContent=to;return;} var t0=performance.now(); (function f(t){ var k=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(f); })(t0); }
  function medal(color){ return '<svg class="medal" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="36" fill="'+color+'" opacity=".16"/><circle cx="42" cy="42" r="27" fill="none" stroke="'+color+'" stroke-width="4"/><path d="M42 26l4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3-9.3-4.9-9.3 4.9 1.8-10.3-7.5-7.3 10.4-1.5z" fill="'+color+'"/></svg>'; }

  // ── tabs ──
  var tabs=[$('#tab-match'),$('#tab-rush'),$('#tab-clue')];
  function show(t){ tabs.forEach(function(x){var on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;var p=document.getElementById(x.getAttribute('aria-controls'));p.hidden=!on; if(on) restart(p,'in');}); if(t.id!=='tab-match') stopMatchClock(); if(t.id!=='tab-rush') stopRushClock(); }
  tabs.forEach(function(t,i){t.onclick=function(){show(t);};t.onkeydown=function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?tabs.length-1:0; if(d){var n=tabs[(i+d)%tabs.length];show(n);n.focus();}};});
  if(location.hash==='#clue') show(tabs[2]); else if(location.hash==='#rush') show(tabs[1]);

  // ════════════ TRIAGE RUSH ════════════
  var R=$('#rush'), ROUND=10, SECS=30, CIRC=2*Math.PI*21;
  var HEART='<svg class="heart CLS" viewBox="0 0 24 24" aria-hidden="true"><path fill="FILL" d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4.5 6 4.5c2.1 0 3.4 1.1 4 2.2.6-1.1 1.9-2.2 4-2.2 3.7 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></svg>';
  var g=null, rushTimer=null;
  function stopRushClock(){ if(rushTimer){clearInterval(rushTimer);rushTimer=null;} }
  function wClass(w){return w===3?'p3':w===0?'z':w===-1?'n1':'n2';}
  function wLabel(w){return (w>0?'+':'')+w;}

  function rushIntro(){
    stopRushClock();
    var best=+get('prp_game_rush_best')||0;
    R.innerHTML='<div class="intro in"><div class="eyebrow">NCMHCE · Clinical decisions</div><h1>Triage Rush</h1>'+
      '<p>Ten next-best-step scenarios against the clock. Pick the strongest clinical move. Answers score the way your cases do, from +3 down to −2.</p>'+
      '<ul class="rules"><li><b>+3 best move</b>Points, a speed bonus, and a growing streak multiplier.</li><li><b>0 or −1</b>No points, and your streak resets.</li><li><b>−2 harmful</b>Breaks one of your 3 hearts.</li><li><b>30 seconds</b>Running out counts as −1.</li></ul>'+
      '<div class="row"><button class="btn pulse" id="rush-go">Start round</button>'+(best?'<span class="qn">Your best: '+best+' pts</span>':'')+'</div></div>';
    $('#rush-go').onclick=rushStart;
  }
  function rushStart(){ g={items:shuffle(NBS).slice(0,ROUND), i:0, score:0, streak:0, bestStreak:0, hearts:3, log:[]}; rushQ(); }
  function hudHTML(lost){
    var h=''; for(var k=0;k<3;k++){ var alive=k<g.hearts; h+=HEART.replace('FILL', alive||k===lost?'var(--red)':'#334155').replace('CLS', k===lost?'lost':''); }
    var mult=Math.min(g.streak,5);
    return '<div class="hud"><div class="stat"><span class="k">Score</span><span class="v" id="r-score">'+g.score+'</span></div>'+
      '<div class="stat"><span class="k">Streak</span><span class="streak'+(mult>=3?' hot':'')+'"><span class="v">'+g.streak+'</span>'+(mult>1?'<span class="mult">×'+mult+'</span>':'')+'</span></div>'+
      '<div class="stat"><span class="k">Hearts</span><span class="hearts" aria-label="'+g.hearts+' of 3 hearts left">'+h+'</span></div>'+
      '<div class="ring" id="r-ring" aria-label="Time left"><svg width="52" height="52" viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="21" stroke-width="5"/><circle class="prog" id="r-prog" cx="26" cy="26" r="21" stroke-width="5" stroke-dasharray="'+CIRC.toFixed(1)+'" stroke-dashoffset="0"/></svg><span id="r-time">'+SECS+'</span></div></div>';
  }
  function progressHTML(){ var h=''; for(var k=0;k<g.items.length;k++){ var l=g.log[k]; h+='<i class="'+(l?wClass(l.w):k===g.i?'cur':'')+'"></i>'; } return '<div class="progress" aria-hidden="true">'+h+'</div>'; }
  function rushQ(){
    var it=g.items[g.i]; g.opts=shuffle(it.o); g.left=SECS; g.answered=false;
    R.innerHTML=hudHTML(-1)+progressHTML()+'<div class="slide-in"><div class="meta"><span class="tag">'+esc(it.cat)+'</span><span class="qn">Scenario '+(g.i+1)+' of '+g.items.length+'</span></div>'+
      '<p class="scenario">'+esc(it.s)+'</p><div class="opts">'+
      g.opts.map(function(o,k){return '<button class="opt" data-k="'+k+'"><span class="w '+wClass(o.w)+'">'+wLabel(o.w)+'</span><span>'+esc(o.t)+'</span></button>';}).join('')+
      '</div><div id="r-fb"></div></div>';
    [].forEach.call(R.querySelectorAll('.opt'),function(b){b.onclick=function(){answer(+b.getAttribute('data-k'));};});
    stopRushClock();
    rushTimer=setInterval(function(){
      g.left--; var t=$('#r-time'), p=$('#r-prog'), ring=$('#r-ring');
      if(t) t.textContent=Math.max(0,g.left);
      if(p) p.setAttribute('stroke-dashoffset', (CIRC*(1-Math.max(0,g.left)/SECS)).toFixed(1));
      if(ring) ring.className='ring'+(g.left<=5?' crit':g.left<=10?' low':'');
      if(g.left<=0) answer(-1);
    },1000);
  }
  function answer(k){
    if(g.answered) return; g.answered=true; stopRushClock();
    var it=g.items[g.i], o=k>=0?g.opts[k]:null, w=o?o.w:-1, gained=0, lost=-1;
    if(w===3){ g.streak++; g.bestStreak=Math.max(g.bestStreak,g.streak); gained=Math.round((100+g.left*5)*Math.min(g.streak,5)); g.score+=gained; }
    else { g.streak=0; if(w===-2){ g.hearts--; lost=g.hearts; } }
    g.log.push({cat:it.cat, w:w, rule:it.rule});
    var picked=null;
    [].forEach.call(R.querySelectorAll('.opt'),function(b,j){
      var oo=g.opts[j]; b.disabled=true; b.classList.add('revealed');
      if(oo.w===3) b.classList.add('best');
      if(j===k){ picked=b; b.classList.add('picked'); if(oo.w===-2) b.classList.add('bad'); else if(oo.w<3) b.classList.add('meh'); }
    });
    // effects
    if(w===3 && picked){ var c=centerOf(picked); burst(c[0],c[1],26+Math.min(g.streak,5)*8,7); restart(R,'flash-good'); }
    if(w===-2){ restart(R,'shake'); restart(R,'flash-bad'); }
    else if(w<3){ restart(R,'flash-bad'); }
    setTimeout(function(){ R.classList.remove('flash-good','flash-bad'); },60);
    var hud=R.querySelector('.hud'); hud.outerHTML=hudHTML(lost);
    var pr=R.querySelector('.progress'); pr.outerHTML=progressHTML();
    var sv=$('#r-score'); if(gained){ restart(sv,'bump'); var f=document.createElement('span'); f.className='float'; f.textContent='+'+gained; sv.parentNode.appendChild(f); setTimeout(function(){f.remove();},1200); }
    $('#r-prog').setAttribute('stroke-dashoffset',(CIRC*(1-Math.max(0,g.left)/SECS)).toFixed(1)); $('#r-time').textContent=Math.max(0,g.left);
    var best=g.opts.filter(function(x){return x.w===3;})[0];
    var verdict = !o ? 'Time ran out (−1)' : w===3 ? (g.streak>=3?'On fire! ':'')+'Best move. +'+gained+' pts' : w===-2 ? 'Harmful choice (−2). A heart breaks.' : w===0 ? 'Reasonable, but not the best move (0)' : 'Weaker choice (−1)';
    var last = g.hearts<=0 || g.i===g.items.length-1;
    $('#r-fb').innerHTML='<div class="feedback" role="status"><div class="verdict">'+esc(verdict)+'</div>'+
      (o && w!==3 ? '<p>'+esc(o.why)+'</p>' : '')+
      '<p><b style="color:var(--ink)">Best:</b> '+esc(best.why)+'</p><p class="rule">'+esc(it.rule)+'</p>'+
      '<div class="row" style="margin-top:12px"><button class="btn" id="r-next">'+(last?'See results':'Next scenario')+'</button></div></div>';
    $('#r-next').onclick=function(){ if(last) rushEnd(); else { g.i++; rushQ(); } };
    $('#r-next').focus({preventScroll:true});
  }
  function rushEnd(){
    var best=+get('prp_game_rush_best')||0, nb=g.score>best; if(nb) put('prp_game_rush_best',g.score);
    var right=g.log.filter(function(x){return x.w===3;}).length, harm=g.log.filter(function(x){return x.w===-2;}).length;
    var misses=g.log.filter(function(x){return x.w!==3;});
    var col = g.hearts<=0 ? '#F87171' : right>=8 ? '#FBBF24' : right>=5 ? '#34D399' : '#60A5FA';
    R.innerHTML='<div class="end in">'+medal(col)+'<div class="eyebrow">'+(g.hearts<=0?'Out of hearts':'Round complete')+'</div><h2>'+(nb?'New best score!':'Your score')+'</h2><div class="big" id="r-final">0</div>'+
      '<div class="summary"><div><b>'+right+'/'+g.log.length+'</b><span>Best moves</span></div><div><b>'+g.bestStreak+'</b><span>Longest streak</span></div><div><b>'+harm+'</b><span>Harmful choices</span></div><div><b>'+Math.max(best,g.score)+'</b><span>Best score</span></div></div>'+
      (misses.length?'<p class="qn" style="margin:0 0 8px;text-align:left">Rules to review</p><ul class="review">'+misses.map(function(m){return '<li class="'+(m.w===-2?'bad':'meh')+'"><b style="color:var(--ink)">'+esc(m.cat)+':</b> '+esc(m.rule)+'</li>';}).join('')+'</ul>':'')+
      '<div class="row"><button class="btn pulse" id="r-again">Play again</button><button class="btn ghost" id="r-home">Rules</button></div></div>';
    countUp($('#r-final'), g.score, 1100);
    if(g.hearts>0) { rain(nb?160:80); }
    $('#r-again').onclick=rushStart; $('#r-home').onclick=rushIntro;
  }

  // ════════════ CODE MATCH (drag and drop) ════════════
  var M=$('#match'), m=null, matchTimer=null;
  var MCATS=DSM.filter(function(c){return c.cat!=='Ethics' && c.cat!=='Crisis';});
  function stopMatchClock(){ if(matchTimer){clearInterval(matchTimer);matchTimer=null;} }
  function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
  function pool(cat, mode){
    var dx = cat==='mixed' ? MCATS.reduce(function(a,c){return a.concat(c.dx.map(function(x){return Object.assign({cat:c.cat},x);}));},[])
                           : MCATS.filter(function(c){return c.cat===cat;})[0].dx.map(function(x){return Object.assign({cat:cat},x);});
    var seen={}, out=[];
    shuffle(dx).forEach(function(x){ var key=mode==='tx'?x.tx:x.c; if(!seen[key]){seen[key]=1;out.push(x);} });
    return out.slice(0,6);
  }
  function matchIntro(){
    stopMatchClock();
    var cat=get('prp_game_match_cat')||'mixed', mode=get('prp_game_match_mode')||'code';
    M.innerHTML='<div class="intro in"><div class="eyebrow">NCE · NCMHCE · DSM-5-TR</div><h1>Code Match</h1>'+
      '<p>Drag each diagnosis onto its ICD-10-CM code or first-line treatment. Clear the board fast, and chain correct drops for a combo. You can also tap a diagnosis, then its match.</p>'+
      '<div class="row" style="margin-bottom:18px;align-items:flex-end">'+
      '<label class="sel" for="m-cat">Category<select id="m-cat"><option value="mixed">Mixed (all categories)</option>'+MCATS.map(function(c){return '<option value="'+esc(c.cat)+'">'+esc(c.cat)+' ('+c.dx.length+')</option>';}).join('')+'</select></label>'+
      '<label class="sel" for="m-mode">Match to<select id="m-mode"><option value="code">ICD-10-CM code</option><option value="tx">First-line treatment</option></select></label></div>'+
      '<div class="row"><button class="btn pulse" id="m-go">Deal the board</button><span class="qn" id="m-best"></span></div></div>';
    $('#m-cat').value=cat; $('#m-mode').value=mode;
    function bestLine(){ var b=get('prp_game_match_best_'+$('#m-mode').value+'_'+$('#m-cat').value); $('#m-best').textContent=b?'Best on this board: '+b:''; }
    $('#m-cat').onchange=bestLine; $('#m-mode').onchange=bestLine; bestLine();
    $('#m-go').onclick=function(){ put('prp_game_match_cat',$('#m-cat').value); put('prp_game_match_mode',$('#m-mode').value); matchStart($('#m-cat').value,$('#m-mode').value); };
  }
  function matchStart(cat, mode){
    var pairs=pool(cat,mode);
    m={cat:cat, mode:mode, pairs:pairs, done:{}, misses:0, combo:0, bestCombo:0, secs:0, missed:[], sel:null};
    var L=shuffle(pairs.map(function(p,i){return i;})), Rr=shuffle(pairs.map(function(p,i){return i;}));
    M.innerHTML='<div class="hud"><div class="stat"><span class="k">Time</span><span class="v" id="m-time">0:00</span></div>'+
      '<div class="stat"><span class="k">Matched</span><span class="v" id="m-n">0/'+pairs.length+'</span></div>'+
      '<div class="stat"><span class="k">Misses</span><span class="v" id="m-miss">0</span></div>'+
      '<div class="stat"><span class="k">Combo</span><span class="v" id="m-combo">0</span></div>'+
      '<button class="btn ghost" id="m-quit">Quit</button></div>'+
      '<div class="board"><div class="col"><h3>Drag a diagnosis</h3>'+L.map(function(i,n){return '<button class="card drag" data-i="'+i+'" style="animation-delay:'+(n*.07)+'s">'+esc(pairs[i].n)+'</button>';}).join('')+'</div>'+
      '<div class="col"><h3>Onto its '+(mode==='tx'?'first-line treatment':'ICD-10-CM code')+'</h3>'+Rr.map(function(i,n){return '<div class="card drop'+(mode==='tx'?'':' code')+'" role="button" tabindex="0" data-i="'+i+'" style="animation-delay:'+(.2+n*.07)+'s"><span>'+esc(mode==='tx'?pairs[i].tx:pairs[i].c)+'</span></div>';}).join('')+'</div></div>'+
      '<p class="note" id="m-note">Drag a diagnosis card onto its match.</p>';
    [].forEach.call(M.querySelectorAll('.drag'),function(b){ wireDrag(b); b.onclick=function(){ if(m.dragged){m.dragged=false;return;} select(b); }; });
    [].forEach.call(M.querySelectorAll('.drop'),function(d){ d.onclick=function(){ if(m.sel) attempt(m.sel,d,null); }; d.onkeydown=function(e){ if((e.key==='Enter'||e.key===' ')&&m.sel){ e.preventDefault(); attempt(m.sel,d,null);} }; });
    $('#m-quit').onclick=matchIntro;
    stopMatchClock(); matchTimer=setInterval(function(){m.secs++; var t=$('#m-time'); if(t) t.textContent=fmt(m.secs);},1000);
  }
  function select(b){ if(m.sel) m.sel.classList.remove('on'); m.sel = m.sel===b ? null : b; if(m.sel){ m.sel.classList.add('on'); note('Now pick its match on the right.',''); } }
  function note(t,c){ var n=$('#m-note'); if(n){ n.textContent=t; n.className='note '+(c||''); } }

  function wireDrag(card){
    card.addEventListener('pointerdown',function(e){
      m.dragged=false;
      if(card.classList.contains('gone') || e.button>0) return;
      var r=card.getBoundingClientRect(), ox=e.clientX-r.left, oy=e.clientY-r.top, moved=false, hot=null, ghost=null, lastX=e.clientX;
      card.setPointerCapture(e.pointerId);
      function begin(){
        moved=true; m.dragged=true; if(m.sel){m.sel.classList.remove('on'); m.sel=null;}
        ghost=card.cloneNode(true); ghost.className='card drag dragghost'; ghost.style.width=r.width+'px'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
        document.body.appendChild(ghost); card.classList.add('lifted');
      }
      var scroller=null, py=e.clientY, px=e.clientX;
      function autoScroll(){ // scroll the page while the card is held near the top or bottom edge
        var edge=44, dy = py>innerHeight-edge ? (py-(innerHeight-edge))/3 : py<edge ? -(edge-py)/3 : 0;
        if(dy){ scrollBy(0,dy); hit(px,py); }
        scroller=requestAnimationFrame(autoScroll);
      }
      function hit(x,y){
        var under=document.elementFromPoint(x,y), d=under&&under.closest('.drop:not(.matched)');
        if(d!==hot){ if(hot) hot.classList.remove('hot'); hot=d; if(hot) hot.classList.add('hot'); }
      }
      function move(ev){
        if(!moved){ if(Math.abs(ev.clientX-e.clientX)+Math.abs(ev.clientY-e.clientY)<6) return; begin(); scroller=requestAnimationFrame(autoScroll); }
        px=ev.clientX; py=ev.clientY;
        var tilt=Math.max(-12,Math.min(12,(ev.clientX-lastX)*1.2)); lastX=ev.clientX;
        ghost.style.left=(ev.clientX-ox)+'px'; ghost.style.top=(ev.clientY-oy)+'px'; ghost.style.transform='rotate('+tilt+'deg) scale(1.05)';
        hit(ev.clientX,ev.clientY);
      }
      function up(){
        if(scroller){ cancelAnimationFrame(scroller); scroller=null; }
        card.removeEventListener('pointermove',move); card.removeEventListener('pointerup',up); card.removeEventListener('pointercancel',up);
        if(!moved) return;
        if(hot){ hot.classList.remove('hot'); attempt(card,hot,ghost); }
        else { flyBack(card,ghost); }
      }
      card.addEventListener('pointermove',move); card.addEventListener('pointerup',up); card.addEventListener('pointercancel',up);
    });
  }
  function flyBack(card,ghost){
    if(!ghost){ card.classList.remove('lifted'); return; }
    var r=card.getBoundingClientRect(); ghost.classList.add('back'); ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px'; ghost.style.transform='none';
    setTimeout(function(){ ghost.remove(); card.classList.remove('lifted'); }, REDUCE?0:340);
  }
  function attempt(card,drop,ghost){
    var i=+card.getAttribute('data-i'), j=+drop.getAttribute('data-i');
    card.classList.remove('on'); m.sel=null;
    if(i===j){
      m.done[i]=1; m.combo++; m.bestCombo=Math.max(m.bestCombo,m.combo);
      var dr=drop.getBoundingClientRect();
      function settle(){
        if(ghost) ghost.remove();
        card.classList.remove('lifted'); card.classList.add('gone');
        drop.classList.add('matched'); drop.removeAttribute('tabindex');
        drop.insertAdjacentHTML('beforeend','<span class="got">'+esc(m.pairs[i].n)+'</span>');
        var c=centerOf(drop); burst(c[0],c[1],18+m.combo*6,5+m.combo);
      }
      if(ghost && !REDUCE){ ghost.classList.add('into'); ghost.style.left=(dr.left+dr.width/2-ghost.offsetWidth/2)+'px'; ghost.style.top=(dr.top+dr.height/2-ghost.offsetHeight/2)+'px'; setTimeout(settle,240); } else settle();
      var n=Object.keys(m.done).length; $('#m-n').textContent=n+'/'+m.pairs.length; restart($('#m-n'),'bump');
      $('#m-combo').textContent=m.combo; restart($('#m-combo'),'bump');
      note((m.combo>=3?'Combo ×'+m.combo+'! ':'')+m.pairs[i].n+' → '+(m.mode==='tx'?m.pairs[i].tx:m.pairs[i].c),'ok');
      if(n===m.pairs.length) setTimeout(matchEnd, REDUCE?0:700);
    } else {
      m.misses++; m.combo=0; $('#m-miss').textContent=m.misses; restart($('#m-miss'),'bump'); $('#m-combo').textContent=0;
      if(m.missed.indexOf(m.pairs[i])<0) m.missed.push(m.pairs[i]);
      restart(drop,'reject'); flyBack(card,ghost);
      note('Not a match. '+m.pairs[i].n+' goes back to the pile.','bad');
    }
  }
  function matchEnd(){
    stopMatchClock();
    var score=Math.max(0, 1000 - m.secs*10 - m.misses*50 + m.bestCombo*25);
    var key='prp_game_match_best_'+m.mode+'_'+m.cat, best=+get(key)||0, nb=score>best; if(nb) put(key,score);
    var col = m.misses===0 ? '#FBBF24' : m.misses<=2 ? '#34D399' : '#60A5FA';
    M.innerHTML='<div class="end in">'+medal(col)+'<div class="eyebrow">Board cleared'+(m.misses===0?' · perfect':'')+'</div><h2>'+(nb?'New best on this board!':'Your score')+'</h2><div class="big" id="m-final">0</div>'+
      '<div class="summary"><div><b>'+fmt(m.secs)+'</b><span>Time</span></div><div><b>'+m.misses+'</b><span>Misses</span></div><div><b>'+m.bestCombo+'</b><span>Best combo</span></div><div><b>'+Math.max(best,score)+'</b><span>Best on this board</span></div></div>'+
      (m.missed.length?'<p class="qn" style="margin:0 0 8px;text-align:left">Pairs you missed</p><ul class="review">'+m.missed.map(function(p){return '<li class="meh"><b style="color:var(--ink)">'+esc(p.n)+'</b> → '+esc(m.mode==='tx'?p.tx:p.c)+'</li>';}).join('')+'</ul>':'')+
      '<div class="row"><button class="btn pulse" id="m-again">Deal a new board</button><button class="btn ghost" id="m-home">Change category</button></div></div>';
    countUp($('#m-final'), score, 1000); rain(m.misses===0?170:90);
    $('#m-again').onclick=function(){matchStart(m.cat,m.mode);}; $('#m-home').onclick=matchIntro;
  }


  // ════════════ THEORY CLUE ════════════
  var C=$('#clue'), cs=null, CASES=5;
  var MAG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>';
  var STOP={therapy:1,theory:1,the:1,and:1,with:1,family:1,brief:1,systems:1,model:1,applied:1,clinically:1,multiple:1,founders:1,updated:1,'et':1,'al':1};
  function redact(text, th){
    var words=((th.name+' '+th.founder).match(/[A-Za-z][A-Za-z'’.-]{2,}/g)||[]).map(function(w){return w.replace(/[.]+$/,'');}).filter(function(w){return !STOP[w.toLowerCase()];});
    var out=esc(text);
    words.sort(function(a,b){return b.length-a.length;}).forEach(function(w){
      var re=new RegExp('\\b'+w.replace(/[-’'.]/g,'.')+'\\w*','gi');
      out=out.replace(re,function(mt){return '<span class="redact">'+mt.replace(/./g,'x')+'</span>';});
    });
    return out;
  }
  function makeCase(th){
    var others=THEORIES.filter(function(t){return t!==th;});
    var same=shuffle(others.filter(function(t){return t.cat===th.cat;})).slice(0,2);
    var rest=shuffle(others.filter(function(t){return same.indexOf(t)<0;})).slice(0,5-same.length);
    var suspects=shuffle([th].concat(same,rest));
    var tech=shuffle(th.tech), terms=shuffle(th.terms), clues=[];
    for(var k=0;k<2;k++){ if(tech[k]) clues.push({lab:'Technique',txt:esc(tech[k])}); if(terms[k]) clues.push({lab:'Key term',txt:esc(terms[k])}); }
    clues=clues.slice(0,4); clues.push({lab:'Core idea',txt:redact(th.core,th),wide:true});
    return {th:th, suspects:suspects, clues:clues, shown:1, wrong:0, out:{}, solved:false};
  }
  function clueIntro(){
    var best=+get('prp_game_clue_best')||0;
    C.innerHTML='<div class="intro in"><div class="eyebrow">NCE · NCMHCE · Theories &amp; pioneers</div><h1>Theory Clue</h1>'+
      '<p>A theory is behind each case. Six suspects, one culprit. Turn over evidence one card at a time, cross suspects off your notebook, then drag the magnifying glass onto the theory you accuse.</p>'+
      '<ul class="rules"><li><b>Fewer clues, more points</b>500 points with one clue, 100 less for each extra card.</li><li><b>Notebook</b>Tap "Rule out" to cross a suspect off. Tap again to bring them back.</li><li><b>Wrong accusation</b>−150, the suspect has an alibi, and the next clue flips.</li><li><b>5 cases</b>Then see your detective rating.</li></ul>'+
      '<div class="row"><button class="btn pulse" id="c-go">Open the first case</button>'+(best?'<span class="qn">Your best: '+best+' pts</span>':'')+'</div></div>';
    $('#c-go').onclick=clueStart;
  }
  function clueStart(){ var picks=shuffle(THEORIES).slice(0,CASES); cs={list:picks.map(makeCase), i:0, score:0, log:[]}; clueCase(); }
  function caseScore(k){ return Math.max(50, 500-100*(k.shown-1)-150*k.wrong); }
  function clueCase(){
    var k=cs.list[cs.i];
    C.innerHTML='<div class="hud"><div class="stat"><span class="k">Case</span><span class="v">'+(cs.i+1)+'/'+CASES+'</span></div>'+
      '<div class="stat"><span class="k">Score</span><span class="v" id="c-score">'+cs.score+'</span></div>'+
      '<div class="stat"><span class="k">Case worth</span><span class="v" id="c-worth">'+caseScore(k)+'</span></div>'+
      '<button class="btn ghost" id="c-quit">Quit</button></div>'+
      '<div class="evidence" id="c-ev">'+k.clues.map(function(c,n){return '<div class="clue'+(c.wide?' wide':'')+(n<k.shown?'':' down')+'" data-n="'+n+'"><div class="clue-in"><div class="face front"><span class="lab">'+c.lab+'</span><span class="txt">'+c.txt+'</span></div><div class="face back">?</div></div></div>';}).join('')+'</div>'+
      '<div class="tools"><button class="token" id="c-token" aria-label="Accusation token. Drag onto a suspect, or use Accuse on a card.">'+MAG+'</button>'+
      '<span class="hint" id="c-hint">Drag the magnifying glass onto your suspect.</span><button class="btn ghost" id="c-more">Flip next clue (−100)</button></div>'+
      '<div class="suspects" id="c-sus">'+k.suspects.map(function(t,n){return '<div class="sus" data-n="'+n+'" style="animation-delay:'+(n*.06)+'s"><span class="strike"></span><span class="nm">'+esc(t.name)+'</span><span class="fd">'+esc(t.founder)+'</span><span class="acts"><button class="mini" data-act="out">Rule out</button><button class="mini acc" data-act="acc">Accuse</button></span></div>';}).join('')+'</div>'+
      '<div id="c-verdict"></div>';
    $('#c-quit').onclick=clueIntro;
    $('#c-more').onclick=function(){ flipNext(); };
    syncMore();
    [].forEach.call(C.querySelectorAll('.sus'),function(el){
      var n=+el.getAttribute('data-n');
      el.querySelector('[data-act=out]').onclick=function(){ if(k.solved) return; toggleOut(el,n); };
      el.querySelector('[data-act=acc]').onclick=function(){ accuse(n); };
    });
    wireToken();
  }
  function syncMore(){ var k=cs.list[cs.i], b=$('#c-more'); if(b){ b.disabled = k.solved || k.shown>=k.clues.length; b.style.opacity=b.disabled?.45:1; } var w=$('#c-worth'); if(w){ w.textContent=caseScore(k); restart(w,'bump'); } }
  function flipNext(){
    var k=cs.list[cs.i]; if(k.solved || k.shown>=k.clues.length) return;
    var card=C.querySelector('.clue[data-n="'+k.shown+'"]'); k.shown++;
    if(card){ card.classList.remove('down'); var c=centerOf(card); burst(c[0],c[1],10,3,['#FBBF24','#FDE68A','#F8FAFC']); }
    syncMore();
  }
  function toggleOut(el,n){ var k=cs.list[cs.i]; k.out[n]=!k.out[n]; el.classList.toggle('out',!!k.out[n]); el.querySelector('[data-act=out]').textContent=k.out[n]?'Bring back':'Rule out'; }
  function accuse(n){
    var k=cs.list[cs.i]; if(k.solved) return;
    var el=C.querySelector('.sus[data-n="'+n+'"]'), t=k.suspects[n];
    if(t===k.th){
      k.solved=true; var pts=caseScore(k); cs.score+=pts; cs.log.push({th:k.th, clues:k.shown, wrong:k.wrong, pts:pts});
      el.classList.remove('out'); el.classList.add('solved'); el.insertAdjacentHTML('beforeend','<span class="stamp closed">CASE CLOSED</span>');
      var c=centerOf(el); burst(c[0],c[1],60,9); restart(C,'flash-good'); setTimeout(function(){C.classList.remove('flash-good');},60);
      // reveal every clue and the unredacted core idea
      [].forEach.call(C.querySelectorAll('.clue.down'),function(x,d){ setTimeout(function(){x.classList.remove('down');}, d*120); });
      var sv=$('#c-score'); countUp(sv, cs.score, 600); restart(sv,'bump');
      [].forEach.call(C.querySelectorAll('.mini'),function(b){b.disabled=true;}); syncMore(); $('#c-hint').textContent='Solved with '+k.shown+' clue'+(k.shown>1?'s':'')+(k.wrong?' and '+k.wrong+' wrong accusation'+(k.wrong>1?'s':''):'')+'.';
      var last=cs.i===CASES-1;
      $('#c-verdict').innerHTML='<div class="verdictbox" role="status"><b>'+esc(k.th.name)+'</b> · '+esc(k.th.founder)+' <span style="color:var(--em4);font-weight:800">+'+pts+'</span>'+
        '<p>'+esc(k.th.core)+'</p>'+(k.th.tip?'<p style="color:var(--em4);font-weight:600">Exam tip: '+esc(k.th.tip)+'</p>':'')+
        '<div class="row" style="margin-top:12px"><button class="btn" id="c-next">'+(last?'See your rating':'Next case')+'</button></div></div>';
      $('#c-next').onclick=function(){ if(last) clueEnd(); else { cs.i++; clueCase(); } };
    } else {
      if(k.out[n] && el.querySelector('.stamp')) return;
      k.wrong++; if(!k.out[n]) toggleOut(el,n);
      el.insertAdjacentHTML('beforeend','<span class="stamp alibi">ALIBI</span>'); el.querySelector('[data-act=acc]').disabled=true;
      restart(el,'wrong'); restart(C,'shake'); restart(C,'flash-bad'); setTimeout(function(){C.classList.remove('flash-bad');},60);
      $('#c-hint').textContent='Wrong suspect. −150, and a new clue turns over.';
      flipNext(); syncMore();
    }
  }
  function wireToken(){
    var tok=$('#c-token');
    tok.addEventListener('pointerdown',function(e){
      var k=cs.list[cs.i]; if(k.solved || e.button>0) return;
      var r=tok.getBoundingClientRect(), fly=null, hot=null, moved=false;
      tok.setPointerCapture(e.pointerId);
      function hit(x,y){ var u=document.elementFromPoint(x,y), s=u&&u.closest('.sus:not(.solved)'); if(s && s.querySelector('.stamp.alibi')) s=null; if(s!==hot){ if(hot) hot.classList.remove('hot'); hot=s; if(hot) hot.classList.add('hot'); } }
      function move(ev){
        if(!moved){ if(Math.abs(ev.clientX-e.clientX)+Math.abs(ev.clientY-e.clientY)<5) return; moved=true; fly=document.createElement('div'); fly.className='tokenfly'; fly.innerHTML=MAG; document.body.appendChild(fly); tok.classList.add('held'); }
        fly.style.left=(ev.clientX-32)+'px'; fly.style.top=(ev.clientY-32)+'px';
        var edge=44; if(ev.clientY>innerHeight-edge) scrollBy(0,12); else if(ev.clientY<edge) scrollBy(0,-12);
        hit(ev.clientX,ev.clientY);
      }
      function up(){
        tok.removeEventListener('pointermove',move); tok.removeEventListener('pointerup',up); tok.removeEventListener('pointercancel',up);
        if(fly) fly.remove(); tok.classList.remove('held');
        if(hot){ hot.classList.remove('hot'); accuse(+hot.getAttribute('data-n')); }
        else if(!moved) $('#c-hint').textContent='Drag the glass onto a suspect, or press Accuse on their card.';
      }
      tok.addEventListener('pointermove',move); tok.addEventListener('pointerup',up); tok.addEventListener('pointercancel',up);
    });
  }
  function clueEnd(){
    var best=+get('prp_game_clue_best')||0, nb=cs.score>best; if(nb) put('prp_game_clue_best',cs.score);
    var avg=cs.log.reduce(function(a,l){return a+l.clues;},0)/cs.log.length;
    var rank = cs.score>=2200?'Master detective':cs.score>=1700?'Chief inspector':cs.score>=1100?'Detective':'Rookie investigator';
    var col = cs.score>=2200?'#FBBF24':cs.score>=1700?'#34D399':'#60A5FA';
    C.innerHTML='<div class="end in">'+medal(col)+'<div class="eyebrow">'+rank+'</div><h2>'+(nb?'New best score!':'Cases closed')+'</h2><div class="big" id="c-final">0</div>'+
      '<div class="summary"><div><b>'+avg.toFixed(1)+'</b><span>Clues per case</span></div><div><b>'+cs.log.reduce(function(a,l){return a+l.wrong;},0)+'</b><span>Wrong accusations</span></div><div><b>'+Math.max(best,cs.score)+'</b><span>Best score</span></div></div>'+
      '<ul class="review">'+cs.log.map(function(l){return '<li class="'+(l.wrong?'meh':'')+'"><b style="color:var(--ink)">'+esc(l.th.name)+'</b> · '+esc(l.th.founder)+' · '+l.clues+' clue'+(l.clues>1?'s':'')+' · +'+l.pts+'</li>';}).join('')+'</ul>'+
      '<div class="row"><button class="btn pulse" id="c-again">New set of cases</button><button class="btn ghost" id="c-home">Rules</button></div></div>';
    countUp($('#c-final'), cs.score, 1100); rain(nb?170:90);
    $('#c-again').onclick=clueStart; $('#c-home').onclick=clueIntro;
  }


  // ════════════ ACCESS ════════════
  // Code Match is free for everyone. Triage Rush follows the NCMHCE trial /
  // subscription rule (same as the other study tools); Theory Clue covers both
  // exams, so either an NCMHCE or an NCE trial or plan unlocks it.
  var TOKEN=null; try{ TOKEN=localStorage.getItem('prp_token'); }catch(e){}
  var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  function ok(l){ return l==='trial' || l==='paid'; }
  function levelOf(path){
    return fetch(path,{headers:{Authorization:'Bearer '+TOKEN},cache:'no-store'})
      .then(function(r){ if(r.status===401) return 'signin'; if(!r.ok) throw new Error('HTTP '+r.status); return r.json().then(function(d){ return d.accessLevel; }); });
  }
  var ACCESS = !TOKEN ? Promise.resolve({ncmhce:'free', nce:'free'})
    : Promise.all([levelOf('/api/content/access'), levelOf('/api/nce/access').catch(function(){ return 'expired'; })])
        .then(function(r){ return {ncmhce:r[0], nce:r[1]}; })
        // Server unreachable (offline, outage): signed-in accounts keep access.
        .catch(function(){ return {ncmhce:'trial', nce:'trial'}; });
  // Which lock to show when neither exam unlocks Theory Clue.
  function clueLock(a){
    if(a.ncmhce==='signin' || a.nce==='signin') return 'signin';
    if(a.ncmhce==='free') return 'free';
    if(a.ncmhce==='gated' || a.nce==='gated') return 'gated';
    return 'expired';
  }
  function lockCard(panel, game, level, both){
    var next=encodeURIComponent('/games.html#'+panel.id);
    var g = level==='gated'
      ? {t:'Your access is paused', b:'Submit your score report to keep playing '+game+'.', href:'/score-report.html', cta:'Submit score report'}
      : level==='expired'
      ? {t:'Your free trial has ended', b:'Subscribe to keep playing '+game+(both?' with an NCMHCE or NCE plan.':' and using every NCMHCE study tool.'), href: both?'/landing.html#pricing':'/checkout.html?tier=monthly', cta:'See plans'}
      : level==='signin'
      ? {t:'Sign in to play', b:'You were signed out. Sign in to keep playing '+game+'.', href:'/register.html?tab=login&next='+next, cta:'Sign in'}
      : {t:'Free with your trial', b:'Create a free account to play '+game+' during your 3-day trial. Code Match stays free for everyone.', href:'/register.html?next='+next, cta:'Create a free account', alt:true};
    panel.innerHTML='<div class="lock in"><div class="lk">'+LOCK+'</div><div class="eyebrow">'+esc(game)+'</div><h1>'+esc(g.t)+'</h1><p>'+esc(g.b)+'</p>'+
      '<div class="row"><a class="btn" href="'+g.href+'" style="text-decoration:none">'+esc(g.cta)+'</a>'+
      (g.alt?'<a class="btn ghost" style="text-decoration:none" href="/register.html?tab=login&next='+next+'">Sign in</a>':'')+
      '<button class="btn ghost" id="'+panel.id+'-free">Play Code Match</button></div></div>';
    $('#'+panel.id+'-free').onclick=function(){ show(tabs[0]); };
  }

  matchIntro();
  R.innerHTML=C.innerHTML='<p class="qn">Checking your access…</p>';
  ACCESS.then(function(a){
    if(ok(a.ncmhce)) rushIntro(); else lockCard(R,'Triage Rush',a.ncmhce,false);
    if(ok(a.ncmhce)||ok(a.nce)) clueIntro(); else lockCard(C,'Theory Clue', clueLock(a), true);
  });
})();
</script>
<script src="/activity-tracker.js" defer></script>
