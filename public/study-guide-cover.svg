<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="9in" viewBox="0 0 1200 1800" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f8fefb"/>
      <stop offset="0.5" stop-color="#e9f7f1"/>
      <stop offset="1" stop-color="#d8efe6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="1800" fill="#FFFFFF"/>

  <!-- scattered stars -->
  <g fill="#0f766e">
    <circle cx="120" cy="160" r="2.2" opacity="0.35"/>
    <circle cx="310" cy="90" r="1.6" opacity="0.25"/>
    <circle cx="530" cy="140" r="2.6" opacity="0.4"/>
    <circle cx="760" cy="80" r="1.8" opacity="0.25"/>
    <circle cx="980" cy="150" r="2.4" opacity="0.35"/>
    <circle cx="1100" cy="300" r="1.7" opacity="0.25"/>
    <circle cx="90" cy="420" r="1.9" opacity="0.3"/>
    <circle cx="1120" cy="620" r="2.1" opacity="0.3"/>
    <circle cx="70" cy="760" r="1.6" opacity="0.25"/>
    <circle cx="180" cy="1050" r="1.8" opacity="0.2"/>
    <circle cx="1050" cy="980" r="2" opacity="0.25"/>
    <circle cx="240" cy="260" r="1.4" opacity="0.2"/>
    <circle cx="880" cy="330" r="1.5" opacity="0.22"/>
    <circle cx="420" cy="60" r="1.3" opacity="0.2"/>
    <circle cx="650" cy="200" r="1.5" opacity="0.25"/>
  </g>

  <!-- geometric network — matches published cover -->
  <g stroke="#4A7C59" stroke-width="3.2" fill="none" opacity="0.9">
    <!-- outer ring (12 nodes) -->
    <line x1="600" y1="440" x2="705" y2="466"/>
    <line x1="705" y1="466" x2="782" y2="543"/>
    <line x1="782" y1="543" x2="810" y2="650"/>
    <line x1="810" y1="650" x2="782" y2="757"/>
    <line x1="782" y1="757" x2="705" y2="834"/>
    <line x1="705" y1="834" x2="600" y2="860"/>
    <line x1="600" y1="860" x2="495" y2="834"/>
    <line x1="495" y1="834" x2="418" y2="757"/>
    <line x1="418" y1="757" x2="390" y2="650"/>
    <line x1="390" y1="650" x2="418" y2="543"/>
    <line x1="418" y1="543" x2="495" y2="466"/>
    <line x1="495" y1="466" x2="600" y2="440"/>
    <!-- inner hexagon (6 nodes) -->
    <line x1="600" y1="552" x2="685" y2="601"/>
    <line x1="685" y1="601" x2="685" y2="699"/>
    <line x1="685" y1="699" x2="600" y2="748"/>
    <line x1="600" y1="748" x2="515" y2="699"/>
    <line x1="515" y1="699" x2="515" y2="601"/>
    <line x1="515" y1="601" x2="600" y2="552"/>
    <!-- spokes -->
    <line x1="600" y1="440" x2="600" y2="552" opacity="0.65"/>
    <line x1="705" y1="466" x2="685" y2="601" opacity="0.65"/>
    <line x1="782" y1="543" x2="685" y2="601" opacity="0.65"/>
    <line x1="810" y1="650" x2="685" y2="650" opacity="0.65"/>
    <line x1="782" y1="757" x2="685" y2="699" opacity="0.65"/>
    <line x1="705" y1="834" x2="685" y2="699" opacity="0.65"/>
    <line x1="600" y1="860" x2="600" y2="748" opacity="0.65"/>
    <line x1="495" y1="834" x2="515" y2="699" opacity="0.65"/>
    <line x1="418" y1="757" x2="515" y2="699" opacity="0.65"/>
    <line x1="390" y1="650" x2="515" y2="650" opacity="0.65"/>
    <line x1="418" y1="543" x2="515" y2="601" opacity="0.65"/>
    <line x1="495" y1="466" x2="515" y2="601" opacity="0.65"/>
    <!-- inner horizontal -->
    <line x1="515" y1="650" x2="685" y2="650" opacity="0.4"/>
  </g>
  <!-- outer nodes -->
  <g fill="#4A7C59">
    <circle cx="600" cy="440" r="10"/><circle cx="705" cy="466" r="10"/>
    <circle cx="782" cy="543" r="10"/><circle cx="810" cy="650" r="10"/>
    <circle cx="782" cy="757" r="10"/><circle cx="705" cy="834" r="10"/>
    <circle cx="600" cy="860" r="10"/><circle cx="495" cy="834" r="10"/>
    <circle cx="418" cy="757" r="10"/><circle cx="390" cy="650" r="10"/>
    <circle cx="418" cy="543" r="10"/><circle cx="495" cy="466" r="10"/>
    <!-- inner nodes -->
    <circle cx="600" cy="552" r="8"/><circle cx="685" cy="601" r="8"/>
    <circle cx="685" cy="699" r="8"/><circle cx="600" cy="748" r="8"/>
    <circle cx="515" cy="699" r="8"/><circle cx="515" cy="601" r="8"/>
  </g>

  <!-- series tag -->
  <text x="600" y="220" text-anchor="middle" fill="#475569" font-size="34" letter-spacing="10" font-weight="600">COUNSELORREADY&#8482; EXAM PREP SERIES</text>

  <!-- title block -->
  <text x="600" y="1060" text-anchor="middle" fill="#1e293b" font-size="112" font-weight="800" letter-spacing="2">THE COMPLETE</text>
  <text x="600" y="1200" text-anchor="middle" fill="#059669" font-size="148" font-weight="800" letter-spacing="4">NCMHCE</text>
  <text x="600" y="1310" text-anchor="middle" fill="#1e293b" font-size="96" font-weight="700" letter-spacing="3">STUDY GUIDE</text>

  <!-- accent band -->
  <rect x="420" y="1370" width="360" height="6" rx="3" fill="url(#band)"/>

  <!-- subtitle -->
  <text x="600" y="1450" text-anchor="middle" fill="#334155" font-size="40" font-weight="400">Clinical Reasoning, Diagnostic Reference &amp; Practice</text>
  <text x="600" y="1508" text-anchor="middle" fill="#334155" font-size="40" font-weight="400">for the Case-Simulation Exam</text>

  <!-- feature line -->
  <text x="600" y="1582" text-anchor="middle" fill="#0f766e" font-size="30" font-weight="600" letter-spacing="2">99 DIAGNOSES &#183; 18 FAMILIES &#183; 17 WORKED CASES</text>
  <text x="600" y="1626" text-anchor="middle" fill="#0f766e" font-size="30" font-weight="600" letter-spacing="2">3 PRACTICE EXAMS &#183; 310 QUESTIONS</text>
  <text x="600" y="1670" text-anchor="middle" fill="#0f766e" font-size="30" font-weight="600" letter-spacing="2">FREE DIGITAL FLASHCARDS INCLUDED</text>

  <!-- publisher -->
  <text x="600" y="1730" text-anchor="middle" fill="#64748b" font-size="30" letter-spacing="3">GA INTEGRATED THERAPEUTIC PERSPECTIVES LLC</text>
</svg>
