<style>
:root{
  --slate-900:#0F172A; --slate-800:#1E293B; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748B; --slate-400:#94A3B8; --slate-300:#CBD5E1; --slate-200:#E2E8F0; --white:#F8FAFC;
  --emerald:#10B981; --emerald-400:#34D399;
  --blue-400:#60A5FA; --blue:#3B82F6;
  --amber-400:#FBBF24; --amber:#F59E0B;
  --red-400:#F87171; --red:#EF4444; --red-600:#DC2626;
  --purple-400:#A78BFA; --purple:#8B5CF6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xl:16px; --r-lg:12px; --r-md:10px;
  --card:rgba(30,41,59,.55); --card-border:rgba(51,65,85,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(160deg,#0F172A 0%,#1E293B 50%,#0F172A 100%); background-attachment:fixed;
  color:var(--slate-200); font-family:var(--sans); font-size:16px; line-height:1.55;
}
.wrap{max-width:760px; margin:0 auto; padding:18px 16px 64px}
a{color:var(--emerald-400)}
header.site{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 2px 20px}
.brand-wrap{display:flex; align-items:center; gap:11px}
.brand-chip{width:38px; height:38px; border-radius:11px; background:rgba(16,185,129,.16); display:grid; place-items:center; flex:0 0 auto}
.brand-chip svg{width:21px; height:21px; color:var(--emerald-400)}
.brand{font-weight:700; font-size:18px; color:var(--white); letter-spacing:-.01em; line-height:1.1}
.brand .prep{color:var(--emerald-400)}
.brand small{display:block; font-weight:600; font-size:11.5px; color:var(--emerald-400); letter-spacing:.02em; margin-top:1px}
.exam-badge{font-size:12px; font-weight:700; color:var(--emerald-400); background:rgba(16,185,129,.14);
  border:1px solid rgba(16,185,129,.3); padding:5px 11px; border-radius:999px}
h1{font-size:25px; line-height:1.15; margin:0 0 6px; color:var(--white); font-weight:700; letter-spacing:-.01em}
h2{font-size:18px; margin:0 0 6px; color:var(--white); font-weight:700}
.lead{color:var(--slate-400); margin:0 0 18px}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-xl); padding:18px 20px}
.stack > * + *{margin-top:14px}
.badge{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:4px 10px; border-radius:999px; text-transform:uppercase}
.b-emerald{color:var(--emerald-400); background:rgba(16,185,129,.15)}
.b-blue{color:var(--blue-400); background:rgba(59,130,246,.15)}
.b-amber{color:var(--amber-400); background:rgba(245,158,11,.15)}
.b-red{color:var(--red-400); background:rgba(239,68,68,.15)}
.b-purple{color:var(--purple-400); background:rgba(139,92,246,.15)}
.b-slate{color:var(--slate-300); background:rgba(51,65,85,.5)}
.chips{display:flex; gap:8px; flex-wrap:wrap}

/* sticky timer */
.timer-bar{
  position:sticky; top:0; z-index:100;
  background:rgba(15,23,42,.95); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--card-border);
  padding:10px 16px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
}
.timer-center{font-size:14px; color:var(--slate-300); text-align:center; line-height:1.35}
.timer-center strong{color:var(--white)}
.timer-wrap{display:flex; align-items:center; gap:14px}
.timer-display{font-size:22px; font-weight:800; color:var(--white); letter-spacing:.02em; font-variant-numeric:tabular-nums; min-width:72px}
.timer-display.warn{color:var(--amber-400)}
.timer-display.danger{color:var(--red-400)}
.timer-sub{font-size:11px; color:var(--slate-500); margin-top:1px}
.timer-prog{font-size:13px; color:var(--slate-400); text-align:right; line-height:1.4}
.timer-prog strong{color:var(--white)}
.tbar{height:4px; background:var(--slate-700); border-radius:999px; overflow:hidden; width:90px; margin-top:4px}
.tbar > i{display:block; height:100%; background:var(--emerald); transition:width 1s linear}

/* vignette */
.vignette .seg{margin-top:15px}
.vignette .seg:first-child{margin-top:0}
.seg-label{font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px}
.seg-intake{color:var(--emerald-400)} .seg-s1{color:var(--blue-400)} .seg-s2{color:var(--amber-400)}
.seg-text{color:var(--slate-200); line-height:1.62}

/* diagnosis banner */
.dx-banner{background:rgba(139,92,246,.13); border:1px solid rgba(139,92,246,.32); border-radius:var(--r-lg); padding:13px 15px; margin-top:14px}
.dx-banner .seg-label{color:var(--purple-400)}
.dx-banner .dx-name{font-size:17px; font-weight:700; color:var(--white)}

/* question + options */
.qstem{font-size:18px; line-height:1.4; margin:12px 0 16px; color:var(--white); font-weight:600}
.opt{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
  background:rgba(30,41,59,.5); border:1.5px solid var(--card-border); border-radius:var(--r-md);
  padding:13px 15px; transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--slate-600); background:rgba(30,41,59,.85)}
.opt:disabled{cursor:default}
.opt.selected{border-color:var(--emerald); background:rgba(16,185,129,.1)}
.opt.selected .key{background:var(--emerald); color:#04261C}
.opt.correct{border-color:rgba(16,185,129,.55); background:rgba(16,185,129,.13)}
.opt.incorrect{border-color:rgba(239,68,68,.5); background:rgba(239,68,68,.12)}
.opt.dim{opacity:.5}
.opt.correct .key{background:var(--emerald); color:#04261C}
.opt.incorrect .key{background:var(--red-600); color:#fff}
.opt .key{flex:0 0 auto; width:28px; height:28px; border-radius:8px; background:var(--slate-700); color:var(--slate-300);
  display:grid; place-items:center; font-weight:700; font-size:14px}
.opt .otext{flex:1}
.opt .mark{margin-left:8px; font-weight:700; flex:0 0 auto}
.opt.correct .mark{color:var(--emerald-400)}
.opt.incorrect .mark{color:var(--red-400)}

/* option row: main option + cross-out toggle */
.opt-row{display:flex; gap:8px; align-items:stretch; margin-bottom:10px}
.opt-row .opt{margin-bottom:0}
.opt-row.struck .opt{opacity:.45}
.opt-row.struck .opt .otext{text-decoration:line-through}
.opt-strike{flex:0 0 auto; width:34px; border:1.5px solid var(--card-border); border-radius:var(--r-md);
  background:rgba(30,41,59,.5); color:var(--slate-400); cursor:pointer; font-size:15px; font-weight:700;
  transition:border-color .15s, background .15s, color .15s}
.opt-strike:hover{border-color:var(--red-400); color:var(--red-400)}
.opt-strike.active{border-color:var(--red-400); background:rgba(239,68,68,.12); color:var(--red-400)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font:inherit; font-weight:700;
  background:var(--emerald); color:#04261C; border:none; border-radius:var(--r-md); padding:13px 22px; transition:background .15s}
.btn:hover{background:var(--emerald-400)}
.btn.secondary{background:rgba(51,65,85,.5); color:var(--slate-200); border:none}
.btn.secondary:hover{background:rgba(51,65,85,.85)}
.btn.danger{background:var(--red); color:#fff; border:none}
.btn.danger:hover{background:var(--red-400)}
.btn.sm{padding:8px 16px; font-size:14px}
.btn:disabled{opacity:.35; cursor:default}
.btn:disabled:hover{background:rgba(51,65,85,.5)}
.row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.back{background:none; border:none; cursor:pointer; font:inherit; color:var(--slate-400); font-weight:600; padding:6px 0; margin-bottom:8px; text-decoration:none; display:inline-block}
.back:hover{color:var(--white)}

/* flag button */
.flag-btn{background:none; border:1.5px solid var(--card-border); border-radius:var(--r-md); cursor:pointer; font:inherit;
  font-size:13px; font-weight:600; color:var(--slate-400); padding:7px 13px; transition:.15s}
.flag-btn:hover{border-color:var(--amber); color:var(--amber-400)}
.flag-btn.flagged{border-color:var(--amber); color:var(--amber-400); background:rgba(245,158,11,.1)}

/* answer grid */
.ag-wrap{margin-bottom:14px}
.ag-legend{font-size:11.5px; color:var(--slate-500); margin-bottom:6px; display:flex; gap:12px; flex-wrap:wrap}
.ag-legend span{display:flex; align-items:center; gap:4px}
.ag-dot{width:10px; height:10px; border-radius:3px; display:inline-block}
.ag-groups{display:flex; flex-wrap:wrap; gap:10px}
.ag-group{display:flex; flex-direction:column; gap:4px}
.ag-group-label{font-size:10px; font-weight:700; color:var(--slate-500); text-transform:uppercase; letter-spacing:.04em}
.ag-cells{display:flex; gap:4px; flex-wrap:wrap}
.ag-cell{width:30px; height:30px; border-radius:7px; border:1.5px solid var(--card-border);
  background:rgba(30,41,59,.5); cursor:pointer; font:inherit; font-size:11px; font-weight:700;
  color:var(--slate-400); display:grid; place-items:center; transition:.12s; padding:0}
.ag-cell:hover{border-color:var(--slate-500); color:var(--slate-200)}
.ag-cell.current{border-color:var(--emerald); color:var(--emerald-400); background:rgba(16,185,129,.12)}
.ag-cell.answered{background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.35); color:var(--emerald-400)}
.ag-cell.flagged{background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.4); color:var(--amber-400)}
.ag-cell.answered.flagged{background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.5)}
.ag-cell.lg{width:40px; height:40px; font-size:13px}
.ag-cell.locked,.ag-cell.locked:hover{background:rgba(30,41,59,.2); border-color:rgba(51,65,85,.4); color:var(--slate-600); cursor:not-allowed}

/* exam layout: split screen ≥1024px, stacked below */
body.exam-active .wrap > header.site, body.exam-active .wrap > h1, body.exam-active .wrap > p.lead{display:none}
body.exam-active .wrap{max-width:1280px}
body.exam-active #prp-suggest-tab, body.exam-active #prp-suggest-panel{display:none}
.exam-split{display:block}
.narr-pane{display:none}
.q-col{display:flex; flex-direction:column; gap:14px}
.case-info{padding:0}
.case-info-toggle{width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; cursor:pointer;
  font:inherit; font-weight:700; font-size:15px; color:var(--white); padding:13px 18px}
.case-info-body{padding:0 18px 16px}
.q-pane{display:flex; flex-direction:column; padding:0}
.q-scroll{padding:18px 20px}
.q-bar{position:sticky; bottom:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px;
  border-top:1px solid var(--card-border); background:rgba(15,23,42,.95); border-radius:0 0 var(--r-xl) var(--r-xl)}
.q-bar .flag-btn{margin:0}
.q-scroll .ag-wrap{margin:20px 0 0; padding-top:14px; border-top:1px solid var(--card-border)}
@media(min-width:1024px){
  body.exam-active{height:100vh; overflow:hidden; display:flex; flex-direction:column}
  body.exam-active .wrap{flex:1; min-height:0; width:100%; display:flex; flex-direction:column; padding-bottom:16px}
  body.exam-active #app{flex:1; min-height:0}
  .exam-split{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:minmax(0,1fr); gap:16px; height:100%}
  .narr-pane{display:block; position:relative; overflow-y:auto; min-height:0}
  .q-col{min-height:0}
  .case-info{display:none}
  .q-pane{flex:1; min-height:0}
  .q-scroll{flex:1; min-height:0; overflow-y:auto}
  .q-bar{position:static; background:transparent}
}

/* lock modal + break */
.modal-back{position:fixed; inset:0; z-index:9100; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); display:grid; place-items:center; padding:16px}
.modal{width:100%; max-width:440px; background:var(--slate-800); border:1px solid var(--slate-700); border-radius:var(--r-xl); padding:20px}
.modal-title{font-weight:700; color:var(--amber-400); margin-bottom:8px}
.modal-body{font-size:14px; color:var(--slate-300); margin-bottom:6px}
.modal-body strong{color:var(--white)}
.modal-row{display:flex; justify-content:flex-end; gap:8px; margin-top:14px}
.pause-wrap{display:grid; place-items:center; min-height:60vh}
.pause-card{max-width:460px; width:100%; text-align:center}
.break-clock{font-size:46px; font-weight:800; color:var(--white); font-variant-numeric:tabular-nums; margin:6px 0 8px}

/* case progress */
.case-prog{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.case-tag{font-size:13px; font-weight:700; color:var(--emerald-400)}
.bar{height:6px; background:var(--slate-700); border-radius:999px; overflow:hidden; margin:0 0 14px}
.bar > i{display:block; height:100%; background:var(--emerald); transition:width .25s}
.q-meta{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.q-num{font-size:13px; color:var(--slate-400)}

/* score / results */
.score-card{text-align:center; border-radius:var(--r-xl); padding:26px 20px; border:1px solid}
.score-card.pass{background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.3)}
.score-card.fail{background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.3)}
.score-icon{font-size:34px; line-height:1; margin-bottom:6px}
.score-big{font-size:42px; font-weight:800; color:var(--white); line-height:1}
.score-sub{color:var(--slate-300); margin-top:6px}
.dom-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--card-border); font-size:15px; color:var(--slate-200)}
.dom-row:last-child{border-bottom:none}
.dom-score{font-weight:700}
.case-row{display:grid; grid-template-columns:1fr auto auto; gap:8px 12px; align-items:start; padding:10px 0; border-bottom:1px solid var(--card-border); font-size:14px}
.case-row:last-child{border-bottom:none}
.cr-title{color:var(--slate-200); min-width:0}
.cr-cat{font-size:11.5px; color:var(--slate-500); margin-bottom:2px}
.cr-pct{font-weight:700; color:var(--white); text-align:right}
.cr-pf{font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
.cr-pass{color:var(--emerald-400); background:rgba(16,185,129,.15)}
.cr-fail{color:var(--red-400); background:rgba(239,68,68,.15)}
.dom-bar-wrap{margin:5px 0}
.dom-bar-label{display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px}
.dom-bar-label span:first-child{color:var(--slate-300)}
.dom-bar-label span:last-child{font-weight:700; color:var(--white)}
.dom-bar{height:7px; background:var(--slate-700); border-radius:999px; overflow:hidden}
.dom-bar > i{display:block; height:100%; border-radius:999px}

/* review */
.review-case{margin-bottom:18px}
.review-hd{font-weight:700; color:var(--white); font-size:15px; padding:11px 15px;
  background:rgba(30,41,59,.7); border-radius:var(--r-lg); border:1px solid var(--card-border);
  display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
.review-q{padding:14px 16px; background:rgba(30,41,59,.4); border-radius:var(--r-lg);
  border:1px solid var(--card-border); margin-bottom:8px}
.review-q .qstem{font-size:15px; margin:8px 0 12px}
.fb-block{margin-top:10px}
.fb-label{font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--slate-400); margin-bottom:3px}
.fb-block strong{color:var(--white)}
.verdict{font-weight:700; font-size:14px; margin-bottom:8px}
.verdict.ok{color:var(--emerald-400)} .verdict.no{color:var(--red-400)}

:focus-visible{outline:2.5px solid var(--emerald-400); outline-offset:2px; border-radius:6px}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); border:0}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
@media(max-width:520px){h1{font-size:22px} .wrap{padding:16px 14px 56px} .card{padding:14px 16px} .timer-display{font-size:18px}
  .timer-center .tc-sep{display:none} .timer-center .tc-sec{display:block; font-size:12px} .timer-prog{font-size:12px}
  .card.case-info,.card.q-pane{padding:0}}
</style>
</head>
<body>

<!-- sticky timer — only visible during exam -->
<div class="timer-bar" id="timer-bar" style="display:none" role="timer" aria-live="off">
  <div class="timer-wrap">
    <div>
      <div class="timer-display" id="timer-display">225:00</div>
      <div class="timer-sub">remaining</div>
    </div>
    <div>
      <div class="tbar"><i id="tbar-fill" style="width:100%"></i></div>
    </div>
  </div>
  <div class="timer-center" id="timer-center"><strong>Case 1 of 11</strong></div>
  <div class="timer-prog" id="timer-prog"></div>
</div>

<div class="wrap">
  <header class="site">
    <div class="brand-wrap">
      <span class="brand-chip" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
          <path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
      </span>
      <span class="brand">PassReady <span class="prep">Prep</span><small>NCMHCE clinical simulations</small></span>
    </div>
    <span class="exam-badge">MOCK EXAM</span>
  </header>
  <h1>Timed NCMHCE Mock Exam</h1><p class="lead">A full-length, timed mock exam with realistic clinical case simulations and instant scoring — the closest practice environment to sitting the real NCMHCE.</p>
  <main id="app" aria-live="polite"></main>
</div>

<script>
// ---- constants ----
// Exam flow follows the NBCC Candidate Handbook (rev. Nov 2025) for the current
// format and the NBCC NCMHCE Exam Specifications (effective July 1, 2027) for
// the 2027 format. Mirrors client/src/pages/MockExam.jsx — keep them in sync.
// lockMode 'section': each case section is reviewed then locked (current format).
// lockMode 'half':    free navigation within cases 1–5, then 6–10 (2027 format).
// breakMode 'scheduled': 15-minute break after case 5 (current format).
// breakMode 'optional':  break offered at the halfway point (2027 format).
const examConfig = {
  current: { size: 11, minutes: 225, lockMode: 'section', breakMode: 'scheduled' },
  '2027':  { size: 10, minutes: 225, lockMode: 'half',    breakMode: 'optional' }
};
const SPEC_CUTOVER = new Date('2027-07-01T00:00:00Z');
const BREAK_SECS = 15 * 60;
const HALF_CASES = 5;   // the break / half boundary falls after case 5
// Mock exams need a free trial or a subscription. Free / expired / gated
// visitors get a sign-up or upgrade prompt and nothing is built or saved.
const EXAM_ACCESS = ['trial', 'paid'];
const HISTORY_KEY = 'prp_history';

const BLUEPRINT = {
  Depressive:20, Anxiety:20, Trauma:18, Substance:16, Personality:16,
  Bipolar:12, Neurodevelopmental:12, 'OCD-Related':10, Psychotic:10,
  Eating:10, Crisis:10, Disruptive:8, Somatic:8, Neurocognitive:6,
  Dissociative:6, Sleep:6, 'Sexual-Gender':6, Ethics:6
};

// Case sections. Mirrors sectionIndexForDomain() in tools/cases/caseSchema.js
// (0 = intake, 1 = session1, 2 = session2).
const SECTION_KEYS = ['intake','session1','session2'];
const SECTION_LABELS = ['Intake','Session 1','Session 2'];
const SECTION_CLS = ['seg-intake','seg-s1','seg-s2'];
const DOMAIN_SECTION = { intake:0, core:0, treatment:1, counseling:2, ethics:2 };
function sectionIndexForDomain(d){ return (d in DOMAIN_SECTION) ? DOMAIN_SECTION[d] : SECTION_KEYS.length-1; }
function sectionOf(q){
  const i = SECTION_KEYS.indexOf(q && q.section);
  return i >= 0 ? i : sectionIndexForDomain(q && q.domain);
}

// ---- DOM refs ----
const app = document.getElementById('app');
const timerBar = document.getElementById('timer-bar');
const timerDisplay = document.getElementById('timer-display');
const tbarFill = document.getElementById('tbar-fill');
const timerCenter = document.getElementById('timer-center');
const timerProg = document.getElementById('timer-prog');

// ---- helpers ----
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fmtTime(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }

// Exam date before 2027-07-01 → current; on/after → '2027'; no date → current.
function specForExamDate(d){
  if(!d) return 'current';
  const t = new Date(/^\d{4}-\d{2}-\d{2}$/.test(d) ? d+'T12:00:00Z' : d);
  if(isNaN(t.getTime())) return 'current';
  return t >= SPEC_CUTOVER ? '2027' : 'current';
}
// Cached User record from sign-in; used when /api/auth/me is unavailable.
function cachedExamDate(){
  try { return JSON.parse(localStorage.getItem('prp_user') || '{}').examDate || null; } catch(_){ return null; }
}

// ---- state ----
let spec = 'current';
let cfg = examConfig.current;
let examCases = [];     // full case objects
let examAnswers = [];   // [{questions:[null|{chosenId}], struck:[Set], flags:[bool]}]
let stops = [];         // non-empty case sections in exam order
let positions = [];     // [{si, ci, qi}] — every question in exam order
let cur = 0;            // index into positions
let maxReached = 0;     // furthest position reached
let lockedCount = 0;    // stops [0, lockedCount) are locked
let view = 'question';  // question | review | halfway | break
let timerSecs = examConfig.current.minutes * 60;
let timerIv = null;
let breakSecs = BREAK_SECS;
let breakIv = null;
let examSecsUsed = 0;
let submitted = false;
let infoOpen = {};      // <1024px case-info panel, per case
let collapseArmed = null;
let lastRender = null;  // {cur, view, narrStop} of the previous exam render
const LETTERS = ['A','B','C','D','E','F'];

// ---- history (matching saveToHistory shape exactly) ----
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]; }catch(_){ return []; } }
function saveHistory(h){ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }

function saveExamToHistory(){
  const h = loadHistory();
  examCases.forEach((c, ci) => {
    const ea = examAnswers[ci];
    const domains = {};
    c.questions.forEach((q, qi) => {
      const a = ea.questions[qi];
      const chosen = a && q.options.find(o => o.id === a.chosenId);
      const isOk = !!(chosen && chosen.isCorrect);
      const d = q.domain || 'general';
      if(!domains[d]) domains[d] = {ok:0, total:0};
      domains[d].total++;
      if(isOk) domains[d].ok++;
    });
    const correct = Object.values(domains).reduce((s,d) => s+d.ok, 0);
    const total   = Object.values(domains).reduce((s,d) => s+d.total, 0);
    h.push({
      caseId: c.id || c.title,
      date: Date.now(),
      correct, total, domains,
      dxCorrect: null,
      difficulty: c.difficulty || 'medium',
    });
  });
  if(h.length > 500) h.splice(0, h.length - 500);
  saveHistory(h);
}

// ---- blueprint-weighted selection ----
function matchBpKey(cat){
  if(!cat) return null;
  const t = cat.trim();
  for(const k of Object.keys(BLUEPRINT)){
    if(k.toLowerCase() === t.toLowerCase()) return k;
  }
  const first = t.split(/[\s\-_]/)[0].toLowerCase();
  for(const k of Object.keys(BLUEPRINT)){
    if(k.toLowerCase().startsWith(first)) return k;
  }
  return null;
}

function weightedSelectItems(items, size){
  const groups = {};
  items.forEach(it => {
    const k = matchBpKey(it.category);
    if(!k) return;
    if(!groups[k]) groups[k] = [];
    groups[k].push(it);
  });
  const bpArr = Object.entries(BLUEPRINT);
  const totalW = bpArr.reduce((s,[,w]) => s+w, 0);
  const selected = [], usedIds = new Set();
  const pools = {};
  for(const [k,v] of Object.entries(groups)) pools[k] = [...v];

  let attempts = 0;
  while(selected.length < size && attempts < 400){
    attempts++;
    let r = Math.random() * totalW, cat = bpArr[bpArr.length-1][0];
    for(const [k,w] of bpArr){ r -= w; if(r <= 0){ cat = k; break; } }
    const pool = (pools[cat]||[]).filter(it => !usedIds.has(it.externalId));
    if(!pool.length) continue;
    const pick = pool[Math.floor(Math.random()*pool.length)];
    usedIds.add(pick.externalId);
    selected.push(pick);
  }
  return selected;
}

// ---- API ----
// Attach the signed-in user's JWT (same key register.html sets) so paying
// users get the full case bank instead of the 5-case free cap.
function authHeaders(){
  try { const t = localStorage.getItem('prp_token'); return t ? { Authorization: 'Bearer ' + t } : {}; }
  catch(_) { return {}; }
}

async function fetchCatalog(){
  const r = await fetch('/api/content?exam=ncmhce', { headers: authHeaders() });
  if(!r.ok) throw new Error('Catalog request failed ('+r.status+')');
  return r.json();
}

async function fetchCase(externalId){
  const r = await fetch('/api/content/'+encodeURIComponent(externalId), { headers: authHeaders() });
  if(!r.ok) throw new Error('Case request failed for '+externalId);
  const j = await r.json();
  return (j.item && j.item.caseSim) ? j.item.caseSim : j.item;
}

// Spec follows the signed-in user's exam date (User.examDate).
async function fetchSpec(){
  try {
    const r = await fetch('/api/auth/me', { headers: authHeaders() });
    if(r.ok){
      const j = await r.json();
      if(j && j.user) return specForExamDate(j.user.examDate);
    }
  } catch(_){}
  return specForExamDate(cachedExamDate());
}

// ---- sections ----
// Split every case into its non-empty sections ("stops"), in exam order.
// Questions keep their original order within a section. A section with no
// questions has its narrative shown with the next section (cumulative reveal);
// a trailing empty section is shown with the case's last stop.
function buildStops(cases){
  const out = [];
  cases.forEach((c, ci) => {
    const buckets = [[],[],[]];
    c.questions.forEach((q, qi) => buckets[sectionOf(q)].push(qi));
    const present = [0,1,2].filter(s => buckets[s].length);
    present.forEach((s, k) => {
      const last = k === present.length-1;
      out.push({ ci, sec:s, qis:buckets[s], revealThrough: last ? 2 : s, firstOfCase: k===0, lastOfCase: last });
    });
  });
  return out;
}

function hasHalves(){ return examCases.length > HALF_CASES; }
function halfOfStop(si){ return hasHalves() && stops[si] && stops[si].ci >= HALF_CASES ? 1 : 0; }

// The block of stops currently being worked: one section (lockMode 'section')
// or one half of the exam (lockMode 'half').
function unitInfo(){
  const start = lockedCount;
  let end = start;
  if(cfg.lockMode === 'half'){
    while(end+1 < stops.length && halfOfStop(end+1) === halfOfStop(start)) end++;
  }
  const firstPos = positions.findIndex(p => p.si >= start);
  let lastPos = firstPos;
  while(lastPos+1 < positions.length && positions[lastPos+1].si <= end) lastPos++;
  return { start, end, firstPos, lastPos, isFinal: end >= stops.length-1 };
}

function isNavigable(idx){
  const p = positions[idx], u = unitInfo();
  if(!p || p.si < u.start || p.si > u.end) return false;
  return cfg.lockMode === 'section' || idx <= maxReached;
}

function isAnswered(idx){ const p = positions[idx]; return !!examAnswers[p.ci].questions[p.qi]; }
function isFlagged(idx){ const p = positions[idx]; return !!examAnswers[p.ci].flags[p.qi]; }

// ---- timer ----
// The exam clock pauses for the halfway prompt and the break.
function startTimer(){
  stopTimer();
  timerIv = setInterval(() => {
    timerSecs--;
    renderTimerBar();
    if(timerSecs <= 0){ timerSecs = 0; stopTimer(); autoSubmit(); }
  }, 1000);
}

function stopTimer(){
  if(timerIv){ clearInterval(timerIv); timerIv = null; }
}

function renderTimerBar(){
  const total = cfg.minutes*60;
  timerDisplay.textContent = fmtTime(timerSecs);
  timerDisplay.className = 'timer-display' + (timerSecs<=300?' danger':timerSecs<=600?' warn':'');
  tbarFill.style.width = Math.round(timerSecs / total * 100)+'%';
  tbarFill.style.background = timerSecs<=300?'var(--red-400)':timerSecs<=600?'var(--amber-400)':'var(--emerald)';
  const p = positions[cur];
  if(!p) return;
  const sec = SECTION_LABELS[stops[p.si].sec];
  const secLabel = view === 'review' ? (cfg.lockMode === 'section' ? sec+' review' : 'Review') : sec;
  timerCenter.innerHTML = '<strong>Case '+(p.ci+1)+' of '+examCases.length+'</strong><span class="tc-sep"> · </span><span class="tc-sec">'+esc(secLabel)+'</span>';
  timerProg.innerHTML = view === 'review' ? '' : 'Question <strong>'+(cur+1)+'</strong> of '+positions.length;
}

// ---- navigation ----
function goTo(idx){
  if(!isNavigable(idx)) return;
  cur = idx;
  maxReached = Math.max(maxReached, idx);
  view = 'question';
  render();
}

function goNext(){
  const u = unitInfo();
  const lastInBlock = cfg.lockMode === 'section'
    ? !(positions[cur+1] && positions[cur+1].si === positions[cur].si)
    : cur >= u.lastPos;
  if(lastInBlock){ view = 'review'; render(); return; }
  cur++;
  maxReached = Math.max(maxReached, cur);
  render();
}

function goBack(){
  if(cur > unitInfo().firstPos){ cur--; render(); }
}

function backToQuestion(){ view = 'question'; render(); }

// ---- answer recording ----
// Clicking an option selects it immediately; it can be changed until the
// section (current) or half (2027) is submitted.
function chooseQ(optId){
  if(!isNavigable(cur)) return;
  const p = positions[cur];
  examAnswers[p.ci].questions[p.qi] = {chosenId: optId};
  render();
}

function toggleStrikeQ(optId){
  if(!isNavigable(cur)) return;
  const p = positions[cur];
  const s = examAnswers[p.ci].struck[p.qi];
  if(s.has(optId)) s.delete(optId); else s.add(optId);
  render();
}

function toggleFlag(){
  if(!isNavigable(cur)) return;
  const p = positions[cur];
  const ea = examAnswers[p.ci];
  ea.flags[p.qi] = !ea.flags[p.qi];
  render();
}

function toggleInfo(ci){
  infoOpen[ci] = !infoOpen[ci];
  render();
}

// ---- review / lock ----
function unitCounts(){
  const u = unitInfo();
  let unanswered = 0, flagged = 0, total = 0;
  for(let i = u.firstPos; i >= 0 && i <= u.lastPos; i++){
    total++;
    if(!isAnswered(i)) unanswered++;
    if(isFlagged(i)) flagged++;
  }
  return { total, unanswered, flagged };
}

function lockLabel(){
  const u = unitInfo();
  return u.isFinal ? 'Submit exam' : cfg.lockMode === 'section' ? 'Continue to next section' : 'Submit first half';
}

function requestLock(){
  const n = unitCounts();
  if(cfg.lockMode === 'section' && n.unanswered === 0 && n.flagged === 0){ lockUnit(); return; }
  showLockModal(n);
}

function showLockModal(n){
  const u = unitInfo();
  const title = u.isFinal ? 'Submit exam?' : cfg.lockMode === 'section' ? 'Leave this section?' : 'Submit first half?';
  const warn = u.isFinal
    ? 'You will not be able to change your answers after submitting.'
    : cfg.lockMode === 'section'
    ? 'You will not be able to return to this section.'
    : 'You will not be able to return to cases 1–'+HALF_CASES+'.';
  const counts = [];
  if(n.unanswered) counts.push(n.unanswered+' unanswered');
  if(n.flagged) counts.push(n.flagged+' flagged');
  let h = '<div class="modal-back" id="lock-modal" role="dialog" aria-modal="true"><div class="modal">';
  h += '<div class="modal-title">⚠ '+esc(title)+'</div>';
  if(counts.length) h += '<div class="modal-body">'+counts.join(' · ')+'</div>';
  h += '<div class="modal-body"><strong>'+esc(warn)+'</strong></div>';
  h += '<div class="modal-row"><button class="btn secondary sm" onclick="closeModal()">Go back</button>'
     + '<button class="btn sm" onclick="lockUnit()">'+esc(lockLabel())+'</button></div>';
  h += '</div></div>';
  closeModal();
  document.body.insertAdjacentHTML('beforeend', h);
}

function closeModal(){
  const m = document.getElementById('lock-modal');
  if(m) m.remove();
}

function lockUnit(){
  closeModal();
  const u = unitInfo();
  const newLocked = u.end + 1;
  if(newLocked >= stops.length){ doSubmit(); return; }
  lockedCount = newLocked;
  const justLocked = stops[u.end];
  if(hasHalves() && justLocked.ci === HALF_CASES-1 && justLocked.lastOfCase){
    stopTimer();
    breakSecs = BREAK_SECS;
    if(cfg.breakMode === 'scheduled') startBreak();
    else { view = 'halfway'; renderPause(); }
    return;
  }
  enterStop(lockedCount);
}

function enterStop(si){
  cur = positions.findIndex(p => p.si >= si);
  maxReached = Math.max(maxReached, cur);
  view = 'question';
  render();
}

// ---- break ----
function startBreak(){
  stopTimer();
  breakSecs = BREAK_SECS;
  view = 'break';
  if(breakIv) clearInterval(breakIv);
  breakIv = setInterval(() => {
    breakSecs = Math.max(0, breakSecs-1);
    const el = document.getElementById('break-clock');
    if(el) el.textContent = fmtTime(breakSecs);
    if(breakSecs === 0) resumeExam();
  }, 1000);
  renderPause();
}

function resumeExam(){
  if(breakIv){ clearInterval(breakIv); breakIv = null; }
  if(submitted) return;
  startTimer();
  enterStop(lockedCount);
}

function renderPause(){
  let h = '<div class="pause-wrap"><div class="card pause-card">';
  h += '<div style="font-size:34px;line-height:1;margin-bottom:8px">☕</div>';
  if(view === 'halfway'){
    h += '<h2>Halfway point</h2>';
    h += '<p style="color:var(--slate-300)">Take a 15-minute break or continue now.</p>';
    h += '<p style="font-size:13px;color:var(--slate-500)">Exam time remaining: '+fmtTime(timerSecs)+' (paused)</p>';
    h += '<div class="row" style="justify-content:center"><button class="btn secondary" onclick="startBreak()">Take a 15-minute break</button>'
       + '<button class="btn" onclick="resumeExam()">Continue now ›</button></div>';
  } else {
    h += '<h2>'+(cfg.breakMode === 'scheduled' ? 'Scheduled Break' : 'Break')+'</h2>';
    h += '<div class="break-clock" id="break-clock">'+fmtTime(breakSecs)+'</div>';
    h += '<p style="color:var(--slate-400);font-size:14px">The exam clock is paused ('+fmtTime(timerSecs)+' remaining). Cases 1–'+HALF_CASES+' are now locked. The exam resumes automatically at 0:00.</p>';
    h += '<div class="row" style="justify-content:center"><button class="btn" onclick="resumeExam()">Resume exam now ›</button></div>';
  }
  h += '</div></div>';
  timerBar.style.display = 'none';
  lastRender = null;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

// ---- submit ----
function autoSubmit(){
  if(!submitted) doSubmit();
}

function doSubmit(){
  if(submitted) return;
  submitted = true;
  stopTimer();
  if(breakIv){ clearInterval(breakIv); breakIv = null; }
  closeModal();
  examSecsUsed = cfg.minutes*60 - timerSecs;
  timerBar.style.display = 'none';
  document.body.classList.remove('exam-active');
  saveExamToHistory();
  renderResults();
}

function beginExam(){
  cur = 0; maxReached = 0; lockedCount = 0; view = 'question';
  infoOpen = {}; collapseArmed = null; lastRender = null;
  timerSecs = cfg.minutes * 60;
  document.body.classList.add('exam-active');
  startTimer();
  render();
}

// ---- render: exam ----
function gridHtml(onlyUnit, large){
  const u = unitInfo();
  let h = '<div class="ag-legend">'
    + '<span><i class="ag-dot" style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35)"></i>Answered</span>'
    + '<span><i class="ag-dot" style="background:rgba(30,41,59,.5);border:1px solid var(--card-border)"></i>Unanswered</span>'
    + '<span><i class="ag-dot" style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4)"></i>Flagged</span>'
    + '</div><div class="ag-groups">';
  stops.forEach((st, si) => {
    if(si > u.end) return;               // future sections hidden
    const locked = si < u.start;
    if(locked && onlyUnit) return;
    let cells = '';
    positions.forEach((p, idx) => {
      if(p.si !== si) return;
      if(!locked && !isNavigable(idx)) return;  // not yet revealed
      const ans = isAnswered(idx), fl = isFlagged(idx);
      let cls = 'ag-cell'+(large?' lg':'');
      if(locked) cls += ' locked';
      else if(view === 'question' && idx === cur) cls += ' current';
      else if(fl) cls += ' flagged'+(ans?' answered':'');
      else if(ans) cls += ' answered';
      const title = locked ? 'Locked' : fl ? 'Flagged' : ans ? 'Answered' : 'Unanswered';
      cells += '<button class="'+cls+'" title="'+title+'"'+(locked?' disabled':' onclick="goTo('+idx+')"')+'>'+(idx+1)+'</button>';
    });
    if(!cells) return;
    h += '<div class="ag-group"><div class="ag-group-label">'+(locked?'🔒 ':'')+'C'+(st.ci+1)+' '+['Intake','S1','S2'][st.sec]+'</div>';
    h += '<div class="ag-cells">'+cells+'</div></div>';
  });
  return h + '</div>';
}

function narrativeHtml(c, ci, revealThrough, withIds){
  let h = '<div class="case-prog"><span class="case-tag">Case '+(ci+1)+' of '+examCases.length+'</span><div class="chips">';
  if(c.difficulty) h += '<span class="badge b-amber">'+esc(cap(c.difficulty))+'</span>';
  if(c.category)   h += '<span class="badge b-slate">'+esc(c.category)+'</span>';
  h += '</div></div>';
  h += '<h2 style="margin:0 0 12px">'+esc(c.title)+'</h2><div class="vignette">';
  SECTION_KEYS.forEach((k, si) => {
    const txt = c.narrative && c.narrative[k];
    if(si > revealThrough || !txt) return;
    h += '<div class="seg"'+(withIds?' id="seg-'+si+'"':'')+'><div class="seg-label '+SECTION_CLS[si]+'">'+SECTION_LABELS[si]+'</div><div class="seg-text">'+esc(txt)+'</div></div>';
  });
  return h + '</div>';
}

function render(){
  const p = positions[cur];
  const c = examCases[p.ci];
  const ea = examAnswers[p.ci];
  const u = unitInfo();
  const isReview = view === 'review';

  // Furthest stop reached in this case: the narrative is revealed
  // cumulatively through that stop's section.
  let lastOfCase = p.si;
  while(lastOfCase+1 < stops.length && stops[lastOfCase+1].ci === p.ci) lastOfCase++;
  const narrStop = Math.min(positions[Math.max(maxReached, cur)].si, lastOfCase);
  const revealThrough = stops[narrStop].revealThrough;
  const isNewStop = narrStop === positions[maxReached].si;
  const narrChanged = !lastRender || lastRender.narrStop !== narrStop;
  const qChanged = !lastRender || lastRender.cur !== cur || lastRender.view !== view;

  // Narrow screens: collapse the case-info panel after the first question of
  // a section; expand it when a new section starts.
  if(qChanged && collapseArmed && collapseArmed.cur !== cur){
    infoOpen[collapseArmed.ci] = false;
    collapseArmed = null;
  }
  if(narrChanged && isNewStop){
    infoOpen[p.ci] = true;
    collapseArmed = { ci: p.ci, cur };
  }

  // Preserve pane scroll positions across re-renders of the same screen.
  const oldNarr = document.getElementById('narr-pane');
  const oldQ = document.getElementById('q-scroll');
  const narrScroll = oldNarr ? oldNarr.scrollTop : 0;
  const qScroll = oldQ ? oldQ.scrollTop : 0;

  let h = '<div class="exam-split">';

  // LEFT (≥1024px): narrative pane
  h += '<div class="card narr-pane" id="narr-pane">'+narrativeHtml(c, p.ci, revealThrough, true)+'</div>';

  // RIGHT: case info (<1024px) + question / review pane
  h += '<div class="q-col">';
  const open = !!infoOpen[p.ci];
  h += '<div class="card case-info">';
  h += '<button class="case-info-toggle" aria-expanded="'+open+'" onclick="toggleInfo('+p.ci+')">Case information <span>'+(open?'▴':'▾')+'</span></button>';
  if(open) h += '<div class="case-info-body">'+narrativeHtml(c, p.ci, revealThrough, false)+'</div>';
  h += '</div>';

  h += '<div class="card q-pane"><div class="q-scroll" id="q-scroll">';
  if(isReview){
    const n = unitCounts();
    const unitName = cfg.lockMode === 'section'
      ? 'Case '+(p.ci+1)+' · '+SECTION_LABELS[stops[p.si].sec]
      : (hasHalves() ? (halfOfStop(u.start) === 0 ? 'Cases 1–'+HALF_CASES : 'Cases '+(HALF_CASES+1)+'–'+examCases.length) : 'Cases 1–'+examCases.length);
    h += '<div class="seg-label" style="color:var(--slate-500)">'+(cfg.lockMode === 'section' ? 'Section Review' : 'Half Review')+'</div>';
    h += '<h2>'+esc(unitName)+'</h2>';
    h += '<p style="font-size:14px;color:var(--slate-400);margin:4px 0 14px">'+(n.total-n.unanswered)+' answered · '+n.unanswered+' unanswered · '+n.flagged+' flagged. Select a question to return to it.</p>';
    h += gridHtml(true, true);
    h += '<div class="row"><button class="btn" onclick="requestLock()">'+esc(lockLabel())+' ›</button>'
       + '<button class="btn secondary" onclick="backToQuestion()">‹ Back to question</button></div>';
  } else {
    const q = c.questions[p.qi];
    const ans = ea.questions[p.qi];
    const opts = q._opts || q.options;
    const struckSet = ea.struck[p.qi];
    h += '<div class="qstem" style="margin-top:0">'+esc(q.question)+'</div>';
    opts.forEach((o,idx) => {
      const sel = !!ans && ans.chosenId === o.id;
      const struck = struckSet.has(o.id);
      h += '<div class="opt-row'+(struck?' struck':'')+'">';
      h += '<button class="opt-strike'+(struck?' active':'')+'" title="Cross out this option" onclick="toggleStrikeQ(\''+esc(o.id)+'\')">✕</button>';
      h += '<button class="opt'+(sel?' selected':'')+'" aria-pressed="'+sel+'" onclick="chooseQ(\''+esc(o.id)+'\')">'
         + '<span class="key">'+LETTERS[idx]+'</span>'
         + '<span class="otext">'+esc(o.text)+'</span></button>';
      h += '</div>';
    });
    h += '<div class="ag-wrap"><div style="font-size:12px;color:var(--slate-500);margin-bottom:8px">Answer grid — tap to jump</div>'+gridHtml(false, false)+'</div>';
  }
  h += '</div>';

  if(!isReview){
    const flagged = !!ea.flags[p.qi];
    h += '<div class="q-bar">';
    h += '<button class="btn secondary sm" onclick="goBack()"'+(cur <= u.firstPos ? ' disabled' : '')+'>‹ Previous</button>';
    h += '<button class="flag-btn'+(flagged?' flagged':'')+'" onclick="toggleFlag()">'+(flagged ? '🚩 Flagged' : '⚑ Flag')+'</button>';
    h += '<button class="btn sm" onclick="goNext()">Next ›</button>';
    h += '</div>';
  }
  h += '</div></div></div>';

  timerBar.style.display = '';
  app.innerHTML = h;
  renderTimerBar();

  // Left pane keeps its scroll position within a section and jumps to the
  // newly revealed segment when a new section starts (top for a new case,
  // or when revisiting an earlier case). Right pane starts each question at the top.
  const narr = document.getElementById('narr-pane');
  if(narr){
    if(!narrChanged) narr.scrollTop = narrScroll;
    else {
      const firstNew = !isNewStop || stops[narrStop].firstOfCase ? 0 : stops[narrStop-1].revealThrough + 1;
      const el = document.getElementById('seg-'+firstNew);
      narr.scrollTop = firstNew === 0 || !el ? 0 : Math.max(0, el.offsetTop - 12);
    }
  }
  const qs = document.getElementById('q-scroll');
  if(qs) qs.scrollTop = qChanged ? 0 : qScroll;
  if(qChanged) window.scrollTo(0, 0);

  lastRender = { cur, view, narrStop };
}

// ---- render: results ----
function renderResults(){
  const domLabels = spec === '2027'
    ? {profdev:'Professional Development & Practice',assess:'Assessment & Diagnosis',planning:'Treatment Planning',interventions:'Counseling Interventions',indirect:'Indirect Client Services',legal:'Legal, Ethical & Professional Standards'}
    : {counseling:'Counseling / Interventions',intake:'Assessment / Intake',treatment:'Treatment Planning',ethics:'Professional Ethics',core:'Core Attributes'};
  const domOrder  = spec === '2027'
    ? ['assess','interventions','legal','planning','profdev','indirect']
    : ['counseling','intake','treatment','ethics','core'];

  const allDomains = {};
  let totalCorrect = 0, totalQs = 0;

  const caseResults = examCases.map((c, ci) => {
    const ea = examAnswers[ci];
    const domains = {};
    let correct = 0;
    c.questions.forEach((q, qi) => {
      const a = ea.questions[qi];
      const chosen = a && q.options.find(o => o.id === a.chosenId);
      const isOk = !!(chosen && chosen.isCorrect);
      if(isOk) correct++;
      const d = q.domain || 'general';
      if(!domains[d]) domains[d] = {ok:0, total:0};
      domains[d].total++;
      if(isOk) domains[d].ok++;
      if(!allDomains[d]) allDomains[d] = {ok:0, total:0};
      allDomains[d].total++;
      if(isOk) allDomains[d].ok++;
    });
    totalCorrect += correct;
    totalQs += c.questions.length;
    const pct = Math.round(correct / c.questions.length * 100);
    return {c, ea, correct, total:c.questions.length, pct, pass:pct>=70, domains};
  });

  const overallPct  = totalQs ? Math.round(totalCorrect/totalQs*100) : 0;
  const overallPass = overallPct >= 70;
  const mUsed = Math.floor(examSecsUsed/60), sUsed = examSecsUsed%60;

  let h = '<a href="/" class="back">‹ Dashboard</a>';
  h += '<h1>Exam Results</h1>';

  // Overall score card
  h += '<div class="score-card '+(overallPass?'pass':'fail')+'">';
  h += '<div class="score-icon">'+(overallPass?'🏆':'📈')+'</div>';
  h += '<div class="score-big">'+overallPct+'%</div>';
  h += '<div class="score-sub">'+totalCorrect+' of '+totalQs+' correct ('+overallPct+'%) · '+(overallPass?'PASS ✓':'NOT YET — aim for 70%')+'</div>';
  h += '<div style="font-size:13px;color:var(--slate-400);margin-top:6px">Time used: '+mUsed+'m '+sUsed+'s of '+cfg.minutes+'m</div>';
  if(spec === '2027'){
    h += '<div style="font-size:13px;color:var(--slate-400);margin-top:10px">The 2027 NCMHCE reports a scaled score (100–500, passing = 360) that can\'t be calculated from a practice raw score.</div>';
  }
  h += '</div>';

  // Domain breakdown
  h += '<div class="card" style="margin-top:14px"><h2>Domain Breakdown</h2>';
  const allDomKeys = [...new Set([...domOrder, ...Object.keys(allDomains)])];
  allDomKeys.forEach(d => {
    const v = allDomains[d];
    if(!v || !v.total) return;
    const pct = Math.round(v.ok/v.total*100);
    const barColor = pct>=70?'var(--emerald)':pct>=50?'var(--amber)':'var(--red)';
    const scoreColor = pct>=70?'var(--emerald-400)':pct>=50?'var(--amber-400)':'var(--red-400)';
    h += '<div class="dom-bar-wrap">';
    h += '<div class="dom-bar-label"><span>'+esc(domLabels[d]||cap(d))+'</span><span style="color:'+scoreColor+'">'+v.ok+'/'+v.total+' ('+pct+'%)</span></div>';
    h += '<div class="dom-bar"><i style="width:'+pct+'%;background:'+barColor+'"></i></div>';
    h += '</div>';
  });
  h += '</div>';

  // Per-case table
  h += '<div class="card" style="margin-top:14px"><h2>Case Summary</h2>';
  caseResults.forEach((r, i) => {
    h += '<div class="case-row">';
    h += '<div class="cr-title"><div class="cr-cat">Case '+(i+1)+(r.c.category?' · '+esc(r.c.category):'')+'</div>'+esc(r.c.title)+'</div>';
    h += '<div style="text-align:right"><div class="cr-pct">'+r.pct+'%</div><div style="font-size:12px;color:var(--slate-500)">'+r.correct+'/'+r.total+'</div></div>';
    h += '<div><span class="cr-pf '+(r.pass?'cr-pass':'cr-fail')+'">'+(r.pass?'PASS':'FAIL')+'</span></div>';
    h += '</div>';
  });
  h += '</div>';

  // Action buttons
  h += '<div class="row">';
  h += '<button class="btn" id="review-toggle-btn" onclick="toggleReview()">Review Answers ›</button>';
  h += '<a href="/" class="btn secondary">Dashboard</a>';
  h += '<button class="btn secondary" onclick="startNewExam()">New Exam</button>';
  h += '</div>';

  // Guarantee score-report link — tier is not knowable here without a fetch
  // (prp_user is a login-time snapshot), so show to all signed-in users.
  let signedIn = false;
  try { signedIn = !!localStorage.getItem('prp_token'); } catch(_){}
  if(signedIn){
    h += '<p style="font-size:13.5px;color:var(--slate-400);margin-top:14px">On the Guarantee plan? <a href="/score-report.html">Submit your score report →</a></p>';
  }

  // Review section (hidden until toggled)
  h += '<div id="review-section" style="display:none;margin-top:20px">';
  h += buildReview(caseResults);
  h += '</div>';

  app.innerHTML = h;
  window.scrollTo({top:0, behavior:'smooth'});
}

let reviewOpen = false;
function toggleReview(){
  reviewOpen = !reviewOpen;
  const el = document.getElementById('review-section');
  const btn = document.getElementById('review-toggle-btn');
  if(el) el.style.display = reviewOpen ? 'block' : 'none';
  if(btn) btn.textContent = reviewOpen ? 'Hide Review' : 'Review Answers ›';
  if(reviewOpen && el) el.scrollIntoView({behavior:'smooth'});
}

function buildReview(caseResults){
  let h = '<h2>Answer Review</h2>';
  caseResults.forEach((r, ci) => {
    const scoreColor = r.pass ? 'var(--emerald-400)' : 'var(--red-400)';
    h += '<div class="review-case">';
    h += '<div class="review-hd"><span>Case '+(ci+1)+': '+esc(r.c.title)+'</span>'
       + '<span style="color:'+scoreColor+'">'+r.pct+'% '+(r.pass?'PASS':'FAIL')+'</span></div>';

    r.c.questions.forEach((q, qi) => {
      const a = r.ea.questions[qi];
      const opts = q._opts || q.options;
      const chosenId = a && a.chosenId;
      const flagged = r.ea.flags[qi];
      const chosenOpt = opts.find(o => o.id === chosenId);
      const correctOpt = opts.find(o => o.isCorrect);
      const ok = !!(chosenOpt && chosenOpt.isCorrect);
      const ex = ok ? (chosenOpt&&chosenOpt.explanation) : (correctOpt&&correctOpt.explanation);

      h += '<div class="review-q">';
      h += '<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'✓ Correct':'✗ Incorrect')+'</div>';
      h += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">';
      if(q.domain) h += '<span class="badge b-blue">'+esc(q.domain)+'</span>';
      if(flagged)  h += '<span class="badge b-amber">Flagged</span>';
      h += '</div>';
      h += '<div style="font-size:12px;color:var(--slate-500);margin-bottom:2px">Q'+(qi+1)+'</div>';
      h += '<div class="qstem" style="font-size:15px">'+esc(q.question)+'</div>';

      opts.forEach((o,idx) => {
        let cls='opt', mark='';
        if(o.isCorrect){ cls+=' correct'; mark='<span class="mark">✓</span>'; }
        else if(o.id===chosenId){ cls+=' incorrect'; mark='<span class="mark">✗</span>'; }
        else cls+=' dim';
        h += '<button class="'+cls+'" disabled>'
           + '<span class="key">'+LETTERS[idx]+'</span>'
           + '<span class="otext">'+esc(o.text)+'</span>'+mark+'</button>';
      });

      if(!ok && chosenOpt && chosenOpt.rationale){
        h += '<div class="fb-block"><div class="fb-label">Why your choice misleads</div>'+esc(chosenOpt.rationale)+'</div>';
      }
      if(!ok && correctOpt){
        h += '<div class="fb-block"><div class="fb-label">Correct answer</div><strong>'+esc(correctOpt.text)+'</strong></div>';
      }
      if(ex && ex.rationale){
        h += '<div class="fb-block"><div class="fb-label">Why</div>'+esc(ex.rationale)+'</div>';
      }
      if(ex && ex.commonMistake){
        h += '<div class="fb-block" style="background:rgba(239,68,68,.08);border-left:3px solid var(--red);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:10px">'
           + '<div class="fb-label" style="color:var(--red-400)">Common mistake</div>'+esc(ex.commonMistake)+'</div>';
      }
      h += '</div>';
    });

    h += '</div>';
  });
  return h;
}

// ---- new exam ----
function startNewExam(){
  if(!confirm('Start a new exam? This will replace the current results.')) return;
  submitted = false; reviewOpen = false;
  init();
}

// ---- init ----
async function init(){
  timerBar.style.display = 'none';
  document.body.classList.remove('exam-active');
  stopTimer();
  submitted = false;
  renderLoading('Loading case catalog…');
  try{
    spec = await fetchSpec();
    cfg = examConfig[spec] || examConfig.current;
    const catalog = await fetchCatalog();
    if(!EXAM_ACCESS.includes(catalog.accessLevel)){ renderGate(catalog.accessLevel || 'free'); return; }
    const items = catalog.items || [];
    if(!items.length) throw new Error('No cases available in the catalog.');
    const selected = weightedSelectItems(items, cfg.size);
    if(!selected.length) throw new Error('Could not match any cases to the NCMHCE blueprint. Check that cases have category fields.');
    renderLoading('Loading '+selected.length+' cases…');
    const cases = (await Promise.all(selected.map(it => fetchCase(it.externalId))))
      .filter(c => c && Array.isArray(c.questions) && c.questions.length);
    if(!cases.length) throw new Error('No playable cases were returned.');
    // The mock exam has no separate Diagnosis step; diagnosis items already in
    // q[] are answered as regular A–D questions.
    cases.forEach(c => {
      c.questions.forEach(q => { q._opts = shuffle(q.options.slice()); });
    });
    examCases = cases;
    examAnswers = cases.map(c => ({
      questions: new Array(c.questions.length).fill(null),
      struck: new Array(c.questions.length).fill(null).map(() => new Set()),
      flags: new Array(c.questions.length).fill(false),
    }));
    stops = buildStops(cases);
    positions = [];
    stops.forEach((st, si) => st.qis.forEach(qi => positions.push({ si, ci: st.ci, qi })));
    renderStart(cases.length);
  } catch(e){
    app.innerHTML = '<div class="card">'
      + '<h2 style="color:var(--red-400)">Could not assemble exam</h2>'
      + '<p class="lead">'+esc(e.message)+'</p>'
      + '<p style="font-size:13px;color:var(--slate-500)">Make sure cases are published with category fields that match the NCMHCE blueprint.</p>'
      + '<a href="/" class="btn secondary" style="margin-top:8px">Back to Dashboard</a>'
      + '</div>';
  }
}

init();
</script>
