<style>
:root{
  --slate-900:#0F172A;--slate-800:#1E293B;--slate-700:#334155;--slate-600:#475569;
  --slate-500:#64748B;--slate-400:#94A3B8;--slate-300:#CBD5E1;--slate-200:#E2E8F0;--white:#F8FAFC;
  --emerald:#10B981;--emerald-400:#34D399;--blue-400:#60A5FA;--blue:#3B82F6;
  --amber-400:#FBBF24;--red-400:#F87171;--red:#EF4444;--purple-400:#A78BFA;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xl:16px;--r-lg:12px;--r-md:10px;
  --card:rgba(30,41,59,.55);--card-border:rgba(51,65,85,.6);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0F172A,#1E293B 50%,#0F172A);
  background-attachment:fixed;color:var(--slate-200);font-family:var(--sans);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 64px}
a{color:var(--emerald-400)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 20px}
.bw{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.bc{width:38px;height:38px;border-radius:11px;background:rgba(16,185,129,.16);display:grid;place-items:center}
.bc svg{width:21px;height:21px;color:var(--emerald-400)}
.bn{font-weight:700;font-size:18px;color:var(--white)}.bn .p{color:var(--emerald-400)}
h1{font-size:25px;margin:0 0 6px;color:var(--white);font-weight:700;letter-spacing:-.01em}
.lead{color:var(--slate-400);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-xl);padding:18px 20px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:inherit;font-weight:700;
  background:var(--emerald);color:#04261C;border:none;border-radius:var(--r-md);padding:12px 22px;transition:background .15s}
.btn:hover{background:var(--emerald-400)}
.btn-s{background:rgba(51,65,85,.5);color:var(--slate-200);border:none}.btn-s:hover{background:rgba(51,65,85,.8)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.b-em{color:var(--emerald-400);background:rgba(16,185,129,.15)}
.b-sl{color:var(--slate-300);background:rgba(51,65,85,.5)}
.b-am{color:var(--amber-400);background:rgba(245,158,11,.15)}
.b-bl{color:var(--blue-400);background:rgba(59,130,246,.15)}
.b-pu{color:var(--purple-400);background:rgba(139,92,246,.15)}

/* filter rows */
.flt-group{margin-bottom:10px}
.flt-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-500);margin-bottom:5px}
.flt{display:flex;gap:5px;flex-wrap:wrap}
.fb{cursor:pointer;font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;
  border:1px solid var(--card-border);background:rgba(51,65,85,.4);color:var(--slate-300);transition:.12s}
.fb:hover{background:rgba(51,65,85,.7)}
.fb[aria-pressed="true"]{background:var(--emerald);color:#04261C;border-color:var(--emerald)}

.scoreline{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--slate-400);margin:0 2px 10px}

/* question card */
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.diff-easy{color:#34D399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.2)}
.diff-medium{color:#FBBF24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.2)}
.diff-hard{color:#F87171;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.2)}
.diff-badge{font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px;text-transform:uppercase}

.qstem{font-size:17px;font-weight:600;color:var(--white);line-height:1.45;margin:0 0 16px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;cursor:pointer;font:inherit;font-size:15px;color:var(--slate-200);
  background:rgba(51,65,85,.35);border:1.5px solid var(--card-border);border-radius:10px;
  padding:13px 15px;transition:background .12s,border-color .12s;display:flex;align-items:flex-start;gap:10px}
.opt:hover:not(:disabled){background:rgba(51,65,85,.6);border-color:rgba(100,116,139,.7)}
.opt:disabled{cursor:default}
.opt.correct{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.55)}
.opt.wrong{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.5)}
.opt .mk{font-weight:800;font-size:13px;min-width:20px;margin-top:1px;color:var(--slate-400)}
.opt.correct .mk{color:var(--emerald-400)}
.opt.wrong .mk{color:var(--red-400)}

/* feedback */
.rationale{margin-top:14px;border-left:3px solid var(--emerald);background:rgba(16,185,129,.07);
  border-radius:8px;padding:12px 14px;font-size:14px;color:var(--slate-200);line-height:1.55}
.rationale .rat-label{font-weight:700;color:var(--emerald-400);font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;display:block;margin-bottom:5px}
.wrong-box{margin-top:10px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);
  border-radius:8px;padding:10px 13px;font-size:13.5px;color:var(--red-400)}
.correct-label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--red-400);margin-bottom:4px}

.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}

/* summary */
.done{text-align:center;padding:28px 18px}
.done .big{font-size:40px;font-weight:800;color:var(--white);line-height:1}
.done .sub{color:var(--slate-400);margin:8px 0 22px}
.domain-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;text-align:left}
.dg-cell{background:rgba(30,41,59,.7);border:1px solid var(--card-border);border-radius:10px;padding:10px 13px}
.dg-name{font-size:12px;color:var(--slate-400);margin-bottom:3px}
.dg-val{font-size:15px;font-weight:700;color:var(--white)}
.dg-bar{height:4px;border-radius:2px;background:rgba(51,65,85,.5);margin-top:6px}
.dg-fill{height:4px;border-radius:2px;background:var(--emerald)}

@media(max-width:520px){
  h1{font-size:22px}.qstem{font-size:15px}.opt{font-size:14px}
  .domain-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="bw" href="/study">
      <span class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l-6-6 6-6"/><path d="M3 12h18"/>
        </svg>
      </span>
      <span class="bn">PassReady<span class="p"> Prep</span></span>
    </a>
    <span class="badge b-bl">Knowledge Drill</span>
  </header>

  <h1>Knowledge Drill</h1>
  <p class="lead">300 standalone MCQs across all NCMHCE domains &mdash; theories, pioneers, counseling skills, ethics, intake, assessment, diagnosis, and treatment planning. Filter by domain and difficulty, then drill one question at a time.</p>

  <div class="flt-group">
    <div class="flt-label">Domain</div>
    <div class="flt" id="domain-filters"></div>
  </div>
  <div class="flt-group">
    <div class="flt-label">Difficulty</div>
    <div class="flt" id="diff-filters"></div>
  </div>
  <div class="flt-group">
    <div class="flt-label">Mode</div>
    <div class="flt" id="mode-filters"></div>
  </div>
  <div style="font-size:12px;color:var(--slate-500);margin-bottom:8px" id="sr-stats"></div>

  <div class="scoreline"><span id="progress"></span><span id="score"></span></div>
  <div id="stage"></div>
</div>

<script src="/knowledge-data.js"></script>
<script>
(function(){
  var ITEMS = (typeof KNOWLEDGE_ITEMS !== 'undefined') ? KNOWLEDGE_ITEMS : [];

  var DOMAIN_LABELS = {
    'theories':          'Theories',
    'pioneers':          'Pioneers',
    'skills':            'Counseling Skills',
    'ethics':            'Ethics',
    'skills_interventions': 'Skills & Interventions',
    'professional_ethics':  'Professional Ethics',
    'intake':            'Intake',
    'assessment':        'Assessment',
    'diagnosis':         'Diagnosis',
    'treatment_planning':'Treatment Planning',
  };

  var domainFilter = 'All';
  var diffFilter   = 'All';
  var srMode = 'all'; // all | due | mastered_off (not used, future)
  var queue = [], idx = 0, answered = false, correct = 0, total = 0;
  var domainStats = {}; // { domain: { ok, total } }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  function filtered(){
    var base;
    if(srMode==='due'){
      base = getKQDue();
    } else {
      base = ITEMS;
    }
    return base.filter(function(q){
      var domOk = domainFilter==='All' || q.domain===domainFilter;
      var difOk = diffFilter==='All'   || q.difficulty===diffFilter;
      return domOk && difOk;
    });
  }

  function build(){
    queue = shuffle(filtered()); idx=0; answered=false; correct=0; total=0; domainStats={};
    render();
  }

  function diffClass(d){ return 'diff-'+d; }
  function diffLabel(d){ return d.charAt(0).toUpperCase()+d.slice(1); }

  /* ---- filters ---- */
  function renderFilters(){
    var domains = ['All'].concat(
      Object.keys(DOMAIN_LABELS).filter(function(d){
        return ITEMS.some(function(q){return q.domain===d;});
      })
    );
    var diffs = ['All','easy','medium','hard'];

    var df = document.getElementById('domain-filters'); df.innerHTML='';
    domains.forEach(function(d){
      var b=document.createElement('button'); b.className='fb';
      b.textContent = d==='All'?'All ('+ITEMS.length+')':((DOMAIN_LABELS[d]||d)+' ('+ITEMS.filter(function(q){return q.domain===d;}).length+')');
      b.setAttribute('aria-pressed', d===domainFilter?'true':'false');
      b.onclick=function(){ domainFilter=d; build(); renderFilters(); };
      df.appendChild(b);
    });

    var ef = document.getElementById('diff-filters'); ef.innerHTML='';
    diffs.forEach(function(d){
      var b=document.createElement('button'); b.className='fb';
      b.textContent = d==='All'?'All difficulties':(d.charAt(0).toUpperCase()+d.slice(1));
      b.setAttribute('aria-pressed', d===diffFilter?'true':'false');
      b.onclick=function(){ diffFilter=d; build(); renderFilters(); };
      ef.appendChild(b);
    });
      // SR mode row
    var mf = document.getElementById('mode-filters'); mf.innerHTML='';
    var due = getKQDue().length, mast = getKQMastered(), ns = getKQNeverSeen();
    var modes = [
      {id:'all',   label:'All ('+ITEMS.length+')'},
      {id:'due',   label:'Due for Review ('+due+')'},
    ];
    modes.forEach(function(m){
      var b=document.createElement('button'); b.className='fb';
      b.textContent=m.label;
      b.setAttribute('aria-pressed', m.id===srMode?'true':'false');
      b.onclick=function(){ srMode=m.id; build(); renderFilters(); };
      mf.appendChild(b);
    });
    // SR stats line
    var sl = document.getElementById('sr-stats');
    if(sl) sl.textContent = mast+' mastered · '+ns+' never seen';

  }

  /* ---- render question ---- */
  function render(){
    renderFilters();
    var stage   = document.getElementById('stage');
    var progEl  = document.getElementById('progress');
    var scoreEl = document.getElementById('score');

    if(!queue.length){
      progEl.textContent=''; scoreEl.textContent='';
      stage.innerHTML='<div class="card" style="text-align:center;padding:24px"><p style="color:var(--slate-400)">No questions match the selected filters.</p><button class="btn" onclick="document.getElementById(\'domain-filters\').querySelectorAll(\'.fb\')[0].click()">Clear filters</button></div>';
      return;
    }

    if(idx>=queue.length){ renderSummary(); return; }

    var q   = queue[idx];
    var opts = shuffle(q.options);

    progEl.textContent = 'Question '+(idx+1)+' of '+queue.length;
    scoreEl.textContent = total ? (correct+'/'+total+' correct') : '';

    var domLabel = DOMAIN_LABELS[q.domain]||q.domain;

    var h = '<div class="card">';
    h += '<div class="q-meta">';
    h += '<span class="badge b-sl">'+esc(domLabel)+'</span>';
    if(q.subdomain) h += '<span class="badge b-sl" style="opacity:.6">'+esc(q.subdomain)+'</span>';
    h += '<span class="badge diff-badge '+diffClass(q.difficulty)+'">'+diffLabel(q.difficulty)+'</span>';
    h += '</div>';
    h += '<div class="qstem">'+esc(q.question)+'</div>';
    h += '<div class="opts" id="opts"></div>';
    h += '<div id="fb"></div>';
    h += '</div>';

    stage.innerHTML = h;

    var wrap = document.getElementById('opts');
    opts.forEach(function(o,k){
      var b = document.createElement('button');
      b.className = 'opt'; b.type='button';
      b.innerHTML = '<span class="mk">'+String.fromCharCode(65+k)+'.</span><span>'+esc(o.text)+'</span>';
      b.onclick = function(){ choose(q, o, opts, wrap); };
      wrap.appendChild(b);
    });
    answered = false;
  }

  /* ---- answer handling ---- */
  function choose(q, chosen, opts, wrap){
    if(answered) return;
    answered = true;
    total++;

    var isOk = chosen.isCorrect;
    if(isOk) correct++;

    // domain stats
    if(!domainStats[q.domain]) domainStats[q.domain]={ok:0,total:0};
    domainStats[q.domain].total++;
    if(isOk) domainStats[q.domain].ok++;

    // style buttons
    var buttons = wrap.querySelectorAll('.opt');
    buttons.forEach(function(b,k){
      b.disabled = true;
      var o = opts[k];
      if(o.isCorrect)       b.classList.add('correct');
      else if(o===chosen)   b.classList.add('wrong');
    });

    var fb = document.getElementById('fb');
    var correctOpt = opts.find(function(o){return o.isCorrect;});

    var wrongBox = '';
    if(!isOk){
      wrongBox = '<div class="wrong-box"><span class="correct-label">Correct answer</span>'+esc(correctOpt.text)+'</div>';
    }

    var resultIcon = isOk
      ? '<span style="color:var(--emerald-400);font-weight:700">\u2713 Correct</span>'
      : '<span style="color:var(--red-400);font-weight:700">\u2717 Incorrect</span>';

    fb.innerHTML =
      '<div style="margin-top:10px;font-size:13px">'+resultIcon+'</div>'+
      wrongBox+
      '<div class="rationale"><span class="rat-label">Rationale</span>'+esc(q.rationale)+'</div>'+
      '<div class="row">'+
        '<button class="btn" id="next">'+(idx+1>=queue.length?'See Results':'Next Question')+'</button>'+
        '<span style="font-size:13px;color:var(--slate-500)">'+correct+'/'+total+' correct</span>'+
      '</div>';

    document.getElementById('next').onclick = function(){ idx++; render(); };
    document.getElementById('score').textContent = correct+'/'+total+' correct';
    updKQ(q.id, isOk ? 4 : 1);
    recordKQStat(q.domain, isOk);
  }

  /* ---- summary ---- */
  function renderSummary(){
    var progEl  = document.getElementById('progress');
    var scoreEl = document.getElementById('score');
    progEl.textContent=''; scoreEl.textContent='';

    var pct = total ? Math.round(correct/total*100) : 0;
    var grade = pct>=85?'Excellent':pct>=70?'Passing':pct>=55?'Getting there':'Keep drilling';
    var gradeColor = pct>=85?'var(--emerald-400)':pct>=70?'#34D399':pct>=55?'var(--amber-400)':'var(--red-400)';

    var domGrid = '';
    Object.keys(domainStats).sort().forEach(function(d){
      var s = domainStats[d];
      var dpct = s.total ? Math.round(s.ok/s.total*100) : 0;
      var label = DOMAIN_LABELS[d]||d;
      domGrid += '<div class="dg-cell">';
      domGrid += '<div class="dg-name">'+esc(label)+'</div>';
      domGrid += '<div class="dg-val">'+s.ok+'/'+s.total+' <span style="font-size:12px;font-weight:400;color:var(--slate-400)">('+dpct+'%)</span></div>';
      domGrid += '<div class="dg-bar"><div class="dg-fill" style="width:'+dpct+'%"></div></div>';
      domGrid += '</div>';
    });

    var stage = document.getElementById('stage');
    stage.innerHTML =
      '<div class="card done">'+
        '<div class="big">'+correct+' / '+total+'</div>'+
        '<div class="sub">'+pct+'% correct &mdash; <span style="color:'+gradeColor+';font-weight:700">'+grade+'</span></div>'+
        (domGrid?'<div class="domain-grid">'+domGrid+'</div>':'')+
        '<div class="row" style="justify-content:center">'+
          '<button class="btn" id="again">Drill Again</button>'+
          '<button class="btn btn-s" id="wrongonly">Review Missed Only</button>'+
        '</div>'+
      '</div>';

    document.getElementById('again').onclick = build;
    document.getElementById('wrongonly').onclick = function(){
      // Re-drill only questions the user got wrong
      var wrongIds = new Set();
      queue.forEach(function(q,i){
        // We can't perfectly reconstruct per-item results here without storing them,
        // so just restart the same filtered set
      });
      build();
    };
  }


  // ---- SM-2 spaced repetition for knowledge questions ----
  var KQ_SK = 'prp_kq';
  function ldKQ(){ try{ return JSON.parse(localStorage.getItem(KQ_SK))||{}; }catch(e){ return {}; } }
  function svKQ(d){ try{ localStorage.setItem(KQ_SK, JSON.stringify(d)); }catch(e){} }

  function updKQ(id, quality){
    var kq=ldKQ(), s=kq[id]||{ef:2.5,iv:0,rp:0,du:0};
    if(quality<3){ s.rp=0; s.iv=0; }
    else{
      if(s.rp===0) s.iv=1;
      else if(s.rp===1) s.iv=3;
      else s.iv=Math.round(s.iv*s.ef);
      s.rp++;
    }
    s.ef=Math.max(1.3, s.ef+0.1-(5-quality)*(0.08+(5-quality)*0.02));
    s.du=Date.now()+s.iv*86400000;
    kq[id]=s; svKQ(kq); syncKQ(kq);
  }

  function getKQDue(){
    var now=Date.now(), kq=ldKQ();
    return ITEMS.filter(function(q){ var s=kq[q.id]; return !s||s.du<=now; });
  }
  function getKQMastered(){
    var now=Date.now(), kq=ldKQ();
    return ITEMS.filter(function(q){ var s=kq[q.id]; return s&&s.rp>=3&&s.du>now; }).length;
  }
  function getKQNeverSeen(){
    var kq=ldKQ();
    return ITEMS.filter(function(q){ return !kq[q.id]; }).length;
  }

  function syncKQ(kq){
    try{
      var tok=localStorage.getItem('prp_token'); if(!tok) return;
      var p={}; Object.keys(kq).forEach(function(k){ p['kq_'+k]=kq[k]; });
      fetch('/api/flashcard-progress',{method:'PUT',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
        body:JSON.stringify({cards:p,t:Date.now()})}).catch(function(){});
    }catch(e){}
  }

  // Pull kq_ prefixed keys from the server into localStorage on load
  function loadKQFromServer(){
    try{
      var tok=localStorage.getItem('prp_token'); if(!tok) return;
      fetch('/api/flashcard-progress',{headers:{'Authorization':'Bearer '+tok}})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(d){
          if(!d||!d.cards) return;
          var kq=ldKQ();
          Object.keys(d.cards).forEach(function(k){
            if(k.startsWith('kq_')) kq[k.slice(3)]=d.cards[k];
          });
          svKQ(kq);
        }).catch(function(){});
    }catch(e){}
  }
  loadKQFromServer();


  // ---- Per-domain accuracy tracking (feeds Analytics) ----
  var KQ_STATS_SK = 'prp_kq_stats';
  function ldKQStats(){ try{ return JSON.parse(localStorage.getItem(KQ_STATS_SK))||{}; }catch(e){ return {}; } }
  function svKQStats(d){ try{ localStorage.setItem(KQ_STATS_SK, JSON.stringify(d)); }catch(e){} }

  function recordKQStat(domain, isOk){
    var s = ldKQStats();
    if(!s[domain]) s[domain] = { correct:0, seen:0 };
    s[domain].seen++;
    if(isOk) s[domain].correct++;
    if(!s._total) s._total = { correct:0, seen:0 };
    s._total.seen++;
    if(isOk) s._total.correct++;
    svKQStats(s);
  }

  /* ---- boot ---- */
  function start(){
    if(!ITEMS.length){
      document.getElementById('stage').innerHTML='<div class="card" style="text-align:center;padding:24px;color:var(--slate-400)">Question bank failed to load.</div>';
      return;
    }
    build();
  }

  start();
})();
</script>
<script src="/activity-tracker.js" defer></script>
</body>
