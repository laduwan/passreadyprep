<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NCE Practice Questions &amp; Timed Mock Exams | PassReady Prep</title>
<meta name="description" content="NCE practice questions and full-length timed mock exams weighted to NBCC's six NCE content domains, with your progress tracked by domain.">
<link rel="canonical" href="https://www.passreadyprep.com/nce.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PassReady Prep">
<meta property="og:title" content="NCE Practice Questions &amp; Timed Mock Exams | PassReady Prep">
<meta property="og:description" content="NCE practice questions and full-length timed mock exams weighted to NBCC's six NCE content domains, with your progress tracked by domain.">
<meta property="og:url" content="https://www.passreadyprep.com/nce.html">
<meta property="og:image" content="https://www.passreadyprep.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --slate-900:#0F172A;--slate-800:#1E293B;--slate-700:#334155;--slate-600:#475569;
  --slate-500:#64748B;--slate-400:#94A3B8;--slate-300:#CBD5E1;--slate-200:#E2E8F0;--white:#F8FAFC;
  --emerald:#10B981;--emerald-400:#34D399;--blue-400:#60A5FA;--blue:#3B82F6;
  --amber:#F59E0B;--amber-400:#FBBF24;--red:#EF4444;--red-400:#F87171;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xl:16px;--r-lg:12px;--r-md:10px;
  --card:rgba(30,41,59,.55);--card-border:rgba(51,65,85,.6);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0F172A,#1E293B 50%,#0F172A);
  background-attachment:fixed;color:var(--slate-200);font-family:var(--sans);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 80px}
a{color:var(--emerald-400)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 20px;flex-wrap:wrap}
.bw{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.bc{width:38px;height:38px;border-radius:11px;background:rgba(16,185,129,.16);display:grid;place-items:center}
.bc svg{width:21px;height:21px;color:var(--emerald-400)}
.bn{font-weight:700;font-size:18px;color:var(--white)}.bn .p{color:var(--emerald-400)}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0 0 6px;color:var(--white);font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 10px;color:var(--white)}
.lead{color:var(--slate-400);margin:0 0 16px}
.muted{color:var(--slate-400)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-xl);padding:18px 20px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:inherit;font-weight:700;
  background:var(--emerald);color:#04261C;border:none;border-radius:var(--r-md);padding:12px 22px;transition:background .15s;text-decoration:none}
.btn:hover{background:var(--emerald-400)}
.btn:disabled{opacity:.45;cursor:default}
.btn-s{background:rgba(51,65,85,.5);color:var(--slate-200)}.btn-s:hover{background:rgba(51,65,85,.8)}
.btn-sm{padding:8px 14px;font-size:14px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.b-blue{color:var(--blue-400);background:rgba(59,130,246,.15)}
.b-em{color:var(--emerald-400);background:rgba(16,185,129,.15)}
.b-am{color:var(--amber-400);background:rgba(245,158,11,.15)}
.banner{border-radius:var(--r-lg);padding:12px 16px;margin-bottom:14px;font-size:14.5px;border:1px solid}
.banner.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.3)}
.banner.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3)}
.banner.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3)}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:14px 16px}
.stat .n{font-size:26px;font-weight:800;color:var(--white);line-height:1.1}
.stat .l{font-size:12.5px;color:var(--slate-400);margin-top:2px}
.stat input{font:inherit;font-size:14px;background:rgba(15,23,42,.6);color:var(--white);border:1px solid var(--card-border);border-radius:8px;padding:6px 8px;width:100%;margin-top:4px;color-scheme:dark}

/* domain list */
.dom{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(51,65,85,.45)}
.dom:last-child{border-bottom:none}
.dom-name{font-weight:700;color:var(--white)}
.dom-sub{font-size:12.5px;color:var(--slate-400)}
.pct-bar{height:6px;border-radius:3px;background:rgba(51,65,85,.5);margin-top:6px}
.pct-fill{height:6px;border-radius:3px;background:var(--emerald)}
.pct-fill.mid{background:var(--amber)}.pct-fill.low{background:var(--red-400)}

/* mode chooser */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.choice{cursor:pointer;font:inherit;text-align:left;border-radius:var(--r-lg);padding:16px;border:2px solid var(--card-border);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;min-width:0;
  background:rgba(51,65,85,.3);color:var(--slate-300);transition:.15s}
.choice:hover{border-color:rgba(16,185,129,.4);color:var(--white)}
.choice.selected{border-color:var(--emerald);background:rgba(16,185,129,.12)}
.choice b{display:block;color:var(--white);font-size:17px}
.choice span{font-size:13px;color:var(--slate-400)}
.choice .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.choice .ico svg{width:21px;height:21px}
.ico.em{background:rgba(16,185,129,.16);color:var(--emerald-400)}
.ico.bl{background:rgba(59,130,246,.16);color:var(--blue-400)}
.ico.am{background:rgba(245,158,11,.16);color:var(--amber-400)}
.ico.vi{background:rgba(167,139,250,.16);color:#A78BFA}
a.choice{text-decoration:none}
@media(min-width:560px){.grid2.start{grid-template-columns:1fr 1fr}}
.choice.games{cursor:default;background:linear-gradient(140deg,rgba(245,158,11,.10),rgba(51,65,85,.3) 60%);border-color:rgba(245,158,11,.3)}
.choice.games:hover{border-color:rgba(245,158,11,.55)}
.game-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.game-links a{font-size:12.5px;font-weight:700;text-decoration:none;color:var(--amber-400);background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.35);border-radius:999px;padding:4px 10px}
.game-links a:hover{background:rgba(245,158,11,.22)}
.game-links a.all{color:var(--slate-200);background:rgba(51,65,85,.5);border-color:var(--card-border)}

/* dashboard hero */
.hero{position:relative;overflow:hidden;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:24px;
  border-radius:20px;border:1px solid rgba(16,185,129,.28);
  background:radial-gradient(120% 140% at 0% 0%,rgba(16,185,129,.22),transparent 55%),radial-gradient(90% 120% at 100% 100%,rgba(59,130,246,.18),transparent 60%),rgba(30,41,59,.7)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,211,153,.18),transparent 70%);pointer-events:none}
.ring{--p:0;--c:var(--emerald);flex:0 0 auto;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(51,65,85,.55) 0);animation:ring-in .9s ease-out both}
.ring > div{width:108px;height:108px;border-radius:50%;background:#162033;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring b{font-size:30px;font-weight:800;color:var(--white);line-height:1}
.ring span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-400);margin-top:4px}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
@keyframes ring-in{from{--p:0}}
.hero-body{flex:1 1 300px;min-width:0;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--emerald-400);margin-bottom:6px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald-400);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.hero h1{font-size:30px;margin:0 0 6px}
.hero .lead{margin:0 0 14px;color:var(--slate-300)}
.hero .lead b{color:var(--white)}
.trend{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:4px;vertical-align:1px}
.trend.up{color:var(--emerald-400);background:rgba(16,185,129,.15)}.trend.down{color:var(--red-400);background:rgba(239,68,68,.15)}.trend.flat{color:var(--slate-300);background:rgba(51,65,85,.6)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-fine{font-size:12.5px;color:var(--slate-400);margin:12px 0 0}
.hero details{margin-top:10px;font-size:12.5px;color:var(--slate-400)}
.hero summary{cursor:pointer;color:var(--slate-300);font-weight:600}
.hero details p{margin:6px 0 0}

/* stat tiles */
.stat{display:flex;gap:12px;align-items:flex-start}
.stat .si{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.stat .si svg{width:19px;height:19px}
.stat > div:last-child{min-width:0;flex:1}
.si.em{background:rgba(16,185,129,.16);color:var(--emerald-400)}.si.bl{background:rgba(59,130,246,.16);color:var(--blue-400)}
.si.vi{background:rgba(167,139,250,.16);color:#A78BFA}.si.am{background:rgba(245,158,11,.16);color:var(--amber-400)}

/* domain rows */
.dom.d{grid-template-columns:auto 1fr auto;cursor:pointer;border-radius:12px;padding:12px 10px;margin:0 -10px;border-bottom:none;transition:background .15s}
.dom.d:hover{background:rgba(51,65,85,.35)}
.dom.d + .dom.d{border-top:1px solid rgba(51,65,85,.45)}
.dnum{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.dom.d .pct-bar{height:8px;border-radius:4px}
.dom.d .pct-fill{height:8px;border-radius:4px;animation:grow .8s ease-out both}
@keyframes grow{from{width:0}}
.dright{display:flex;align-items:center;gap:10px}
.pill{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;min-width:52px;text-align:center;color:var(--emerald-400);background:rgba(16,185,129,.14)}
.pill.mid{color:var(--amber-400);background:rgba(245,158,11,.14)}.pill.low{color:var(--red-400);background:rgba(239,68,68,.14)}
.pill.none{color:var(--slate-400);background:rgba(51,65,85,.5);font-weight:700}
.weak-tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-400);margin-left:6px}
@media(max-width:520px){.hero{padding:18px}.ring{width:112px;height:112px}.ring > div{width:92px;height:92px}.ring b{font-size:25px}.hero h1{font-size:24px}.dom.d{grid-template-columns:auto 1fr}.dright{grid-column:2;justify-content:space-between}}
@media(prefers-reduced-motion:reduce){.ring,.dom.d .pct-fill{animation:none}}

/* study plan */
.plan-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.plan-days{font-size:13px;font-weight:800;color:var(--emerald-400);background:rgba(16,185,129,.14);border-radius:999px;padding:4px 11px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-top:1px solid rgba(51,65,85,.45)}
.phase:first-of-type{border-top:none}
.ph-n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px}
.ph-n.p1{background:rgba(59,130,246,.16);color:var(--blue-400)}.ph-n.p2{background:rgba(167,139,250,.16);color:#A78BFA}.ph-n.p3{background:rgba(16,185,129,.16);color:var(--emerald-400)}
.ph-t{font-weight:700;color:var(--white)}
.ph-when{font-size:12px;font-weight:700;color:var(--slate-400);margin-left:6px}
.ph-now{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#04261C;background:var(--emerald-400);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.ph-d{font-size:14px;color:var(--slate-300);margin-top:3px}
.ph-d b{color:var(--amber-400)}
.ph-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.targets{margin-top:6px;padding:12px 14px;border-radius:12px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);font-size:14px}
.targets strong{color:var(--emerald-400)}
.plan-date{font:inherit;font-size:14px;background:rgba(15,23,42,.6);color:var(--white);border:1px solid var(--card-border);border-radius:8px;padding:7px 9px;color-scheme:dark}

/* timer */
.timer-bar{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--card-border);padding:10px 16px;display:none}
.timer-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer-display{font-size:22px;font-weight:800;color:var(--white);font-variant-numeric:tabular-nums}
.timer-display.warn{color:var(--amber-400)}.timer-display.danger{color:var(--red-400)}
.timer-prog{font-size:13px;color:var(--slate-400);text-align:right;line-height:1.4}
.timer-prog strong{color:var(--white);display:block}

/* navigator */
.nav-grid{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0;max-height:180px;overflow:auto}
.ag-cell{cursor:pointer;width:34px;height:34px;border-radius:7px;font-size:12px;font-weight:700;display:grid;place-items:center;
  border:1.5px solid var(--card-border);background:rgba(51,65,85,.3);color:var(--slate-400)}
.ag-cell.current{border-color:var(--blue-400);color:var(--blue-400)}
.ag-cell.answered{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);color:var(--emerald-400)}
.ag-cell.flagged{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.5);color:var(--amber-400)}

/* question */
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.q-num{font-size:12px;font-weight:700;color:var(--slate-500);letter-spacing:.04em;text-transform:uppercase}
.qstem{font-size:17px;font-weight:600;color:var(--white);line-height:1.45;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;cursor:pointer;font:inherit;font-size:15px;color:var(--slate-200);background:rgba(51,65,85,.35);
  border:1.5px solid var(--card-border);border-radius:10px;padding:13px 15px;display:flex;align-items:flex-start;gap:10px}
.opt:hover:not(:disabled){background:rgba(51,65,85,.6)}
.opt:disabled{cursor:default}
.opt .mk{font-weight:800;font-size:13px;min-width:20px;margin-top:1px;color:var(--slate-400)}
.opt.selected{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.55)}
.opts > div > .opt{width:100%}
.opt .tag{margin-left:auto;align-self:center;flex-shrink:0;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.opt.correct{background:rgba(16,185,129,.2);border:2px solid var(--emerald);color:var(--white);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.opt.correct .mk{color:var(--emerald-400)}
.opt.correct .tag{background:var(--emerald);color:#04261C}
.opt.wrong{background:rgba(239,68,68,.18);border:2px solid var(--red);color:var(--white);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.opt.wrong .mk{color:var(--red-400)}
.opt.wrong .tag{background:var(--red);color:#fff}
.opt.dim{opacity:.5}
.opt-why{font-size:13px;color:var(--slate-400);margin:6px 0 2px 32px;padding-left:10px;border-left:2px solid var(--card-border)}
.opt-why.ok{color:var(--emerald-400);border-left-color:var(--emerald)}
.opt-why.bad{color:var(--red-400);border-left-color:var(--red)}
.verdict{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:11px 14px;border-radius:10px;font-weight:700;font-size:15px}
.verdict .vi{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.verdict.ok{background:rgba(16,185,129,.16);border:1.5px solid var(--emerald);color:var(--emerald-400)}
.verdict.ok .vi{background:var(--emerald);color:#04261C}
.verdict.bad{background:rgba(239,68,68,.14);border:1.5px solid var(--red);color:var(--red-400)}
.verdict.bad .vi{background:var(--red);color:#fff}
.rationale.bad{border-left-color:var(--red);background:rgba(239,68,68,.06)}
.rationale.bad .rat-label{color:var(--red-400)}
.rationale{margin-top:12px;border-left:3px solid var(--emerald);background:rgba(16,185,129,.07);border-radius:0 8px 8px 0;
  padding:10px 13px;font-size:13.5px;line-height:1.55}
.rat-label{font-weight:700;color:var(--emerald-400);font-size:11px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:4px}
.nav-row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.flag-btn{background:none;border:1.5px solid var(--card-border);border-radius:var(--r-md);cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--slate-400);padding:8px 14px}
.flag-btn.flagged{border-color:var(--amber);color:var(--amber-400)}

/* results */
.score-card{text-align:center;border-radius:var(--r-xl);padding:24px 20px;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.07);margin-bottom:14px}
.score-big{font-size:44px;font-weight:800;color:var(--white);line-height:1}
.domain-table{width:100%;border-collapse:collapse;font-size:14px}
.domain-table th{text-align:left;color:var(--slate-400);font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--card-border)}
.domain-table td{padding:8px;border-bottom:1px solid rgba(51,65,85,.4)}
.domain-table td:last-child{text-align:right;font-weight:700}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plan{background:rgba(15,23,42,.45);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column}
.plan.best{border-color:rgba(16,185,129,.55);background:rgba(16,185,129,.06)}
.plan .pn{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--slate-400)}
.plan .pp{font-size:32px;font-weight:800;color:var(--white);margin:6px 0 2px}
.plan .pp small{font-size:14px;color:var(--slate-400);font-weight:600}
.plan ul{list-style:none;padding:0;margin:10px 0 16px;font-size:13.5px;flex:1}
.plan li{margin-bottom:5px}.plan li::before{content:"✓ ";color:var(--emerald-400);font-weight:700}
.hidden{display:none!important}
@media(max-width:520px){h1{font-size:21px}.qstem{font-size:15px}.opt{font-size:14px}.timer-display{font-size:18px}}
</style>
</head>
<body>

<div class="timer-bar" id="timer-bar" role="timer" aria-live="off">
  <div class="timer-inner">
    <div><div class="timer-display" id="timer-display">00:00</div><div class="muted small">remaining</div></div>
    <div class="timer-prog" id="timer-prog"></div>
    <button class="btn btn-s btn-sm" id="timer-exit" type="button">Exit</button>
  </div>
</div>

<div class="wrap">
  <header>
    <a class="bw" href="/study">
      <span class="bc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6-6 6-6"/><path d="M3 12h18"/></svg></span>
      <span class="bn">PassReady<span class="p"> Prep</span></span>
    </a>
    <div class="hdr-r">
      <span class="badge b-blue">NCE</span>
      <a class="btn btn-s btn-sm" href="/study">NCMHCE study</a>
      <a class="btn btn-s btn-sm" id="signin-link" href="/register.html?tab=login&next=/nce.html">Sign in</a>
    </div>
  </header>

  <div id="stage"></div>
</div>

<script>
(function(){
  var TOKEN = null;
  try { TOKEN = localStorage.getItem('prp_token'); } catch(e) {}

  var BP = null, STATUS = null, PROGRESS = null;
  var DOM = {}; // key -> domain meta

  // Shown on the page; the charge itself is the Stripe price behind each tier.
  var PLANS = [
    { tier:'nce_monthly', name:'Monthly', price:'$24.99', per:'/month', note:'Cancel anytime',
      features:['Full NCE question bank','Unlimited timed mock exams','Progress by NCE domain'] },
    { tier:'nce_pass3', name:'3-Month Pass', price:'$59', per:'one-time', note:'Most popular', best:true,
      features:['Everything in Monthly','90 days of access','No renewal to cancel'] },
    { tier:'nce_pass6', name:'6-Month Pass', price:'$89', per:'one-time', note:'Best value',
      features:['Everything in Monthly','180 days of access','Room for a retake'] },
    // Shown only once the server reports a Stripe price for it (see LIVE below).
    { tier:'nce_guarantee', name:'Pass Guarantee', price:'', per:'one-time', note:'Pass guaranteed', liveOnly:true,
      features:['Everything in Monthly','Access until you pass','Free CE course on CounselorReady when you pass'] },
  ];
  // Live prices from Stripe via /api/payment/plans, keyed by tier. When the
  // lookup fails the plans above show their listed prices and the guarantee
  // stays hidden.
  var LIVE = {};
  function money(cents){ return '$' + (cents / 100).toFixed(cents % 100 ? 2 : 0); }

  var stage = document.getElementById('stage');
  var timerBar = document.getElementById('timer-bar');
  var timerDisplay = document.getElementById('timer-display');
  var timerProg = document.getElementById('timer-prog');
  var timerIv = null, timerSecs = 0;

  if (TOKEN) document.getElementById('signin-link').classList.add('hidden');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function pct(c,t){ return t ? Math.round(100*c/t) : null; }
  function fillCls(p){ return p==null ? '' : p>=70 ? '' : p>=55 ? 'mid' : 'low'; }
  function fmt(s){ var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {});
    if (TOKEN) opts.headers.Authorization = 'Bearer ' + TOKEN;
    if (opts.body && typeof opts.body !== 'string'){ opts.headers['content-type']='application/json'; opts.body=JSON.stringify(opts.body); }
    return fetch(path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (r.status === 401 && j.code === 'SESSION_INVALIDATED') {
          try { localStorage.removeItem('prp_token'); } catch(e) {}
          location.href = '/register.html?next=/nce.html';
        }
        if (!r.ok){ var e=new Error(j.message || j.error || ('Request failed ('+r.status+')')); e.status=r.status; e.body=j; throw e; }
        return j;
      });
    });
  }

  // ── Dashboard ──────────────────────────────────────────────────────
  function loadAll(){
    var ps = [api('/api/nce/blueprint'), api('/api/nce/status')];
    if (TOKEN) ps.push(api('/api/nce/progress').catch(function(){ return null; }));
    var plans = fetch('/api/payment/plans?exam=nce').then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ LIVE = {}; ((d && d.plans) || []).forEach(function(p){ LIVE[p.tier] = p; }); })
      .catch(function(){});
    return Promise.all(ps).then(function(r){ return plans.then(function(){ return r; }); }).then(function(r){
      BP = r[0]; STATUS = r[1]; PROGRESS = r[2] || null;
      BP.domains.forEach(function(d){ DOM[d.key] = d; });
    });
  }

  function accessBanner(){
    var s = STATUS, msg = '', cls = 'info';
    if (s.examStatus !== 'live') { msg = '<b>NCE study is in early access.</b> The question bank is still growing. New questions are added every week.'; }
    if (s.accessLevel === 'free') { cls='info'; msg += (msg?'<br>':'') + 'You\'re previewing '+s.freeLimit+' sample questions. <a href="/register.html?next=/nce.html">Create a free account</a> for a '+s.trialDays+'-day NCE trial with full access.'; }
    else if (s.accessLevel === 'trial') { cls='ok'; msg += (msg?'<br>':'') + 'NCE free trial active' + (s.trialEndsAt ? ' until <b>'+new Date(s.trialEndsAt).toLocaleDateString()+'</b>' : '') + '. <a href="#pricing">See NCE plans</a>.'; }
    else if (s.accessLevel === 'gated') { cls='warn'; msg += (msg?'<br>':'') + 'Your NCE Pass Guarantee check-in is due. <a href="/score-report.html?exam=nce">Submit your exam date or score report</a> to restore full access.'; }
    else if (s.accessLevel === 'expired') { cls='warn'; msg += (msg?'<br>':'') + 'Your NCE trial has ended. Practice is limited to '+s.freeLimit+' sample questions. <a href="#pricing">Pick an NCE plan</a> to unlock everything.'; }
    else if (s.accessLevel === 'paid' && s.currentPeriodEnd) { cls='ok'; msg += (msg?'<br>':'') + 'NCE plan active' + (s.cancelAtPeriodEnd ? ' — ends ' : ' through ') + new Date(s.currentPeriodEnd).toLocaleDateString() + '.'; }
    return msg ? '<div class="banner '+cls+'">'+msg+'</div>' : '';
  }

  function daysUntil(d){ if(!d) return null; var ms = new Date(d) - new Date(); return Math.max(0, Math.ceil(ms/86400000)); }

  // Domain to practise next: lowest accuracy among domains with answers
  // (matching readiness.weakDomains); with no answers yet, the heaviest domain.
  function focusDomain(by){
    var best = null;
    BP.domains.forEach(function(d){
      var b = by[d.key] || {correct:0,total:0}, p = pct(b.correct,b.total);
      var score = p == null ? 1000 - d.weight : p;
      if (!best || score < best.score) best = { d: d, score: score, p: p };
    });
    return best;
  }

  // Dashboard hero: readiness ring (score from utils/nceReadiness.js),
  // countdown and a one-click start on the weakest domain.
  function heroHtml(by, dLeft, focus){
    var r = PROGRESS && PROGRESS.readiness;
    var ringC = !r ? 'var(--slate-500)' : r.score >= 70 ? 'var(--emerald)' : r.score >= 50 ? 'var(--amber)' : 'var(--red-400)';
    var trend = r ? (r.trend === 'up' ? '<span class="trend up">↑ Trending up</span>' : r.trend === 'down' ? '<span class="trend down">↓ Trending down</span>' : '<span class="trend flat">Steady</span>') : '';
    var eyebrow = dLeft == null ? 'NCE study' : dLeft === 0 ? 'NCE · exam day' : 'NCE · '+dLeft+' day'+(dLeft===1?'':'s')+' to go';
    var lead = r
      ? '<b>'+esc(r.label)+'</b>'+trend+(focus ? '<br>Focus next: <b>'+esc(focus.d.label)+'</b>'+(focus.p==null?' (not started)':' ('+focus.p+'%)')+'.' : '')
      : TOKEN ? 'Answer some practice questions or take a mock exam and your readiness score appears here.'
      : 'Try free sample questions, then <a href="/register.html?tab=login&next=/nce.html">sign in</a> or <a href="/register.html?next=/nce.html">create a free account</a> to track your readiness by domain.';
    var conf = r && r.answered < r.answeredForFullConfidence
      ? ' The score counts in full once you have answered '+r.answeredForFullConfidence+' questions ('+r.answered+' so far).' : '';
    return '<div class="hero">'+
      '<div class="ring" style="--p:'+(r ? r.score : 0)+';--c:'+ringC+'"><div><b>'+(r ? r.score+'%' : '—')+'</b><span>Readiness</span></div></div>'+
      '<div class="hero-body">'+
        '<div class="eyebrow"><span class="dot"></span>'+eyebrow+'</div>'+
        '<h1>NCE Study</h1>'+
        '<p class="lead">'+lead+'</p>'+
        '<div class="hero-cta">'+
          (focus ? '<button class="btn" id="go-focus">Practice '+esc(focus.d.short || focus.d.label)+'</button>' : '')+
          '<button class="btn btn-s" id="go-mock2">Take a mock exam</button>'+
        '</div>'+
        (r && r.score >= 85 ? '<p class="hero-fine"><a href="/resume.html">You are exam ready. Build your résumé →</a></p>' : '')+
        '<p class="hero-fine">'+BP.exam.totalItems+' questions ('+BP.exam.scoredItems+' scored) · '+Math.floor(BP.exam.minutes/60)+' hrs '+(BP.exam.minutes%60)+' min · '+BP.exam.optionsPerItem+' options each, weighted to NBCC\'s NCE content outline.</p>'+
        (r ? '<details><summary>How readiness works</summary><p>Your accuracy in each NCE domain, weighted by NBCC\'s scored item counts'+(r.weights && r.weights.length ? ' ('+r.weights.map(function(w){ return esc(w.short)+' '+w.pct+'%'; }).join(', ')+')' : '')+', adjusted for how much you have practiced and whether your recent work is trending up.'+conf+' 70%+ = almost there, 85%+ = exam ready. A practice indicator, not a prediction of your NCE result.</p></details>' : '')+
      '</div></div>';
  }

  // NCE study plan: three phases from today to the exam date, built from the
  // account's domain accuracy. Same shape as the NCMHCE plan (index.html genPlan).
  function planHtml(by, dLeft){
    var head = '<div class="card"><div class="plan-top"><h2 style="margin:0">Study plan</h2>'+(dLeft != null ? '<span class="plan-days">'+dLeft+' day'+(dLeft===1?'':'s')+' to go</span>' : '')+'</div>';
    if (!TOKEN) return head+'<p class="muted small" style="margin:0 0 10px">Sign in and set your exam date to get a day-by-day NCE study plan built from your weakest domains.</p>'+
      '<div class="ph-acts"><a class="btn btn-sm" href="/register.html?tab=login&next=/nce.html">Sign in</a><a class="btn btn-s btn-sm" href="/register.html?next=/nce.html">Create a free account</a></div></div>';
    if (dLeft == null) return head+'<p class="muted small" style="margin:0 0 10px">Set your NCE exam date and we\'ll build a 3-phase plan from your domain scores: weak areas first, then timed mock exams, then light review before test day.</p>'+
      '<input type="date" class="plan-date" id="exam-date-plan" aria-label="NCE exam date"></div>';
    if (dLeft === 0) return head+'<p style="margin:0">Exam day. Skip new material, eat, hydrate and trust your prep. Good luck!</p></div>';

    var started = [], fresh = [];
    BP.domains.forEach(function(d){
      var b = by[d.key] || {correct:0,total:0}, p = pct(b.correct,b.total);
      if (p == null) fresh.push(d); else started.push({ d: d, p: p });
    });
    started.sort(function(a,b){ return a.p - b.p; });
    fresh.sort(function(a,b){ return b.weight - a.weight; });
    var weak = started.slice(0, 2);
    var answered = (PROGRESS && PROGRESS.answered) || 0;
    var goal = (PROGRESS && PROGRESS.readiness && PROGRESS.readiness.answeredForFullConfidence) || 300;

    var p1, p2, p3;
    if (dLeft <= 2) { p1 = 0; p2 = 0; p3 = dLeft; }
    else if (dLeft < 7) { p3 = 1; p2 = 1; p1 = dLeft - 2; }
    else { p1 = Math.floor(dLeft * 0.5); p2 = Math.floor(dLeft * 0.3); p3 = dLeft - p1 - p2; }
    function when(a, b){ return a === b ? 'Day '+a : 'Days '+a+'–'+b; }
    function phase(n, title, from, to, body, acts){
      return '<div class="phase"><span class="ph-n p'+n+'">'+n+'</span><div>'+
        '<div class="ph-t">'+title+'<span class="ph-when">'+when(from, to)+'</span>'+(from === 1 ? '<span class="ph-now">Now</span>' : '')+'</div>'+
        '<div class="ph-d">'+body+'</div>'+(acts ? '<div class="ph-acts">'+acts+'</div>' : '')+'</div></div>';
    }

    var h = head, d = 1;
    if (p1) {
      var focus = weak.length
        ? 'Focus on your weakest domains: '+weak.map(function(w){ return '<b>'+esc(w.d.short || w.d.label)+'</b> ('+w.p+'%)'; }).join(' and ')+'.'
        : 'Start with the heaviest domains: '+fresh.slice(0, 2).map(function(x){ return '<b>'+esc(x.short || x.label)+'</b> ('+Math.round(x.weight*100)+'%)'; }).join(' and ')+'.';
      var untried = weak.length ? fresh.slice(0, 2) : [];
      var acts = (weak.length ? weak.map(function(w){ return w.d; }) : fresh.slice(0, 2)).map(function(x){
        return '<button class="btn btn-sm" data-practice="'+x.key+'">Practice '+esc(x.short || x.label)+'</button>'; }).join('');
      h += phase(1, 'Build foundations', d, d + p1 - 1,
        focus+(untried.length ? ' Also try: '+untried.map(function(x){ return esc(x.short || x.label); }).join(', ')+' (not started).' : '')+
        ' Read the rationale on every miss and review the matching study sheet section.', acts);
      d += p1;
    }
    if (p2) {
      var mocks = Math.max(1, Math.floor(p2 / 3));
      h += phase(2, 'Timed mock exams', d, d + p2 - 1,
        (mocks === 1 ? 'Take a full-length timed mock exam ('+BP.exam.totalItems+' questions) under real test conditions.'
          : 'Take '+mocks+' timed mock exams, building up from half length to full length ('+BP.exam.totalItems+' questions).')+' Review every missed question, then practice the domains it flags.',
        '<button class="btn btn-s btn-sm" id="plan-mock">Start a mock exam</button>');
      d += p2;
    }
    h += phase(3, 'Sharpen and rest', d, d + p3 - 1,
      'Light review only: your Focus domains, the study sheets and a game or two. The day before your exam, rest instead of cramming.',
      '<a class="btn btn-s btn-sm" href="/sheets/nce-study-sheets.pdf" target="_blank" rel="noopener">Study sheets</a><a class="btn btn-s btn-sm" href="/games.html#clue">Theory Clue</a>');

    var left = Math.max(0, goal - answered);
    var sets = p1 ? Math.max(1, Math.min(3, Math.ceil(left / p1 / 20))) : 1;
    h += '<div class="targets"><strong>Daily target:</strong> '+sets+' practice set'+(sets===1?'':'s')+' ('+(sets*20)+' questions) + 10 minutes with the study sheets.'+
      (left ? '<br><span class="muted small">'+left+' more answers until your readiness score counts in full ('+answered+' of '+goal+').</span>' : '')+'</div>';
    return h+'</div>';
  }

  var DOM_COLORS = ['#34D399','#60A5FA','#A78BFA','#FBBF24','#F472B6','#22D3EE'];
  var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var ICO = {
    practice: SVG+'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    mock: SVG+'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg>',
    target: SVG+'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
    done: SVG+'<path d="M20 6L9 17l-5-5"/></svg>',
    bank: SVG+'<path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>',
    cal: SVG+'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    sheet: SVG+'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
    games: SVG+'<rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="15.5" cy="11" r=".8" fill="currentColor"/><circle cx="17.5" cy="13" r=".8" fill="currentColor"/></svg>',
  };

  function renderHome(){
    stopTimer();
    var s = STATUS, by = (PROGRESS && PROGRESS.byDomain) || {};
    var totC = 0, totT = 0;
    Object.keys(by).forEach(function(k){ totC += by[k].correct; totT += by[k].total; });
    var overall = pct(totC, totT);
    var dLeft = daysUntil(s.examDate);
    var dateVal = s.examDate ? new Date(s.examDate).toISOString().slice(0,10) : '';

    var focus = focusDomain(by);
    var html = heroHtml(by, dLeft, focus)+
      accessBanner()+
      '<div class="stats">'+
        '<div class="stat"><span class="si em">'+ICO.target+'</span><div><div class="n">'+(overall==null?'—':overall+'%')+'</div><div class="l">Overall accuracy</div></div></div>'+
        '<div class="stat"><span class="si bl">'+ICO.done+'</span><div><div class="n">'+((PROGRESS && PROGRESS.answered) || 0)+'</div><div class="l">Questions answered</div></div></div>'+
        '<div class="stat"><span class="si vi">'+ICO.bank+'</span><div><div class="n">'+(s.bank.total||0)+'</div><div class="l">Questions in the bank</div></div></div>'+
        '<div class="stat"><span class="si am">'+ICO.cal+'</span><div><div class="n">'+(dLeft==null?'—':dLeft)+'</div><div class="l">Days to your NCE</div>'+
          (TOKEN ? '<input type="date" id="exam-date" value="'+dateVal+'" aria-label="NCE exam date">' : '')+'</div></div>'+
      '</div>'+
      '<div class="card"><h2>Start studying</h2><div class="grid2 start">'+
        '<button class="choice" id="go-practice"><span class="ico em">'+ICO.practice+'</span><b>Practice by domain</b><span>20 questions with feedback and rationales after each one.</span></button>'+
        '<button class="choice" id="go-mock"><span class="ico bl">'+ICO.mock+'</span><b>Timed mock exam</b><span>Weighted like the real NCE. Full length or shorter forms, scored at the end.</span></button>'+
        '<a class="choice" href="/sheets/nce-study-sheets.pdf" target="_blank" rel="noopener"><span class="ico vi">'+ICO.sheet+'</span><b>Study sheets (PDF)</b><span>Printable quick reference: key theories, names and facts across all 8 CACREP content areas.</span></a>'+
        '<div class="choice games"><span class="ico am">'+ICO.games+'</span><b>Study games</b><span>Need a break? Learn by playing.</span>'+
          '<div class="game-links"><a href="/games.html#clue">Theory Clue</a><a href="/games.html">Code Match · free</a><a href="/games.html#rush">Triage Rush · NCMHCE</a></div></div>'+
      '</div></div>'+
      planHtml(by, dLeft)+
      '<div class="card"><h2>NCE domains</h2><p class="muted small" style="margin-top:-4px">Weights are NBCC\'s scored item counts. Your accuracy comes from every practice set and mock exam you finish while signed in.</p>'+
      BP.domains.map(function(d, i){
        var b = by[d.key] || {correct:0,total:0}, p = pct(b.correct,b.total);
        var weak = focus && focus.d.key === d.key && p != null;
        return '<div class="dom d" data-practice="'+d.key+'" style="--dc:'+DOM_COLORS[i % DOM_COLORS.length]+'"><span class="dnum">'+(i+1)+'</span>'+
          '<div><div class="dom-name">'+esc(d.label)+(weak ? '<span class="weak-tag">Focus</span>' : '')+'</div>'+
          '<div class="dom-sub">'+d.scoredItems+' scored items ('+Math.round(d.weight*100)+'%) · '+(s.bank.byDomain[d.key]||0)+' in bank'+(p==null?'':' · '+b.total+' answered')+'</div>'+
          '<div class="pct-bar"><div class="pct-fill '+fillCls(p)+'" style="width:'+(p||0)+'%;animation-delay:'+(i*0.06)+'s"></div></div></div>'+
          '<div class="dright"><span class="pill '+(p==null?'none':fillCls(p))+'">'+(p==null?'New':p+'%')+'</span><button class="btn btn-s btn-sm">Practice</button></div></div>';
      }).join('')+'</div>'+
      (PROGRESS && PROGRESS.mocks && PROGRESS.mocks.length ? '<div class="card"><h2>Recent mock exams</h2>'+PROGRESS.mocks.map(function(m){
        return '<div class="dom"><div>'+new Date(m.completedAt).toLocaleDateString()+' · '+m.n+' questions</div><b>'+Math.round(m.score*100)+'%</b></div>'; }).join('')+'</div>' : '')+
      pricingHtml()+
      '<p class="muted small">NCE® is a registered trademark of the National Board for Certified Counselors, Inc. (NBCC). PassReady Prep is not affiliated with or endorsed by NBCC. Questions are original practice items, not actual exam items.</p>';
    stage.innerHTML = html;

    document.getElementById('go-practice').onclick = function(){ startPractice('all'); };
    document.getElementById('go-mock').onclick = renderMockSetup;
    document.getElementById('go-mock2').onclick = renderMockSetup;
    if (focus) document.getElementById('go-focus').onclick = function(){ startPractice(focus.d.key); };
    Array.prototype.forEach.call(stage.querySelectorAll('[data-practice]'), function(b){ b.onclick = function(){ startPractice(b.getAttribute('data-practice')); }; });
    Array.prototype.forEach.call(stage.querySelectorAll('[data-buy]'), function(b){ b.onclick = function(){ buy(b.getAttribute('data-buy'), b); }; });
    ['exam-date', 'exam-date-plan'].forEach(function(id){
      var ed = document.getElementById(id);
      if (ed) ed.onchange = function(){
        api('/api/nce/exam-date', { method:'PUT', body:{ examDate: ed.value || null } })
          .then(function(r){ STATUS.examDate = r.examDate; renderHome(); }).catch(function(e){ alert(e.message); });
      };
    });
    var pm = document.getElementById('plan-mock');
    if (pm) pm.onclick = renderMockSetup;
    if (location.hash === '#pricing') { var el = document.getElementById('pricing'); if (el) el.scrollIntoView(); }
  }

  function pricingHtml(){
    if (STATUS.accessLevel === 'paid' || STATUS.accessLevel === 'gated') return '';
    return '<div class="card" id="pricing"><h2>NCE plans</h2>'+
      '<p class="muted small" style="margin-top:-4px">Billed separately from NCMHCE. One-time passes don\'t renew.</p><div class="plans">'+
      PLANS.filter(function(p){ return !p.liveOnly || LIVE[p.tier]; }).map(function(p){
        var price = LIVE[p.tier] ? money(LIVE[p.tier].amount) : p.price;
        return '<div class="plan'+(p.best?' best':'')+'"><div class="pn">'+esc(p.name)+(p.note?' · '+esc(p.note):'')+'</div>'+
          '<div class="pp">'+esc(price)+' <small>'+esc(p.per)+'</small></div>'+
          '<ul>'+p.features.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join('')+'</ul>'+
          '<button class="btn'+(p.best?'':' btn-s')+'" data-buy="'+p.tier+'">Choose '+esc(p.name)+'</button></div>';
      }).join('')+'</div></div>';
  }

  function buy(tier, btn){
    if (!TOKEN) { location.href = '/register.html?next=' + encodeURIComponent('/nce.html#pricing'); return; }
    // The guarantee needs its terms acknowledged first; checkout.html has that step.
    if (tier === 'nce_guarantee') { location.href = '/checkout.html?tier=nce_guarantee'; return; }
    btn.disabled = true; btn.textContent = 'Opening checkout…';
    api('/api/payment/create-checkout-session', { method:'POST', body:{ tier: tier } })
      .then(function(r){ location.href = r.url; })
      .catch(function(e){ btn.disabled = false; btn.textContent = 'Try again'; alert(e.message); });
  }

  // ── Practice (feedback after every question) ──────────────────────
  var P = null;
  function startPractice(domain){
    stage.innerHTML = '<div class="card">Loading questions…</div>';
    api('/api/nce/practice?count=20&domain='+encodeURIComponent(domain)).then(function(r){
      if (!r.items.length) { stage.innerHTML = '<div class="card"><p>No questions are published here yet. Check back soon.</p><button class="btn btn-s" id="back">Back</button></div>'; document.getElementById('back').onclick = renderHome; return; }
      P = { items: r.items, i: 0, answers: {}, teaser: r.teaser, startedAt: new Date().toISOString(), domain: domain };
      renderPracticeQ();
    }).catch(function(e){ stage.innerHTML = '<div class="card">'+esc(e.message)+'</div>'; });
  }

  function renderPracticeQ(){
    var it = P.items[P.i], chosen = P.answers[it.id];
    var key = it.options.filter(function(o){ return o.isCorrect; })[0], gotIt = !!(chosen && key && key.id === chosen);
    var html = '<div class="card"><div class="q-meta"><span class="q-num">Question '+(P.i+1)+' of '+P.items.length+'</span>'+
      '<span class="badge b-em">'+esc((DOM[it.domain]||{}).short || it.domain)+'</span>'+(P.teaser?'<span class="badge b-am">Sample</span>':'')+'</div>'+
      '<p class="qstem">'+esc(it.stem)+'</p>'+
      (chosen ? (gotIt
        ? '<div class="verdict ok" role="status"><span class="vi" aria-hidden="true">✓</span>Correct!</div>'
        : '<div class="verdict bad" role="status"><span class="vi" aria-hidden="true">✗</span>Incorrect. The correct answer is '+(key ? key.id.toUpperCase() : '')+'.</div>') : '')+
      '<div class="opts">'+
      it.options.map(function(o){
        var cls = '', tag = '';
        if (chosen) {
          if (o.isCorrect) { cls = 'correct'; tag = o.id === chosen ? '✓ Your answer' : '✓ Correct answer'; }
          else if (o.id === chosen) { cls = 'wrong'; tag = '✗ Your answer'; }
          else cls = 'dim';
        }
        return '<div><button class="opt '+cls+'" data-opt="'+o.id+'"'+(chosen?' disabled':'')+'><span class="mk">'+o.id.toUpperCase()+'</span><span>'+esc(o.text)+'</span>'+
          (tag ? '<span class="tag">'+tag+'</span>' : '')+'</button>'+
          (chosen && (o.isCorrect || o.id === chosen) && o.rationale ? '<div class="opt-why '+(o.isCorrect?'ok':'bad')+'">'+esc(o.rationale)+'</div>' : '')+'</div>';
      }).join('')+'</div>'+
      (chosen ? '<div class="rationale'+(gotIt?'':' bad')+'"><span class="rat-label">Why</span>'+esc(it.rationale)+
        (it.references && it.references.length ? '<div class="muted small" style="margin-top:6px">'+it.references.map(function(r){ return esc(r.source)+(r.detail?' — '+esc(r.detail):''); }).join(' | ')+'</div>' : '')+'</div>' : '')+
      '<div class="nav-row">'+
        (P.i>0?'<button class="btn btn-s btn-sm" id="prev">Previous</button>':'')+
        (chosen ? (P.i < P.items.length-1 ? '<button class="btn btn-sm" id="next">Next</button>' : '<button class="btn btn-sm" id="finish">Finish</button>') : '')+
        '<button class="btn btn-s btn-sm" id="quit" style="margin-left:auto">End set</button>'+
      '</div></div>';
    stage.innerHTML = html;
    Array.prototype.forEach.call(stage.querySelectorAll('[data-opt]'), function(b){
      b.onclick = function(){ P.answers[it.id] = b.getAttribute('data-opt'); renderPracticeQ(); };
    });
    var x;
    if ((x = document.getElementById('prev'))) x.onclick = function(){ P.i--; renderPracticeQ(); };
    if ((x = document.getElementById('next'))) x.onclick = function(){ P.i++; renderPracticeQ(); };
    if ((x = document.getElementById('finish'))) x.onclick = finishPractice;
    document.getElementById('quit').onclick = finishPractice;
  }

  function finishPractice(){
    var answered = P.items.filter(function(it){ return P.answers[it.id]; });
    if (!answered.length) { renderHome(); return; }
    var results = answered.map(function(it){
      var key = it.options.filter(function(o){ return o.isCorrect; })[0];
      return { it: it, ok: key && key.id === P.answers[it.id] };
    });
    renderResults('Practice set complete', results, null);
    saveAttempt('study', answered.map(function(it){ return { id: it.id, selected: P.answers[it.id], scored: true }; }), P.startedAt);
  }

  // ── Timed mock exam ───────────────────────────────────────────────
  var M = null, mockSize = 'full';
  function renderMockSetup(){
    stopTimer();
    if (STATUS.accessLevel === 'free' || STATUS.accessLevel === 'expired') {
      stage.innerHTML = '<div class="card"><h2>Timed mock exams</h2><p>'+(STATUS.accessLevel==='free'
        ? 'Create a free account to take a timed NCE mock exam. Your '+STATUS.trialDays+'-day NCE trial starts the first time you open this page signed in.'
        : 'Your NCE trial has ended. Pick an NCE plan to keep taking timed mock exams.')+'</p>'+
        '<div class="nav-row">'+(STATUS.accessLevel==='free' ? '<a class="btn" href="/register.html?next=/nce.html">Create free account</a>' : '<a class="btn" href="#pricing" id="to-pricing">See NCE plans</a>')+
        '<button class="btn btn-s" id="back">Back</button></div></div>';
      document.getElementById('back').onclick = renderHome;
      var tp = document.getElementById('to-pricing'); if (tp) tp.onclick = function(e){ e.preventDefault(); renderHome(); document.getElementById('pricing').scrollIntoView(); };
      return;
    }
    var forms = [
      { k:'full', n:BP.exam.totalItems, t:'Full length · '+fmt(BP.exam.minutes*60)+' · '+BP.exam.unscoredItems+' unscored items, like the real exam' },
      { k:'100', n:100, t:'Half length · '+fmt(Math.round(BP.exam.minutes/2)*60) },
      { k:'50', n:50, t:'Quarter length · '+fmt(Math.round(BP.exam.minutes/4)*60) },
    ];
    stage.innerHTML = '<div class="card"><h2>Timed NCE mock exam</h2>'+
      '<p class="muted">Questions are drawn to NBCC\'s domain weights. No feedback until you submit. You can flag questions and jump around, like the real exam.</p>'+
      '<div class="grid2">'+forms.map(function(f){
        return '<button class="choice'+(mockSize===f.k?' selected':'')+'" data-size="'+f.k+'"><b>'+f.n+' questions</b><span>'+f.t+'</span></button>'; }).join('')+'</div>'+
      '<div class="nav-row"><button class="btn" id="start">Start exam</button><button class="btn btn-s" id="back">Back</button></div></div>';
    Array.prototype.forEach.call(stage.querySelectorAll('[data-size]'), function(b){ b.onclick = function(){ mockSize = b.getAttribute('data-size'); renderMockSetup(); }; });
    document.getElementById('back').onclick = renderHome;
    document.getElementById('start').onclick = startMock;
  }

  function startMock(){
    stage.innerHTML = '<div class="card">Building your exam…</div>';
    api('/api/nce/mock?size='+mockSize).then(function(r){
      if (!r.items.length) { stage.innerHTML = '<div class="card"><p>Not enough questions are published yet to build a mock exam.</p><button class="btn btn-s" id="back">Back</button></div>'; document.getElementById('back').onclick = renderHome; return; }
      M = { items: r.items, i: 0, answers: {}, flags: {}, startedAt: new Date().toISOString(), shortfall: r.shortfall };
      startTimer(r.minutes * 60);
      renderMockQ();
    }).catch(function(e){ stage.innerHTML = '<div class="card">'+esc(e.message)+'</div>'; });
  }

  function startTimer(secs){
    timerSecs = secs; timerBar.style.display = 'block';
    tick(); timerIv = setInterval(function(){ timerSecs--; tick(); if (timerSecs <= 0) { stopTimer(); submitMock(true); } }, 1000);
  }
  function tick(){
    timerDisplay.textContent = fmt(Math.max(0,timerSecs));
    timerDisplay.className = 'timer-display' + (timerSecs < 300 ? ' danger' : timerSecs < 900 ? ' warn' : '');
    if (M) { var n = Object.keys(M.answers).length; timerProg.innerHTML = '<strong>'+n+' / '+M.items.length+'</strong>answered'; }
  }
  function stopTimer(){ if (timerIv) clearInterval(timerIv); timerIv = null; timerBar.style.display = 'none'; }
  document.getElementById('timer-exit').onclick = function(){
    if (confirm('Exit this mock exam? Your answers will not be saved.')) { stopTimer(); M = null; renderHome(); }
  };

  function renderMockQ(){
    var it = M.items[M.i], chosen = M.answers[it.id];
    stage.innerHTML = '<div class="card">'+
      '<div class="nav-grid" aria-label="Question navigator">'+M.items.map(function(q,i){
        var c = 'ag-cell'+(i===M.i?' current':'')+(M.answers[q.id]?' answered':'')+(M.flags[q.id]?' flagged':'');
        return '<button class="'+c+'" data-go="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>'; }).join('')+'</div>'+
      '<div class="q-meta"><span class="q-num">Question '+(M.i+1)+' of '+M.items.length+'</span></div>'+
      '<p class="qstem">'+esc(it.stem)+'</p><div class="opts">'+
      it.options.map(function(o){
        return '<button class="opt'+(chosen===o.id?' selected':'')+'" data-opt="'+o.id+'"><span class="mk">'+o.id.toUpperCase()+'</span><span>'+esc(o.text)+'</span></button>'; }).join('')+'</div>'+
      '<div class="nav-row">'+
        (M.i>0?'<button class="btn btn-s btn-sm" id="prev">Previous</button>':'')+
        (M.i<M.items.length-1?'<button class="btn btn-sm" id="next">Next</button>':'')+
        '<button class="flag-btn'+(M.flags[it.id]?' flagged':'')+'" id="flag">'+(M.flags[it.id]?'Flagged':'Flag for review')+'</button>'+
        '<button class="btn btn-sm" id="submit" style="margin-left:auto">Submit exam</button>'+
      '</div></div>';
    tick();
    Array.prototype.forEach.call(stage.querySelectorAll('[data-opt]'), function(b){ b.onclick = function(){ M.answers[it.id] = b.getAttribute('data-opt'); renderMockQ(); }; });
    Array.prototype.forEach.call(stage.querySelectorAll('[data-go]'), function(b){ b.onclick = function(){ M.i = +b.getAttribute('data-go'); renderMockQ(); }; });
    var x;
    if ((x = document.getElementById('prev'))) x.onclick = function(){ M.i--; renderMockQ(); };
    if ((x = document.getElementById('next'))) x.onclick = function(){ M.i++; renderMockQ(); };
    document.getElementById('flag').onclick = function(){ M.flags[it.id] = !M.flags[it.id]; renderMockQ(); };
    document.getElementById('submit').onclick = function(){
      var left = M.items.length - Object.keys(M.answers).length;
      if (confirm(left ? 'You have '+left+' unanswered question'+(left===1?'':'s')+'. Submit anyway?' : 'Submit your exam?')) submitMock(false);
    };
  }

  function submitMock(timeUp){
    stopTimer();
    var scored = M.items.filter(function(it){ return it.scored !== false; });
    var results = scored.map(function(it){
      var key = it.options.filter(function(o){ return o.isCorrect; })[0];
      return { it: it, ok: !!(key && key.id === M.answers[it.id]) };
    });
    var unscoredN = M.items.length - scored.length;
    renderResults(timeUp ? 'Time\'s up — exam submitted' : 'Mock exam submitted', results,
      unscoredN ? unscoredN+' unscored items (like the real NCE\'s field-test questions) are not counted.' : null);
    saveAttempt('timed', M.items.map(function(it){ return { id: it.id, selected: M.answers[it.id] || null, scored: it.scored !== false }; }), M.startedAt);
    M = null;
  }

  // ── Results + review ──────────────────────────────────────────────
  function renderResults(title, results, note){
    var right = results.filter(function(r){ return r.ok; }).length;
    var by = {};
    results.forEach(function(r){ var b = by[r.it.domain] = by[r.it.domain] || {c:0,t:0}; b.t++; if (r.ok) b.c++; });
    var p = pct(right, results.length);
    stage.innerHTML = '<div class="score-card"><div class="muted small">'+esc(title)+'</div><div class="score-big">'+right+' / '+results.length+'</div>'+
      '<div style="font-size:20px;font-weight:700;margin-top:4px">'+(p==null?'—':p+'%')+'</div>'+
      (note ? '<div class="muted small" style="margin-top:6px">'+esc(note)+'</div>' : '')+
      '<div class="muted small" style="margin-top:6px">NBCC sets the passing score for each exam form, so use your weakest domains below to decide what to study next.</div></div>'+
      '<div class="card"><h2>By domain</h2><table class="domain-table"><thead><tr><th>Domain</th><th>Correct</th><th>%</th></tr></thead><tbody>'+
      BP.domains.filter(function(d){ return by[d.key]; }).map(function(d){
        var b = by[d.key]; return '<tr><td>'+esc(d.label)+'</td><td>'+b.c+' / '+b.t+'</td><td>'+pct(b.c,b.t)+'%</td></tr>'; }).join('')+
      '</tbody></table></div>'+
      '<div class="card"><h2>Review missed questions</h2>'+
      (results.filter(function(r){ return !r.ok; }).map(function(r){
        var key = r.it.options.filter(function(o){ return o.isCorrect; })[0];
        return '<div style="padding:10px 0;border-bottom:1px solid rgba(51,65,85,.45)"><div class="muted small">'+esc((DOM[r.it.domain]||{}).short||r.it.domain)+'</div>'+
          '<div style="color:var(--white);font-weight:600;margin:4px 0">'+esc(r.it.stem)+'</div>'+
          '<div class="small"><b style="color:var(--emerald-400)">Answer '+key.id.toUpperCase()+':</b> '+esc(key.text)+'</div>'+
          '<div class="rationale">'+esc(r.it.rationale)+'</div></div>';
      }).join('') || '<p class="muted">Nothing missed. Nice work.</p>')+'</div>'+
      '<div class="nav-row"><button class="btn" id="home">Back to NCE dashboard</button></div>';
    document.getElementById('home').onclick = function(){ loadAll().then(renderHome); };
    window.scrollTo({ top: 0 });
  }

  function saveAttempt(mode, responses, startedAt){
    if (!TOKEN) return;
    api('/api/nce/attempts', { method:'POST', body:{ mode: mode, responses: responses, startedAt: startedAt } })
      .catch(function(e){ console.warn('Could not save NCE attempt', e.message); });
  }

  // Leaving mid-exam loses the attempt — warn first.
  window.addEventListener('beforeunload', function(e){ if (M) { e.preventDefault(); e.returnValue = ''; } });

  loadAll().then(function(){
    renderHome();
    if (/purchase=success/.test(location.search)) {
      stage.insertAdjacentHTML('afterbegin', '<div class="banner ok">Payment received. Your NCE plan is being activated. This page refreshes in a moment.</div>');
      setTimeout(function(){ loadAll().then(renderHome); }, 3000); // give the webhook a moment
    }
  }).catch(function(e){ stage.innerHTML = '<div class="card">Could not load NCE study: '+esc(e.message)+'</div>'; });
})();
</script>
</body>
</html>
