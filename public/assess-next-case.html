<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PassReady Prep — What to Assess Next</title>
<link rel="canonical" href="https://www.passreadyprep.com/assess-next-case.html" />
<style>
:root{
  --slate-900:#0F172A; --slate-800:#1E293B; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748B; --slate-400:#94A3B8; --slate-300:#CBD5E1; --slate-200:#E2E8F0; --white:#F8FAFC;
  --emerald:#10B981; --emerald-400:#34D399;
  --blue-400:#60A5FA; --blue:#3B82F6;
  --amber-400:#FBBF24; --amber:#F59E0B;
  --red-400:#F87171; --red:#EF4444; --red-600:#DC2626;
  --purple-400:#A78BFA; --purple:#8B5CF6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xl:16px; --r-lg:12px; --r-md:10px;
  --card:rgba(30,41,59,.55); --card-border:rgba(51,65,85,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(160deg,#0F172A 0%,#1E293B 50%,#0F172A 100%); background-attachment:fixed;
  color:var(--slate-200); font-family:var(--sans); font-size:16px; line-height:1.55;
}
.wrap{max-width:760px; margin:0 auto; padding:18px 16px 64px}
a{color:var(--emerald-400)}
header.site{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 2px 20px}
.brand-wrap{display:flex; align-items:center; gap:11px}
.brand-chip{width:38px; height:38px; border-radius:11px; background:rgba(16,185,129,.16); display:grid; place-items:center; flex:0 0 auto}
.brand-chip svg{width:21px; height:21px; color:var(--emerald-400)}
.brand{font-weight:700; font-size:18px; color:var(--white); letter-spacing:-.01em; line-height:1.1}
.brand .prep{color:var(--emerald-400)}
.brand small{display:block; font-weight:600; font-size:11.5px; color:var(--emerald-400); letter-spacing:.02em; margin-top:1px}
.exam-badge{font-size:12px; font-weight:700; color:var(--emerald-400); background:rgba(16,185,129,.14);
  border:1px solid rgba(16,185,129,.3); padding:5px 11px; border-radius:999px}
h1{font-size:25px; line-height:1.15; margin:0 0 6px; color:var(--white); font-weight:700; letter-spacing:-.01em}
h2{font-size:18px; margin:0 0 6px; color:var(--white); font-weight:700}
.lead{color:var(--slate-400); margin:0 0 18px}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-xl); padding:18px 20px}
.back{background:none; border:none; cursor:pointer; font:inherit; color:var(--slate-400); font-weight:600; padding:6px 0; margin-bottom:8px; text-decoration:none; display:inline-block}
.back:hover{color:var(--white)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font:inherit; font-weight:700;
  background:var(--emerald); color:#04261C; border:none; border-radius:var(--r-md); padding:13px 22px; transition:background .15s}
.btn:hover{background:var(--emerald-400)}
.btn:disabled{opacity:.5; cursor:default}
.btn.secondary{background:rgba(51,65,85,.5); color:var(--slate-200); border:none}
.btn.secondary:hover{background:rgba(51,65,85,.85)}
.btn.sm{padding:8px 16px; font-size:14px}
.row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}

/* badges */
.badge{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:4px 10px; border-radius:999px; text-transform:uppercase}
.b-em{color:var(--emerald-400); background:rgba(16,185,129,.15)}
.b-bl{color:var(--blue-400); background:rgba(59,130,246,.15)}
.b-am{color:var(--amber-400); background:rgba(245,158,11,.15)}
.b-rd{color:var(--red-400); background:rgba(239,68,68,.15)}
.b-sl{color:var(--slate-300); background:rgba(51,65,85,.5)}

/* case select */
.case-btn{display:block; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-xl);
  padding:16px 18px; margin-bottom:12px; transition:border-color .15s, transform .12s}
.case-btn:hover{border-color:rgba(16,185,129,.5); transform:translateY(-1px)}
.case-chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:9px}
.case-name{font-size:17px; font-weight:700; color:var(--white); display:block}
.case-demo{font-size:13px; color:var(--slate-400); margin-top:2px}
.case-teaser{font-size:14px; color:var(--slate-300); margin-top:8px; line-height:1.5}

/* progress */
.progress-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; font-size:13px; font-weight:600; color:var(--slate-400)}
.bar{height:8px; background:var(--slate-700); border-radius:999px; overflow:hidden; margin-bottom:16px}
.bar>i{display:block; height:100%; background:var(--emerald); border-radius:999px; transition:width .3s}

/* history accordion */
.hist{margin-bottom:16px}
.hist-item{background:rgba(30,41,59,.4); border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:8px; overflow:hidden}
.hist-item summary{list-style:none; cursor:pointer; padding:11px 14px; display:flex; align-items:center; gap:9px; user-select:none; font-size:14px}
.hist-item summary::-webkit-details-marker{display:none}
.hist-item summary:hover{background:rgba(51,65,85,.35)}
.hist-num{flex:0 0 auto; width:24px; height:24px; border-radius:7px; background:rgba(16,185,129,.16); color:var(--emerald-400);
  display:grid; place-items:center; font-size:12px; font-weight:700}
.hist-label{font-weight:600; color:var(--slate-200); flex:1 1 auto; min-width:0}
.hist-chev{flex:0 0 auto; color:var(--slate-500); font-size:12px}
.hist-body{padding:2px 14px 14px; border-top:1px solid rgba(51,65,85,.4)}
.hist-body .sub{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--slate-500); margin:12px 0 4px}

/* reveal — new clinical information */
.reveal{background:rgba(59,130,246,.09); border:1px solid rgba(59,130,246,.32); border-left:3px solid var(--blue);
  border-radius:var(--r-lg); padding:13px 15px; margin-bottom:16px}
.reveal .rl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--blue-400); display:block; margin-bottom:5px}
.reveal p{margin:0; color:var(--slate-200); line-height:1.6}

/* vignette */
.vignette{background:rgba(30,41,59,.7); border:1px solid var(--card-border); border-radius:var(--r-lg); padding:13px 15px; margin-bottom:16px}
.vignette .rl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--emerald-400); display:block; margin-bottom:5px}
.vignette p{margin:0; color:var(--slate-200); line-height:1.6}

.stage-label{display:inline-block; font-size:15px; font-weight:700; color:#04261C; background:var(--emerald-400);
  padding:8px 16px; border-radius:999px; margin-bottom:14px}
.prompt{font-size:17px; font-weight:600; color:var(--white); line-height:1.5; margin:0 0 14px}

/* response area */
textarea#inp{width:100%; font:inherit; font-size:15px; color:var(--white); background:rgba(30,41,59,.6);
  border:1.5px solid var(--card-border); border-radius:var(--r-md); padding:12px 14px; outline:none; resize:none; min-height:84px; max-height:300px; overflow-y:auto}
textarea#inp:focus{border-color:var(--emerald)}
.controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center}

/* feedback */
.feedback-text{font-size:15px; color:var(--slate-200); line-height:1.65; white-space:pre-wrap}
.fb-head{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--emerald-400); margin-bottom:7px}
.fb-box{background:rgba(16,185,129,.07); border:1px solid rgba(16,185,129,.22); border-radius:var(--r-lg); padding:14px 16px; margin-top:16px}
.fb-err{color:var(--red-400); font-size:14px; margin-top:14px}
.nohint{font-size:13px; opacity:.75; margin-top:10px}

/* collapsible rationale + resources */
.disc{margin-top:12px; background:rgba(30,41,59,.45); border:1px solid var(--card-border); border-radius:var(--r-lg); overflow:hidden}
.disc summary{list-style:none; cursor:pointer; padding:11px 14px; font-size:14px; font-weight:600; color:var(--slate-200); user-select:none; display:flex; align-items:center; justify-content:space-between; gap:8px}
.disc summary::-webkit-details-marker{display:none}
.disc summary:hover{background:rgba(51,65,85,.35)}
.disc .disc-body{padding:2px 14px 14px; font-size:14.5px; color:var(--slate-300); line-height:1.65; border-top:1px solid rgba(51,65,85,.4)}
.res{margin-top:12px}
.res .res-h{font-size:13px; font-weight:700; color:var(--slate-200); margin-bottom:7px}
.res a{display:block; font-size:14px; padding:8px 12px; margin-bottom:6px; background:rgba(51,65,85,.35);
  border:1px solid var(--card-border); border-radius:var(--r-md); text-decoration:none; color:var(--emerald-400)}
.res a:hover{background:rgba(51,65,85,.6)}

/* summary screen */
.sum-resp{font-size:14.5px; color:var(--slate-300); line-height:1.6; white-space:pre-wrap}
.clamp{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.expand{background:none; border:none; padding:4px 0 0; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:var(--emerald-400)}

/* voice info disclosure */
.voice-info{margin-top:8px}
.voice-info summary{list-style:none; cursor:pointer; font-size:12px; color:var(--slate-500); display:inline-flex; align-items:center; gap:4px; user-select:none}
.voice-info summary::-webkit-details-marker{display:none}
.voice-info summary:hover{color:var(--slate-400)}
.voice-info p{margin:6px 0 0; font-size:12px; color:var(--slate-500); line-height:1.6; max-width:480px}
.voice-info a{color:var(--emerald-400); font-size:12px}

/* first-time voice modal */
.voice-modal-overlay{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); padding:16px}
.voice-modal{background:var(--slate-900); border:1px solid var(--slate-700); border-radius:16px;
  max-width:360px; width:100%; padding:20px; box-shadow:0 25px 50px rgba(0,0,0,.5)}
.voice-modal p{margin:0 0 16px; font-size:14px; color:var(--slate-300); line-height:1.6}
.voice-modal .voice-modal-link{font-size:12px; color:var(--slate-500); margin:0 0 16px}
.voice-modal .voice-modal-link a{color:var(--emerald-400)}
.voice-modal button{width:100%; padding:10px; background:var(--emerald); color:#04261C; font:inherit; font-weight:700;
  border:none; border-radius:10px; cursor:pointer; transition:background .15s}
.voice-modal button:hover{background:var(--emerald-400)}

:focus-visible{outline:2.5px solid var(--emerald-400); outline-offset:2px; border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
@media(max-width:520px){h1{font-size:22px} .wrap{padding:16px 14px 56px} .card{padding:16px} .prompt{font-size:16px}}
</style>
</head>
<body>

<!-- First-time voice notice modal (hidden until first mic tap) -->
<div id="voice-modal-overlay" class="voice-modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="voice-modal-title">
  <div class="voice-modal">
    <p id="voice-modal-title">PassReady Prep does not record or store your voice. Your browser converts speech to text — we receive only the text.</p>
    <p class="voice-modal-link"><a href="/?voiceprivacy=1">See our data practices</a> for details.</p>
    <button onclick="dismissVoiceModal()">Got it</button>
  </div>
</div>

<div class="wrap">
  <header class="site">
    <div class="brand-wrap">
      <span class="brand-chip" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
          <path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
      </span>
      <span class="brand">PassReady <span class="prep">Prep</span><small>NCMHCE clinical simulations</small></span>
    </div>
    <span class="exam-badge">ASSESS NEXT</span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script src="/js/assessNextCases.js"></script>
<script>
// ---- auth gate: signed-in only (every round costs an AI call) ----
(function () {
  var t = null;
  try { t = localStorage.getItem('prp_token'); } catch (e) { t = null; }
  if (!t) {
    window.location.href = '/register.html?next=' + encodeURIComponent(location.pathname + location.search);
  }
})();

var CASES = (typeof ASSESS_NEXT_CASES !== 'undefined') ? ASSESS_NEXT_CASES : [];
var COMPLETED_KEY = 'prp_assess_next_completed';

var app = document.getElementById('app');
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// current run: which case, which round, and every completed round
var run = null;   // { caseObj, roundIdx, history: [{stage,stageLabel,prompt,userResponse,reveal,feedback}], feedback, busy, error }

function authHeaders() {
  try { var t = localStorage.getItem('prp_token'); return t ? { Authorization: 'Bearer ' + t } : {}; }
  catch (e) { return {}; }
}

function loadCompleted() {
  try { var v = JSON.parse(localStorage.getItem(COMPLETED_KEY)); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function markCompleted(id) {
  try {
    var done = loadCompleted();
    if (done.indexOf(id) === -1) { done.push(id); localStorage.setItem(COMPLETED_KEY, JSON.stringify(done)); }
  } catch (e) {}
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 300) + 'px';
}

function diffBadge(d) {
  var k = String(d || '').toLowerCase();
  return k === 'easy' ? 'b-em' : k === 'hard' ? 'b-rd' : 'b-am';
}

// First sentence of the intake vignette, as the case-card teaser.
function teaser(v) {
  var s = String(v || '').trim();
  var m = s.match(/^[\s\S]*?[.!?](\s|$)/);
  var out = m ? m[0].trim() : s;
  return out.length > 160 ? out.slice(0, 157).trim() + '…' : out;
}

// ---- screen 1: pick a case ----
function renderCaseSelect() {
  run = null;
  var done = loadCompleted();
  var h = '<a href="/study" class="back">‹ Dashboard</a>';
  h += '<h1>What to Assess Next</h1>';
  h += '<p class="lead">Follow one client through ten sequential clinical decisions — safety screening through treatment planning and ethics. You write what you would assess next and why; each round is scored, then new clinical information is revealed.</p>';

  if (!CASES.length) {
    h += '<div class="card">Cases failed to load.</div>';
    app.innerHTML = h;
    return;
  }

  CASES.forEach(function (c) {
    var isDone = done.indexOf(c.id) !== -1;
    h += '<button class="case-btn" onclick="startCase(\'' + esc(c.id) + '\')">';
    h += '<span class="case-chips">';
    h += '<span class="badge b-bl">' + esc(c.category) + '</span>';
    h += '<span class="badge ' + diffBadge(c.difficulty) + '">' + esc(c.difficulty) + '</span>';
    h += '<span class="badge b-sl">' + c.rounds.length + ' rounds</span>';
    if (isDone) h += '<span class="badge b-em">✓ Completed</span>';
    h += '</span>';
    h += '<span class="case-name">' + esc(c.clientName) + '</span>';
    h += '<span class="case-demo">' + esc(c.demographics) + '</span>';
    h += '<span class="case-teaser">' + esc(teaser(c.intakeVignette)) + '</span>';
    h += '</button>';
  });

  app.innerHTML = h;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startCase(id) {
  var c = null;
  for (var i = 0; i < CASES.length; i++) { if (CASES[i].id === id) { c = CASES[i]; break; } }
  if (!c) return;
  run = { caseObj: c, roundIdx: 0, history: [], feedback: null, busy: false, error: null };
  renderRound();
}

// ---- screen 2: the active case ----
function renderRound() {
  var c = run.caseObj;
  var r = c.rounds[run.roundIdx];
  var total = c.rounds.length;
  var prev = run.roundIdx > 0 ? c.rounds[run.roundIdx - 1] : null;

  var h = '<button class="back" onclick="confirmExit()">‹ All cases</button>';
  h += '<h1>' + esc(c.clientName) + '</h1>';
  h += '<p class="lead">' + esc(c.demographics) + ' · ' + esc(c.category) + '</p>';

  // progress
  h += '<div class="progress-head"><span>Round ' + (run.roundIdx + 1) + ' of ' + total + '</span>';
  h += '<span>' + esc(r.stageLabel) + '</span></div>';
  h += '<div class="bar"><i style="width:' + Math.round((run.roundIdx / total) * 100) + '%"></i></div>';

  // history of completed rounds
  h += renderHistory();

  h += '<div class="card">';
  h += '<span class="stage-label">' + esc(r.stageLabel) + '</span>';

  // Round 1 shows the intake vignette; later rounds lead with the previous
  // round's reveal, styled as new clinical information.
  if (run.roundIdx === 0) {
    h += '<div class="vignette"><span class="rl">Intake vignette</span><p>' + esc(c.intakeVignette) + '</p></div>';
  } else if (prev && prev.reveal) {
    h += '<div class="reveal"><span class="rl">↓ New clinical information</span><p>' + esc(prev.reveal) + '</p></div>';
  }

  h += '<p class="prompt">' + esc(r.prompt) + '</p>';

  if (run.feedback === null) {
    h += '<textarea id="inp" placeholder="' + (SR ? 'Type your response, or tap Mic to speak…' : 'Type your response…') + '" oninput="autoResize(this)"' + (run.busy ? ' disabled' : '') + '></textarea>';
    h += '<div class="controls">';
    if (SR) h += '<button class="btn secondary sm" onclick="startMic()" title="Speak your response">🎤 Mic</button>';
    h += '<button class="btn" id="submitbtn" onclick="submitRound()"' + (run.busy ? ' disabled' : '') + '>' + (run.busy ? 'Scoring…' : 'Submit response') + '</button>';
    h += '</div>';
    if (SR) {
      h += '<details class="voice-info"><summary>ℹ️ About voice input</summary>';
      h += '<p>🎤 Voice input uses your browser\'s built-in speech recognition (e.g., Google for Chrome, Apple for Safari). Your voice is converted to text by your browser provider — PassReady Prep receives only the transcribed text. No audio recordings or voiceprints are stored on our servers. <a href="/?voiceprivacy=1">Learn more</a></p>';
      h += '</details>';
    }
    if (!SR) h += '<div class="nohint">🎤 Voice input needs Chrome (desktop or Android). You can type your response here instead.</div>';
    if (run.error) h += '<div class="fb-err">' + esc(run.error) + '</div>';
  } else {
    // answered — show what they wrote, the AI feedback, rationale, resources
    h += '<div class="disc" open><div class="disc-body" style="border-top:none;padding-top:12px">';
    h += '<div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--slate-500);margin-bottom:4px">Your response</div>';
    h += '<div class="sum-resp">' + esc(run.answer) + '</div>';
    h += '</div></div>';

    h += '<div class="fb-box"><div class="fb-head">Feedback</div>';
    h += '<div class="feedback-text">' + esc(run.feedback) + '</div></div>';

    h += '<details class="disc"><summary><span>Clinical Rationale</span><span class="hist-chev">▾</span></summary>';
    h += '<div class="disc-body">' + esc(r.rationale) + '</div></details>';

    if (r.resources && r.resources.length) {
      h += '<div class="res"><div class="res-h">📚 Learn More</div>';
      r.resources.forEach(function (res) {
        h += '<a href="' + esc(res.url) + '" target="_blank" rel="noopener noreferrer">' + esc(res.label) + ' ↗</a>';
      });
      h += '</div>';
    }

    h += '<div class="row">';
    h += run.roundIdx + 1 < total
      ? '<button class="btn" onclick="continueRound()">Continue to Round ' + (run.roundIdx + 2) + ' ›</button>'
      : '<button class="btn" onclick="finishCase()">See case summary ›</button>';
    h += '</div>';
  }

  h += '</div>';
  app.innerHTML = h;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderHistory() {
  if (!run.history.length) return '';
  var h = '<div class="hist">';
  run.history.forEach(function (entry, i) {
    h += '<details class="hist-item">';
    h += '<summary><span class="hist-num">' + (i + 1) + '</span>';
    h += '<span class="hist-label">' + esc(entry.stageLabel) + '</span>';
    h += '<span class="hist-chev">▾</span></summary>';
    h += '<div class="hist-body">';
    if (entry.reveal) {
      h += '<div class="sub">New clinical information</div><div class="sum-resp">' + esc(entry.reveal) + '</div>';
    }
    h += '<div class="sub">Prompt</div><div class="sum-resp">' + esc(entry.prompt) + '</div>';
    h += '<div class="sub">Your response</div><div class="sum-resp">' + esc(entry.userResponse) + '</div>';
    h += '<div class="sub">Feedback</div><div class="sum-resp">' + esc(entry.feedback) + '</div>';
    h += '</div></details>';
  });
  h += '</div>';
  return h;
}

// ---- submit a round ----
function submitRound() {
  var box = document.getElementById('inp');
  var resp = box ? (box.value || '').trim() : '';
  if (!resp || run.busy) return;

  var c = run.caseObj;
  var r = c.rounds[run.roundIdx];
  run.answer = resp;
  run.busy = true;
  run.error = null;
  renderRound();

  fetch('/api/assess-next/evaluate', {
    method: 'POST',
    headers: Object.assign({ 'content-type': 'application/json' }, authHeaders()),
    body: JSON.stringify({
      caseId: c.id,
      stage: r.stage,
      stageLabel: r.stageLabel,
      prompt: r.prompt,
      targetConcepts: r.targetConcepts,
      response: resp,
      vignette: c.intakeVignette,
      history: run.history.map(function (e) {
        return { stage: e.stage, stageLabel: e.stageLabel, prompt: e.prompt, userResponse: e.userResponse, reveal: e.reveal };
      })
    })
  }).then(function (res) {
    if (res.status === 401) {
      window.location.href = '/register.html?next=' + encodeURIComponent(location.pathname + location.search);
      return null;
    }
    return res.json().then(function (d) { return { ok: res.ok, d: d }; });
  }).then(function (out) {
    if (!out) return;
    run.busy = false;
    if (!out.ok || !out.d || !out.d.feedback) {
      run.error = (out.d && out.d.error) ? ('Scoring failed: ' + out.d.error) : 'Scoring failed — please try again.';
    } else {
      run.feedback = out.d.feedback;
    }
    renderRound();
  }).catch(function () {
    run.busy = false;
    run.error = 'Connection error — please try again.';
    renderRound();
  });
}

function continueRound() {
  var c = run.caseObj;
  var r = c.rounds[run.roundIdx];
  run.history.push({
    stage: r.stage, stageLabel: r.stageLabel, prompt: r.prompt,
    userResponse: run.answer, reveal: r.reveal || '', feedback: run.feedback
  });
  run.roundIdx += 1;
  run.feedback = null;
  run.answer = '';
  run.error = null;
  renderRound();
}

function finishCase() {
  var c = run.caseObj;
  var r = c.rounds[run.roundIdx];
  run.history.push({
    stage: r.stage, stageLabel: r.stageLabel, prompt: r.prompt,
    userResponse: run.answer, reveal: r.reveal || '', feedback: run.feedback
  });
  markCompleted(c.id);
  renderSummary();
}

function confirmExit() {
  if (run && run.history.length && !confirm('Leave this case? Your progress on it will not be saved.')) return;
  renderCaseSelect();
}

// ---- screen 3: summary ----
function renderSummary() {
  var c = run.caseObj;
  var h = '<button class="back" onclick="renderCaseSelect()">‹ All cases</button>';
  h += '<h1>What to Assess Next — ' + esc(c.clientName) + '</h1>';
  h += '<p class="lead">' + esc(c.demographics) + ' · ' + esc(c.category) + ' · ' + run.history.length + ' rounds completed</p>';

  run.history.forEach(function (entry, i) {
    h += '<div class="card" style="margin-bottom:12px">';
    h += '<span class="case-chips"><span class="badge b-sl">Round ' + (i + 1) + '</span>';
    h += '<span class="badge b-bl">' + esc(entry.stageLabel) + '</span></span>';
    h += '<div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--slate-500);margin:10px 0 4px">Your response</div>';
    h += '<div class="sum-resp clamp" id="sr' + i + '">' + esc(entry.userResponse) + '</div>';
    h += '<button class="expand" onclick="toggleClamp(' + i + ', this)">Show more</button>';
    h += '<div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--slate-500);margin:10px 0 4px">Feedback</div>';
    h += '<div class="sum-resp clamp" id="sf' + i + '">' + esc(entry.feedback) + '</div>';
    h += '<button class="expand" onclick="toggleClampF(' + i + ', this)">Show more</button>';
    h += '</div>';
  });

  h += '<div class="row"><button class="btn" onclick="renderCaseSelect()">Return to Cases</button></div>';
  app.innerHTML = h;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleClamp(i, btn) {
  var el = document.getElementById('sr' + i);
  if (!el) return;
  var open = el.classList.toggle('clamp');
  btn.textContent = open ? 'Show more' : 'Show less';
}
function toggleClampF(i, btn) {
  var el = document.getElementById('sf' + i);
  if (!el) return;
  var open = el.classList.toggle('clamp');
  btn.textContent = open ? 'Show more' : 'Show less';
}

// ---- voice input (same implementation as skills.html) ----
function startMic() {
  if (!SR) return;
  if (window._micRec) { doStartMic(); return; } // stop path skips notice
  try {
    if (!localStorage.getItem('prp_voice_notice_seen')) {
      document.getElementById('voice-modal-overlay').style.display = 'flex';
      return;
    }
  } catch (e) {}
  doStartMic();
}

function dismissVoiceModal() {
  try { localStorage.setItem('prp_voice_notice_seen', '1'); } catch (e) {}
  document.getElementById('voice-modal-overlay').style.display = 'none';
  doStartMic();
}

function doStartMic() {
  if (!SR) return;
  var btn = document.querySelector('button[onclick="startMic()"]');
  if (window._micRec) { try { window._micRec.stop(); } catch (e) {} window._micRec = null; if (btn) btn.textContent = '🎤 Mic'; return; }
  var inp = document.getElementById('inp');
  var base = (inp && inp.value) ? inp.value.trim() + ' ' : '';
  var rec = new SR();
  window._micRec = rec;
  rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  if (btn) btn.textContent = '⏹ Stop';
  rec.onresult = function (e) {
    var t = '';
    for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    var box = document.getElementById('inp');
    if (box) { box.value = base + t; autoResize(box); }
  };
  rec.onerror = function (ev) {
    console.warn('mic error:', ev.error);
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') alert('Microphone is blocked. Tap the lock icon in the address bar, allow the microphone, then try again.');
  };
  rec.onend = function () { window._micRec = null; var b = document.querySelector('button[onclick="startMic()"]'); if (b) b.textContent = '🎤 Mic'; };
  rec.start();
}

renderCaseSelect();
</script>

<script src="/activity-tracker.js" defer></script>
