<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PassReady Prep — Excerpt Answer Key</title>
<meta name="description" content="Check your answers to the PassReady Prep NCMHCE study guide excerpt cases, with the rationale for every option.">
<meta name="robots" content="noindex">
<style>
:root{
  --slate-900:#0F172A; --slate-800:#1E293B; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748B; --slate-400:#94A3B8; --slate-300:#CBD5E1; --slate-200:#E2E8F0; --white:#F8FAFC;
  --emerald:#10B981; --emerald-400:#34D399;
  --blue-400:#60A5FA; --amber-400:#FBBF24; --red-400:#F87171; --red-600:#DC2626; --purple-400:#A78BFA;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xl:16px; --r-lg:12px; --r-md:10px;
  --card:rgba(30,41,59,.55); --card-border:rgba(51,65,85,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(160deg,#0F172A 0%,#1E293B 50%,#0F172A 100%); background-attachment:fixed;
  color:var(--slate-200); font-family:var(--sans); font-size:16px; line-height:1.55;
}
.wrap{max-width:760px; margin:0 auto; padding:18px 16px 64px}
a{color:var(--emerald-400)}
header.site{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 2px 20px}
.brand-wrap{display:flex; align-items:center; gap:11px}
.brand-chip{width:38px; height:38px; border-radius:11px; background:rgba(16,185,129,.16); display:grid; place-items:center; flex:0 0 auto}
.brand-chip svg{width:21px; height:21px; color:var(--emerald-400)}
.brand{font-weight:700; font-size:18px; color:var(--white); letter-spacing:-.01em; line-height:1.1}
.brand .prep{color:var(--emerald-400)}
.brand small{display:block; font-weight:600; font-size:11.5px; color:var(--emerald-400); letter-spacing:.02em; margin-top:1px}
.exam-badge{font-size:12px; font-weight:700; color:var(--emerald-400); background:rgba(16,185,129,.14);
  border:1px solid rgba(16,185,129,.3); padding:5px 11px; border-radius:999px}
h1{font-size:25px; line-height:1.15; margin:0 0 6px; color:var(--white); font-weight:700; letter-spacing:-.01em}
h2{font-size:18px; margin:0 0 6px; color:var(--white); font-weight:700}
.lead{color:var(--slate-400); margin:0 0 18px}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-xl); padding:18px 20px; margin-bottom:14px}
.badge{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:4px 10px; border-radius:999px; text-transform:uppercase}
.b-purple{color:var(--purple-400); background:rgba(139,92,246,.15)}
.seg{margin-top:15px} .seg:first-child{margin-top:0}
.seg-label{font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px}
.seg-intake{color:var(--emerald-400)} .seg-s1{color:var(--blue-400)} .seg-s2{color:var(--amber-400)}
.seg-text{color:var(--slate-200); line-height:1.62}
.qnum{font-size:12px; color:var(--slate-500); margin-bottom:2px}
.qstem{font-size:16px; line-height:1.4; margin:4px 0 12px; color:var(--white); font-weight:600}
.opt{display:flex; gap:12px; align-items:flex-start; padding:11px 13px; margin-bottom:8px;
  border:1.5px solid var(--card-border); border-radius:var(--r-md); background:rgba(30,41,59,.5)}
.opt .key{flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:var(--slate-700); color:var(--slate-300);
  display:grid; place-items:center; font-weight:700; font-size:13px}
.opt .body{flex:1}
.opt .otext{color:var(--slate-200)}
.opt .why{font-size:13.5px; color:var(--slate-400); margin-top:4px}
.opt.correct{border-color:rgba(16,185,129,.55); background:rgba(16,185,129,.13)}
.opt.correct .key{background:var(--emerald); color:#04261C}
.opt.correct .otext{color:var(--white); font-weight:600}
.opt .mark{font-weight:700; color:var(--emerald-400); flex:0 0 auto}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font:inherit; font-weight:700; text-decoration:none;
  background:var(--emerald); color:#04261C; border:none; border-radius:var(--r-md); padding:13px 22px; transition:background .15s}
.btn:hover{background:var(--emerald-400)}
.cta{text-align:center; border-color:rgba(16,185,129,.35); background:rgba(16,185,129,.08)}
.cta p{color:var(--slate-300); margin:4px 0 14px}
:focus-visible{outline:2.5px solid var(--emerald-400); outline-offset:2px; border-radius:6px}
@media(max-width:520px){h1{font-size:22px} .wrap{padding:16px 14px 56px} .card{padding:14px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="brand-wrap">
      <span class="brand-chip" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
          <path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
      </span>
      <span class="brand">PassReady <span class="prep">Prep</span><small>NCMHCE clinical simulations</small></span>
    </div>
    <span class="exam-badge">ANSWER KEY</span>
  </header>
  <main id="app" aria-live="polite"><p class="lead">Loading…</p></main>
</div>

<script>
// Answer key for the free book-excerpt cases. The excerpt links here as
// /answers.html?case=<id>. Readers sign up for a free account first (the
// sign-up is the lead), then see every question with the keyed answer and the
// rationale for each option. Nothing is scored or saved on this page.
const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = ['A','B','C','D','E','F'];
const SEGS = [['intake','Intake','seg-intake'],['session1','Session 1','seg-s1'],['session2','Session 2','seg-s2']];

function token(){ try { return localStorage.getItem('prp_token') || ''; } catch(_){ return ''; } }

function toSignUp(){
  const back = location.pathname + location.search;
  location.replace('/register.html?next=' + encodeURIComponent(back));
}

function renderError(msg){
  app.innerHTML = '<div class="card"><h2>Answer key unavailable</h2><p class="lead">'+esc(msg)+'</p>'
    + '<a class="btn" href="/">Go to PassReady Prep ›</a></div>';
}

function optionsHtml(opts, textKey){
  let h = '';
  opts.forEach((o, i) => {
    h += '<div class="opt'+(o.isCorrect?' correct':'')+'"><span class="key">'+LETTERS[i]+'</span><div class="body">'
      + '<div class="otext">'+esc(o[textKey])+'</div>'
      + (o.rationale ? '<div class="why">'+esc(o.rationale)+'</div>' : '')
      + '</div>'+(o.isCorrect?'<span class="mark">✓ Correct</span>':'')+'</div>';
  });
  return h;
}

function render(c){
  let h = '<h1>'+esc(c.title)+'</h1>';
  h += '<p class="lead">Answer key — compare with the answers you chose in the book. The keyed answer is marked, with the rationale for every option.</p>';

  if(c.narrative){
    h += '<div class="card">';
    SEGS.forEach(([k,label,cls]) => {
      if(c.narrative[k]) h += '<div class="seg"><div class="seg-label '+cls+'">'+label+'</div><div class="seg-text">'+esc(c.narrative[k])+'</div></div>';
    });
    h += '</div>';
  }

  if(c.differentialOptions && c.differentialOptions.length){
    h += '<div class="card"><span class="badge b-purple">Diagnosis</span>';
    h += '<div class="qstem" style="margin-top:10px">What is the most likely primary diagnosis?</div>';
    h += optionsHtml(c.differentialOptions, 'name');
    if(c.diagnosticRationale) h += '<div class="why" style="font-size:14px;color:var(--slate-300);margin-top:10px"><strong style="color:var(--white)">Rationale:</strong> '+esc(c.diagnosticRationale)+'</div>';
    h += '</div>';
  }

  (c.questions || []).forEach((q, qi) => {
    h += '<div class="card"><div class="qnum">Question '+(qi+1)+'</div>';
    h += '<div class="qstem">'+esc(q.question)+'</div>';
    h += optionsHtml(q.options, 'text');
    h += '</div>';
  });

  h += '<div class="card cta"><h2>Want more practice? Subscribe today</h2>'
    + '<p>Hundreds more NCMHCE cases, timed mock exams that run like the real test, and a readiness score that tells you when you\'re ready.</p>'
    + '<a class="btn" href="/checkout.html?tier=monthly">Subscribe today ›</a></div>';

  app.innerHTML = h;
  document.title = c.title + ' — Answer Key — PassReady Prep';
}

async function init(){
  const id = new URLSearchParams(location.search).get('case');
  if(!id){ renderError('This link is missing its case. Use the link printed in your excerpt.'); return; }
  if(!token()){ toSignUp(); return; }
  try {
    const r = await fetch('/api/book/answers/'+encodeURIComponent(id), { headers: { Authorization: 'Bearer ' + token() } });
    if(r.status === 401){
      try { localStorage.removeItem('prp_token'); localStorage.removeItem('prp_user'); } catch(_){}
      toSignUp();
      return;
    }
    if(!r.ok){ renderError('We couldn\'t find that answer key. Check the link printed in your excerpt.'); return; }
    render(await r.json());
  } catch(_){
    renderError('We couldn\'t load the answer key. Please try again.');
  }
}

init();
</script>
</body>
</html>
